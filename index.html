<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Industry KI – Neon Minimal</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #020b14;
        font-family: "JetBrains Mono", monospace;
        color: #c8f7ff;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .shell {
        width: 900px;
        max-width: 95vw;
        height: 80vh;
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
        padding: 16px;
    }

    /* Minimal Panels */
    .panel {
        background: rgba(0, 20, 40, 0.6);
        border: 1px solid rgba(0,255,255,0.25);
        border-radius: 10px;
        padding: 14px;
        backdrop-filter: blur(4px);
    }

    /* Terminal */
    .terminal {
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .terminal-header {
        font-size: 12px;
        letter-spacing: 0.1em;
        color: #7ee7ff;
        margin-bottom: 8px;
    }

    .terminal-body {
        flex: 1;
        background: rgba(0, 10, 20, 0.7);
        border-radius: 8px;
        padding: 10px;
        overflow-y: auto;
        font-size: 13px;
        border: 1px solid rgba(0,255,255,0.15);
    }

    .line {
        margin: 6px 0;
        white-space: pre-wrap;
        opacity: 0;
        transform: translateY(4px);
        animation: fadeIn 0.2s forwards;
    }

    @keyframes fadeIn {
        to { opacity: 1; transform: translateY(0); }
    }

    .line.ai {
        color: #7ee7ff;
        text-shadow: 0 0 6px #00eaff;
    }

    /* Input */
    .input-line {
        display: flex;
        align-items: center;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(0,255,255,0.25);
    }

    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(0,255,255,0.5);
        color: #c8f7ff;
        font-size: 14px;
        padding: 4px;
        outline: none;
    }

    #userInput:focus {
        border-bottom-color: #00f2ff;
    }

    /* Avatar */
    .avatar-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        align-items: center;
    }

    .avatar-header {
        font-size: 12px;
        letter-spacing: 0.1em;
        color: #7ee7ff;
        margin-bottom: 10px;
    }

    .avatar-circle {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid rgba(0,255,255,0.4);
        background: radial-gradient(circle, #00eaff 0%, #001018 70%);
        box-shadow: 0 0 20px rgba(0,255,255,0.3);
    }
</style>
</head>

<body>

<div class="shell">
    <!-- Terminal -->
    <div class="panel terminal">
        <div class="terminal-header">[ FEBL INDUSTRY KI – MINIMAL MODE ]</div>

        <div class="terminal-body" id="terminalBody"></div>

        <div class="input-line">
            <span>>>> </span>
            <input id="userInput" type="text" autocomplete="off" placeholder="Befehl eingeben...">
        </div>
    </div>

    <!-- Avatar -->
    <div class="panel avatar-panel">
        <div class="avatar-header">AI CORE</div>
        <div class="avatar-circle"></div>
    </div>
</div>

<!-- WebLLM -->
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const terminalBody = document.getElementById("terminalBody");
const input = document.getElementById("userInput");

let engine = null;

/* Boot */
const bootLines = [
    "Systemstart...",
    "WebGPU prüfen... OK",
    "Lade lokales KI-Modell...",
    "Modell: Llama-3.1-8B-Instruct",
    "Febl Industry KI Minimal Mode aktiv."
];

bootLines.forEach((line, i) => {
    setTimeout(() => addLine(line, false, true), i * 400);
});

/* Engine laden */
(async () => {
    try {
        engine = await webllm.CreateMLCEngine("Llama-3.1-8B-Instruct");
        addLine("[KI] Modell geladen.", false, true);
    } catch (e) {
        addLine("[KI] Fehler beim Laden: " + e, false, true);
    }
})();

/* Eingabe */
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const cmd = input.value.trim();
        input.value = "";
        handleCommand(cmd);
    }
});

/* Command Handling */
function handleCommand(cmd) {
    if (!cmd) return;

    addLine(">>> " + cmd);

    const loading = addLine("[KI] Verarbeite...", true, true);

    if (!engine) {
        loading.remove();
        addLine("[KI] Modell lädt noch...", false, true);
        return;
    }

    callAI(cmd).then(answer => {
        loading.remove();
        addLine("[KI] " + answer, false, true);
    }).catch(err => {
        loading.remove();
        addLine("[KI] Fehler: " + err, false, true);
    });
}

/* Terminal-Ausgabe */
function addLine(text, noAnim = false, ai = false) {
    const div = document.createElement("div");
    div.className = "line";
    if (noAnim) div.style.animation = "none";
    if (ai) div.classList.add("ai");
    div.textContent = text;
    terminalBody.appendChild(div);
    terminalBody.scrollTop = terminalBody.scrollHeight;
    return div;
}

/* KI */
async function callAI(question) {
    const reply = await engine.chat.completions.create({
        messages: [
            { role: "system", content: "Du bist die Febl Industry KI im Minimal Mode. Antworte klar, direkt und futuristisch." },
            { role: "user", content: question }
        ]
    });

    return reply.choices[0].message.content;
}
</script>

</body>
</html>
