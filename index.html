<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl industry KI (open beta)</title>

<style>
    body {
        margin: 0;
        background: #020617;
        font-family: system-ui;
        color: #e5e7eb;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .app {
        width: 900px;
        height: 90vh;
        background: #0b1120;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.35);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }
    .header {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(148,163,184,0.35);
        display: flex;
        justify-content: space-between;
    }
    .chat {
        padding: 20px;
        overflow-y: auto;
    }
    .msg-row { margin-bottom: 14px; }
    .msg-label { font-size: 11px; color: #9ca3af; margin-bottom: 4px; }
    .msg-bubble {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 10px;
        white-space: pre-wrap;
    }
    .user .msg-bubble { background: #1d4ed8; margin-left: auto; }
    .ai .msg-bubble { background: #111827; border: 1px solid rgba(148,163,184,0.5); }
    .footer { padding: 14px 20px; border-top: 1px solid rgba(148,163,184,0.35); }
    #userInput {
        flex: 1;
        background: #020617;
        border: 1px solid rgba(148,163,184,0.5);
        border-radius: 10px;
        padding: 10px;
        color: #e5e7eb;
    }
    .send-btn {
        padding: 10px 16px;
        background: #2563eb;
        border-radius: 10px;
        border: none;
        color: #fff;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <span>Febl industry KI (open beta)</span>
        <span>bereit</span>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div style="display:flex; gap:10px;">
            <input id="userInput" placeholder="Frag etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
// ⭐ DEIN GROQ API KEY — HIER EINFÜGEN
const API_KEY = "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";

// ⭐ EINZIG FUNKTIONIERENDES MODELL (2026)
const MODEL = "llama-3.1-70b-versatile";

// ⭐ Groq API URL
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

let messages = [
    { role: "system", content: "Du bist Febl industry KI (open beta). Antworte freundlich und klar auf Deutsch." }
];

function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = "msg-row " + role;

    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = role === "user" ? "Du" : "Febl industry KI";

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";
    bubble.textContent = text;

    row.appendChild(label);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

async function sendToAPI(userText) {
    messages.push({ role: "user", content: userText });

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: MODEL,
                messages: messages
            })
        });

        const data = await res.json();

        if (!res.ok) {
            addMessage("ai", "API‑Fehler:\n" + JSON.stringify(data, null, 2));
            return;
        }

        const reply = data.choices[0].message.content;
        messages.push({ role: "assistant", content: reply });
        addMessage("ai", reply);

    } catch (e) {
        addMessage("ai", "Fehler:\n" + e.message);
    }
}

function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage("user", text);
    sendToAPI(text);
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});

addMessage("ai", "Hallo Felix! Ich bin **Febl industry KI (open beta)** — jetzt wirklich funktionierend.");
</script>

</body>
