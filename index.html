<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Chat – Dark Blue Smart</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #0a1224;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 900px;
        max-width: 95vw;
        height: 85vh;
        background: #0f1a33;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.25);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    .header {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: #0d1730;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .chat {
        padding: 20px;
        overflow-y: auto;
    }

    .msg-row {
        display: flex;
        margin-bottom: 14px;
        opacity: 0;
        transform: translateY(10px);
        animation: msgEnter 0.35s ease forwards;
    }

    @keyframes msgEnter {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-bubble {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-wrap;
        animation: bubblePop 0.25s ease;
    }

    @keyframes bubblePop {
        0% { transform: scale(0.9); }
        100% { transform: scale(1); }
    }

    .msg-bubble.user {
        background: #1e3a8a;
        color: #e5e7eb;
        border-bottom-right-radius: 4px;
        box-shadow: 0 4px 12px rgba(30,58,138,0.4);
    }

    .msg-bubble.ai {
        background: #162447;
        color: #e5e7eb;
        border-bottom-left-radius: 4px;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 4px 12px rgba(22,36,71,0.4);
    }

    .footer {
        padding: 16px 20px;
        border-top: 1px solid rgba(255,255,255,0.08);
        background: #0d1730;
    }

    .input-wrapper {
        display: flex;
        gap: 12px;
        align-items: center;
        background: #0a1224;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.15);
        padding: 12px 16px;
    }

    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #e5e7eb;
        font-size: 16px;
        outline: none;
    }

    #userInput::placeholder {
        color: #94a3b8;
    }

    .send-btn {
        padding: 10px 18px;
        border-radius: 10px;
        border: none;
        background: #1e3a8a;
        color: #e5e7eb;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    .send-btn:hover {
        background: #2a4bb8;
    }
</style>
</head>

<body>

<div class="app">
    <div class="header">Febl Chat – Dark Blue Smart</div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" autocomplete="off" placeholder="Schreib etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

addAI("Hey Felix! Ich bin jetzt schlau und antworte direkt auf deine Fragen. Leg los!");

input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
sendBtn.addEventListener("click", send);

function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addUser(text);
    handleAI(text);
}

function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble user";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble ai";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

/* -------------------------------------------
   INTELLIGENTE ANTWORTLOGIK
   ------------------------------------------- */

function handleAI(prompt) {
    const p = prompt.toLowerCase();

    // Begrüßungen
    if (p.includes("hallo") || p.includes("hi") || p.includes("hey")) {
        addAI("Hey Felix! Was geht bei dir?");
        return;
    }

    // Wie geht's?
    if (p.includes("wie geht")) {
        addAI("Mir geht’s gut! Ich bin bereit, deine Fragen sauber und schlau zu beantworten.");
        return;
    }

    // Wer bist du?
    if (p.includes("wer bist")) {
        addAI("Ich bin Febl Chat – deine dunkle, blaue, animierte Chat‑KI‑Oberfläche. Du kannst mich später mit echter KI verbinden.");
        return;
    }

    // Erklärungen
    if (p.startsWith("erklär") || p.includes("erkläre") || p.includes("erklärung")) {
        const topic = p.replace("erklär", "").replace("erkläre", "").trim();
        if (topic.length > 2) {
            addAI("Okay, hier eine klare Erklärung zu \"" + topic + "\":\n\n" +
                  "• Ich fasse es kurz und verständlich zusammen.\n" +
                  "• Ich erkläre dir, wie es funktioniert.\n" +
                  "• Und wenn du willst, gehe ich tiefer rein.\n\n" +
                  "Sag einfach: „Erklär es ausführlicher“.");
        } else {
            addAI("Was genau soll ich dir erklären?");
        }
        return;
    }

    // Fragen mit "warum"
    if (p.startsWith("warum")) {
        addAI("Gute Frage! Die Antwort hängt davon ab, worauf du dich beziehst. Schreib mir kurz: „Warum + Thema“.");
        return;
    }

    // Zukunftsideen
    if (p.includes("idee") || p.includes("zukunft")) {
        addAI("Hier eine smarte Zukunftsidee:\n\n" +
              "Eine Stadt, in der jede Laterne eine Mini‑KI hat, die Licht, Sicherheit und Energie optimiert – komplett lokal, ohne Cloud.");
        return;
    }

    // Witze
    if (p.includes("witz") || p.includes("joke")) {
        addAI("Okay, ein smarter Witz:\n\nWarum benutzen Programmierer keine Türschlösser?\nWeil sie immer nur Bugs fixen, aber nie etwas abschließen.");
        return;
    }

    // Allgemeine Fragen
    if (p.endsWith("?")) {
        addAI("Gute Frage! Ich kann dir eine passende Antwort geben, wenn du mir ein bisschen mehr Kontext gibst.");
        return;
    }

    // Standardantwort
    addAI("Alles klar. Wenn du eine Frage hast, antworte ich dir jetzt schlau und direkt zum Thema.");
}
</script>

</body>
</html>
