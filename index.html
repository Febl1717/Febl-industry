<script>
/* =========================================================
   CONFIG
========================================================= */
const API_KEY = "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";
const MODEL_TEXT = "groq/compound";
const MODEL_IMAGE = "groq/flux-schnell";
const API_CHAT = "https://api.groq.com/openai/v1/chat/completions";
const API_IMG = "https://api.groq.com/openai/v1/images/generations";

let lang = "de";
let theme = "purple";
let chats = [];
let activeChat = 0;

/* =========================================================
   VIEWPORT FIX (Mobile Keyboard Bug)
========================================================= */
function fixVH(){
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty("--vh", vh + "px");
}
window.addEventListener("resize", fixVH);

/* =========================================================
   SAFE INIT
========================================================= */
function safeInit(){
  if(!Array.isArray(chats)) chats = [[]];
  if(chats.length === 0) chats = [[]];
  if(typeof activeChat !== "number" || isNaN(activeChat)) activeChat = 0;
  if(activeChat < 0) activeChat = 0;
  if(activeChat >= chats.length) activeChat = chats.length - 1;
  if(!Array.isArray(chats[activeChat])) chats[activeChat] = [];
}

/* =========================================================
   UI TEXT
========================================================= */
const ui = {
  de:{
    header:"Febl KI",
    placeholder:"Nachricht eingeben…",
    chat:"Chat ",
    newchat:"Neuer Chat",
    delete:"Chat löschen",
    lang:"Sprache",
    theme:"Theme",
    home:"Home",
    about:"Über Febl",
    support:"Support"
  },
  en:{
    header:"Febl AI",
    placeholder:"Type a message…",
    chat:"Chat ",
    newchat:"New chat",
    delete:"Delete chat",
    lang:"Language",
    theme:"Theme",
    home:"Home",
    about:"About Febl",
    support:"Support"
  }
};

/* =========================================================
   STORAGE
========================================================= */
function saveAll(){
  localStorage.setItem("febl_chats", JSON.stringify(chats));
  localStorage.setItem("febl_lang", lang);
  localStorage.setItem("febl_theme", theme);
  localStorage.setItem("febl_activeChat", String(activeChat));
}

function loadAll(){
  try{
    const raw = localStorage.getItem("febl_chats");
    if(raw) chats = JSON.parse(raw);
  }catch(e){ chats = [[]]; }

  lang = localStorage.getItem("febl_lang") || "de";
  theme = localStorage.getItem("febl_theme") || "purple";
  activeChat = parseInt(localStorage.getItem("febl_activeChat") || "0");

  safeInit();
  applyTheme(theme);
  applyLanguage();
  renderTabs();
  renderChat();
}

/* =========================================================
   LANGUAGE
========================================================= */
function applyLanguage(){
  safeInit();

  document.getElementById("txt_header").textContent = ui[lang].header;
  document.getElementById("userInput").placeholder = ui[lang].placeholder;

  const map = [
    ["btn_newchat","newchat"],
    ["btn_deletechat","delete"],
    ["btn_lang","lang"],
    ["btn_theme","theme"],
    ["btn_home","home"],
    ["btn_about","about"],
    ["btn_support","support"],
    ["tabs_newchat","newchat"]
  ];

  map.forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(el) el.textContent = ui[lang][key];
  });

  renderTabs();
  saveAll();
}

/* =========================================================
   THEME
========================================================= */
function setVar(k,v){
  document.documentElement.style.setProperty(k,v);
}

function applyTheme(t){
  theme = t;

  if(t === "purple"){
    setVar("--c1","#0a0b1f");
    setVar("--c2","#13143a");
    setVar("--c3","#1a1b4a");
    setVar("--c4","#1e1f4d");
    setVar("--assistant","#1e1f4d");
    setVar("--user","#7c3aed");
    setVar("--accent","#7c3aed");
  }

  saveAll();
}

/* =========================================================
   CHAT SYSTEM
========================================================= */
function newChat(){
  chats.push([]);
  activeChat = chats.length - 1;
  safeInit();
  renderTabs();
  renderChat();
  saveAll();
}

function deleteChat(){
  if(chats.length > 1){
    chats.splice(activeChat,1);
    activeChat = Math.max(0, activeChat - 1);
  }else{
    chats[0] = [];
  }
  safeInit();
  renderTabs();
  renderChat();
  saveAll();
}

function renderTabs(){
  const list = document.getElementById("tabsList");
  list.innerHTML = "";

  chats.forEach((c,i)=>{
    const div = document.createElement("div");
    div.className = "tab-item";
    div.textContent = ui[lang].chat + (i+1);
    div.onclick = ()=>{
      activeChat = i;
      closeTabs();
      renderTabs();
      renderChat();
      saveAll();
    };
    list.appendChild(div);
  });
}

function renderChat(){
  const chatEl = document.getElementById("chat");
  chatEl.innerHTML = "";

  chats[activeChat].forEach(m=>{
    const row = document.createElement("div");
    row.className = "msg-row " + (m.role === "user" ? "user-row" : "assistant-row");

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";

    if(m.type === "image"){
      const img = document.createElement("img");
      img.src = m.url;
      img.style.width = "100%";
      img.style.borderRadius = "12px";
      bubble.appendChild(img);
    }else{
      bubble.textContent = m.content;
    }

    row.appendChild(bubble);
    chatEl.appendChild(row);
  });

  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMessage(role,text){
  chats[activeChat].push({role,content:text});
  renderChat();
  saveAll();
}

function addImage(url){
  chats[activeChat].push({role:"assistant",type:"image",url});
  renderChat();
  saveAll();
}

/* =========================================================
   LOADING BUBBLE
========================================================= */
function loading(){
  removeLoading();
  const chatEl = document.getElementById("chat");

  const row = document.createElement("div");
  row.className = "msg-row assistant-row";
  row.id = "loadingBubble";

  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.textContent = "…";

  row.appendChild(bubble);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeLoading(){
  const el = document.getElementById("loadingBubble");
  if(el) el.remove();
}

/* =========================================================
   TEXT AI
========================================================= */
async function sendToAI(text){
  loading();

  try{
    const history = [
      {role:"system",content: lang==="de" ? "Du antwortest freundlich." : "You respond friendly."},
      ...chats[activeChat],
      {role:"user",content:text}
    ];

    const res = await fetch(API_CHAT,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + API_KEY
      },
      body:JSON.stringify({
        model:MODEL_TEXT,
        messages:history,
        temperature:0.7
      })
    });

    const data = await res.json();
    removeLoading();

    const reply = data?.choices?.[0]?.message?.content || "⚠️ Keine Antwort.";
    addMessage("assistant", reply);

  }catch(e){
    removeLoading();
    addMessage("assistant","Fehler: " + e.message);
  }
}

/* =========================================================
   IMAGE AI
========================================================= */
async function generateImage(prompt){
  loading();

  try{
    const res = await fetch(API_IMG,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + API_KEY
      },
      body:JSON.stringify({
        model:MODEL_IMAGE,
        prompt:prompt,
        size:"1024x1024"
      })
    });

    const data = await res.json();
    removeLoading();

    const url = data?.data?.[0]?.url;
    if(!url){
      addMessage("assistant","⚠️ Fehler beim Bildgenerieren.");
      return;
    }

    addImage(url);

  }catch(e){
    removeLoading();
    addMessage("assistant","Fehler: " + e.message);
  }
}

/* =========================================================
   INPUT EVENTS
========================================================= */
document.getElementById("sendBtn").onclick = ()=>{
  const t = document.getElementById("userInput").value.trim();
  if(!t) return;
  document.getElementById("userInput").value = "";
  addMessage("user", t);
  sendToAI(t);
};

document.getElementById("imgBtn").onclick = ()=>{
  const t = document.getElementById("userInput").value.trim();
  if(!t){
    addMessage("assistant","Bitte gib einen Bild‑Prompt ein.");
    return;
  }
  document.getElementById("userInput").value = "";
  addMessage("user","🖼 " + t);
  generateImage(t);
};

/* =========================================================
   SHEETS
========================================================= */
function openMenu(){document.getElementById("menuSheet").classList.toggle("open")}
function closeMenu(){document.getElementById("menuSheet").classList.remove("open")}
function openTabs(){document.getElementById("tabsSheet").classList.toggle("open")}
function closeTabs(){document.getElementById("tabsSheet").classList.remove("open")}

document.getElementById("menuBtn").onclick = openMenu;
document.getElementById("tabsBtn").onclick = openTabs;

document.addEventListener("click",e=>{
  const menu = document.getElementById("menuSheet");
  const tabs = document.getElementById("tabsSheet");

  if(menu && !menu.contains(e.target) && e.target !== menuBtn){
    menu.classList.remove("open");
  }
  if(tabs && !tabs.contains(e.target) && e.target !== tabsBtn){
    tabs.classList.remove("open");
  }
});

/* MENU BUTTONS */
document.getElementById("btn_newchat").onclick = ()=>{newChat();closeMenu()};
document.getElementById("btn_deletechat").onclick = ()=>{deleteChat();closeMenu()};
document.getElementById("btn_lang").onclick = ()=>{lang=(lang==="de"?"en":"de");applyLanguage();closeMenu()};
document.getElementById("btn_theme").onclick = ()=>{theme=(theme==="purple"?"blue":"purple");applyTheme(theme);closeMenu()};
document.getElementById("btn_home").onclick = ()=>location.href="https://febl-industry-3.jimdosite.com/";
document.getElementById("btn_about").onclick = ()=>location.href="https://febl-industry-3.jimdosite.com/ueber-mich/";
document.getElementById("btn_support").onclick = ()=>location.href="https://febl-industry-3.jimdosite.com/kontakt/";
document.getElementById("tabs_newchat").onclick = ()=>{newChat();closeTabs()};

/* =========================================================
   INTRO FIX (100 % zuverlässig)
========================================================= */
function hideIntro(){
  const intro = document.getElementById("intro");
  if(!intro) return;

  intro.style.transition = "opacity 0.8s ease";
  intro.style.opacity = "0";

  setTimeout(()=>{
    intro.style.pointerEvents = "none";
    intro.style.display = "none";
  }, 900);
}

setTimeout(hideIntro, 1200);

/* =========================================================
   PARTICLES
========================================================= */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];
for(let i=0;i<60;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*3+1,
    dx:(Math.random()-0.5)*0.6,
    dy:(Math.random()-0.5)*0.6
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if(p.x < 0 || p.x > canvas.width) p.dx *= -1;
    if(p.y < 0 || p.y > canvas.height) p.dy *= -1;
  });

  requestAnimationFrame(animate);
}
animate();

/* =========================================================
   STARTUP
========================================================= */
fixVH();
loadAll();
addMessage("assistant", lang==="de"
  ? "Hallo ! Wie kann ich dir helfen?"
  : "Hello ! How can I help you?");
</script>
