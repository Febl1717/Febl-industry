<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Chat – Local KI</title>

<!-- WebLLM: KI direkt im Browser -->
<script src="https://cdn.jsdelivr.net/npm/webllm/dist/webllm.min.js"></script>

<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #0a1224;
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Loader */
    .loader-screen {
        position: absolute;
        inset: 0;
        background: #0a1224;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
        animation: fadeOut 0.8s ease forwards;
        animation-delay: 2.2s;
    }
    .loader-circle {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 6px solid rgba(255,255,255,0.1);
        border-top-color: #3b82f6;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    .loader-text {
        font-size: 18px;
        letter-spacing: 1px;
        color: #cbd5e1;
    }

    /* App */
    .app {
        width: 900px;
        height: 85vh;
        background: #0f1a33;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.25);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
        opacity: 0;
        animation: appFadeIn 1s ease forwards;
        animation-delay: 2.3s;
    }
    @keyframes appFadeIn { to { opacity: 1; } }

    .header {
        padding: 14px 20px;
        background: #0d1730;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        font-size: 16px;
        font-weight: 600;
    }

    .chat {
        padding: 20px;
        overflow-y: auto;
    }

    .msg-row {
        display: flex;
        margin-bottom: 14px;
        opacity: 0;
        transform: translateY(10px);
        animation: msgEnter 0.35s ease forwards;
    }
    @keyframes msgEnter {
        to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-bubble {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-wrap;
        animation: bubblePop 0.25s ease;
    }
    @keyframes bubblePop {
        0% { transform: scale(0.9); }
        100% { transform: scale(1); }
    }

    .msg-bubble.user {
        background: #1e3a8a;
        color: #e5e7eb;
    }
    .msg-bubble.ai {
        background: #162447;
        color: #e5e7eb;
        border: 1px solid rgba(255,255,255,0.08);
    }

    /* Typing */
    .typing {
        display: flex;
        gap: 6px;
        padding: 10px 16px;
        background: #162447;
        border-radius: 14px;
        width: fit-content;
        margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.08);
        opacity: 0;
        animation: msgEnter 0.35s ease forwards;
    }
    .dot {
        width: 8px;
        height: 8px;
        background: #3b82f6;
        border-radius: 50%;
        animation: blink 1.4s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
        0% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 0.2; }
    }

    /* Footer */
    .footer {
        padding: 16px 20px;
        background: #0d1730;
        border-top: 1px solid rgba(255,255,255,0.08);
    }
    .input-wrapper {
        display: flex;
        gap: 12px;
        background: #0a1224;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.15);
        padding: 12px 16px;
    }
    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #e5e7eb;
        font-size: 16px;
    }
    .send-btn {
        padding: 10px 18px;
        background: #1e3a8a;
        border-radius: 10px;
        border: none;
        color: #e5e7eb;
        cursor: pointer;
    }
    .send-btn:disabled {
        background: #0f1a33;
        color: #6b7280;
        cursor: not-allowed;
        opacity: 0.6;
    }
</style>
</head>

<body>

<!-- Loader -->
<div class="loader-screen">
    <div class="loader-circle"></div>
    <div class="loader-text">Febl Chat wird geladen…</div>
</div>

<!-- App -->
<div class="app">
    <div class="header">Febl Chat – Local KI</div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" placeholder="Schreib etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const cooldown = 1000;

let engine = null;
let modelReady = false;

/* KI im Browser initialisieren */
(async () => {
    try {
        addSystemInfo("Modell wird geladen… erster Start kann etwas dauern.");
        engine = await webllm.createEngine("Llama-3.2-3B-Instruct");
        modelReady = true;
        addSystemInfo("Modell bereit. Du kannst jetzt Fragen stellen.");
    } catch (e) {
        addSystemInfo("Fehler beim Laden der lokalen KI: " + e);
    }
})();

/* Begrüßung nach Loader */
setTimeout(() => {
    addAI("Hey Felix! Ich bin eine KI, die komplett im Browser läuft – ohne Server und ohne API‑Key.");
}, 2600);

/* Events */
input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
sendBtn.addEventListener("click", send);

/* Senden */
function send() {
    if (sendBtn.disabled) return;

    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addUser(text);
    typingAnimation();

    sendBtn.disabled = true;
    input.disabled = true;

    setTimeout(() => {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
    }, cooldown);
}

/* Nachrichten */
function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble user";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble ai";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addSystemInfo(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble ai";
    bubble.style.opacity = "0.7";
    bubble.style.fontSize = "13px";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

/* Typing */
function typingAnimation() {
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = `
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    `;
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    const userText = lastUserMessage();

    setTimeout(async () => {
        typing.remove();
        await callLocalAI(userText);
    }, 1200);
}

function lastUserMessage() {
    const bubbles = chat.querySelectorAll(".msg-bubble.user");
    return bubbles[bubbles.length - 1].textContent;
}

/* Lokale KI */
async function callLocalAI(prompt) {
    if (!modelReady || !engine) {
        addAI("Die KI lädt noch. Warte ein paar Sekunden und versuch es nochmal.");
        return;
    }

    try {
        const result = await engine.chat.completions.create({
            messages: [
                { role: "system", content: "Du bist eine hilfreiche, freundliche KI für Felix. Antworte klar und auf die Frage bezogen." },
                { role: "user", content: prompt }
            ]
        });

        const answer = result.choices[0].message.content;
        addAI(answer);
    } catch (e) {
        addAI("Fehler bei der lokalen KI: " + e);
    }
}
</script>

</body>
</html>
