<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Chat</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #f3f4f6;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #111827;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 900px;
        max-width: 95vw;
        height: 80vh;
        max-height: 95vh;
        background: #ffffff;
        border-radius: 16px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 20px 40px rgba(15,23,42,0.08);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    /* Header */
    .header {
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f9fafb;
    }

    .header-title {
        font-size: 15px;
        font-weight: 600;
    }

    .header-sub {
        font-size: 12px;
        color: #6b7280;
    }

    /* Chat */
    .chat {
        padding: 16px;
        overflow-y: auto;
        background: #f9fafb;
    }

    .msg-row {
        display: flex;
        margin-bottom: 10px;
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-bubble {
        max-width: 70%;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.4;
        white-space: pre-wrap;
    }

    .msg-bubble.user {
        background: #2563eb;
        color: #f9fafb;
        border-bottom-right-radius: 4px;
    }

    .msg-bubble.ai {
        background: #e5e7eb;
        color: #111827;
        border-bottom-left-radius: 4px;
    }

    /* Footer / Input */
    .footer {
        padding: 12px 16px;
        border-top: 1px solid #e5e7eb;
        background: #f9fafb;
    }

    .input-wrapper {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    #userInput {
        flex: 1;
        background: #ffffff;
        border-radius: 999px;
        border: 1px solid #d1d5db;
        padding: 8px 12px;
        font-size: 14px;
        outline: none;
    }

    #userInput:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 1px rgba(37,99,235,0.3);
    }

    .send-btn {
        padding: 8px 14px;
        border-radius: 999px;
        border: none;
        background: #2563eb;
        color: #f9fafb;
        font-size: 13px;
        cursor: pointer;
    }

    .send-btn:hover {
        background: #1d4ed8;
    }
</style>
</head>

<body>

<div class="app">
    <!-- Header -->
    <div class="header">
        <div>
            <div class="header-title">Febl Chat</div>
            <div class="header-sub">Clean · simpel · bereit für KI</div>
        </div>
        <div class="header-sub">Operator: Felix</div>
    </div>

    <!-- Chat -->
    <div class="chat" id="chat"></div>

    <!-- Footer -->
    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" autocomplete="off" placeholder="Schreib etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

addAI("Hey Felix, das ist dein cleanes Chat‑Interface. Du kannst hier schreiben, und ich antworte simpel lokal.");

input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
sendBtn.addEventListener("click", send);

function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addUser(text);
    handleAI(text);
}

function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble user";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble ai";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

/* einfache lokale „Antwortlogik“ */
function handleAI(prompt) {
    const p = prompt.toLowerCase();

    if (p.includes("wie gehts") || p.includes("wie geht es")) {
        addAI("Mir geht’s gut – ich bin dein cleanes Chat‑Interface und warte auf deine Ideen.");
        return;
    }

    if (p.includes("wer bist du")) {
        addAI("Ich bin Febl Chat – eine einfache Oberfläche, die du später mit echter KI verbinden kannst.");
        return;
    }

    addAI("Spannend. Ich bin noch eine simple Version ohne echte Online‑KI, aber du kannst mich als Basis für deine eigene KI‑Logik nutzen.");
}
</script>

</body>
