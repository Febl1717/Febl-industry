        font-size: 10px;
        color: #9ca3af;
        opacity: 0.8;
    }

        border-radius: 50%;

    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
        0% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 0.2; }
    }

    .footer {
        padding: 16px 20px;
        background: linear-gradient(90deg, #020617, #0b1120);
        border-top: 1px solid rgba(148,163,184,0.35);

    .input-wrapper {

</style>
</head>

    "wie geht": ["wie gehts", "wie geht es dir", "alles gut", "wie läufts", "wie geht es"],
    "hilfe": ["kannst du mir helfen", "brauch hilfe", "hilfe bitte", "ich brauche hilfe", "hilf mir"],
    "idee": ["inspiration", "vorschlag", "tipp", "idee", "brainstorm"],
    "erklär": ["erklaere", "erkläre", "erklär mal", "erklär bitte", "erklär mir"],
    "liste": ["mach mir eine liste", "liste erstellen", "auflisten", "liste machen", "punkte sammeln"]
};

function detectEmotion(text) {
    text = text.toLowerCase();
    if (text.includes("traurig") || text.includes("schlecht") || text.includes("down")) return "sad";
    if (text.includes("wütend") || text.includes("sauer") || text.includes("genervt")) return "angry";
    if (text.includes("glücklich") || text.includes("gut") || text.includes("nice") || text.includes("happy")) return "happy";
    return "neutral";
}

function emotionLabel(emotion) {
    if (emotion === "sad") return "Emotion: traurig";
    if (emotion === "angry") return "Emotion: wütend";
    if (emotion === "happy") return "Emotion: positiv";
    return "Emotion: neutral";
}

function matchIntent(text) {
    text = text.toLowerCase();
    for (const key in synonyms) {
        for (const syn of synonyms[key]) {
            if (text.includes(syn)) return key;
        }
    }
    return null;
}

function buildAnswer(emotion, coreText) {
    const start = toneStart[emotion][Math.floor(Math.random() * toneStart[emotion].length)];
    const mid = middleParts[Math.floor(Math.random() * middleParts.length)];
    const humor = humorParts[Math.floor(Math.random() * humorParts.length)];
    const end = endParts[Math.floor(Math.random() * endParts.length)];

    return `${start}\n\n${mid}\n\n${coreText}\n\n${humor}\n\n${end}`;
}

function feblCore(text) {
    const emotion = detectEmotion(text);
    memory.lastEmotion = emotion;
    memory.conversationHistory.push(text);

    const intent = matchIntent(text);

    if (intent === "wie geht") {
        const core = `Mir geht’s gut, ${USER_NAME} — ich bin bereit für alles, was du vorhast.`;
        return buildAnswer(emotion, core);
    }

    if (intent === "hilfe") {
        const core = `Klar ${USER_NAME}, sag einfach, wobei du Hilfe brauchst. Ich bin voll bei dir und sortier das mit dir.`;
        return buildAnswer(emotion, core);
    }

    if (intent === "idee") {
        const core = `${USER_NAME}, hier eine Idee: Bau dir ein KI‑Dashboard mit Panels für Status, Emotion, Befehle und Verlauf. Das wäre wie dein eigenes Kontrollzentrum.`;
        return buildAnswer(emotion, core);
    }

    if (intent === "liste") {
        const core = `Alles klar ${USER_NAME}, hier eine Beispiel‑Liste:\n\n• Idee 1: KI‑Dashboard\n• Idee 2: Sprach‑Assistent\n• Idee 3: Animierter Start‑Screen\n\nWenn du mir sagst, was du konkret brauchst, mach ich dir eine maßgeschneiderte Liste.`;
        return buildAnswer(emotion, core);
    }

    if (intent === "erklär") {
        const topic = text.replace(/erklär|erklaere|erkläre|erklär mal/i, "").trim();
        memory.lastTopic = topic || "das Thema";
        const core = `Ich erklär dir **${memory.lastTopic}**, ${USER_NAME}:\n\n${memory.lastTopic} ist etwas, das man gut versteht, wenn man es in kleine Teile zerlegt. Stell dir vor, du baust es wie ein Lego‑Set Schritt für Schritt zusammen.`;
        return buildAnswer(emotion, core);
    }

    if (text.toLowerCase().includes("ich heiße")) {
        const parts = text.split("ich heiße");
        const name = parts[1]?.trim() || USER_NAME;
        const core = `Nice, ${name}! Ich merk mir das. Im Code kannst du USER_NAME anpassen, damit ich dich immer so nenne.`;
        return buildAnswer(emotion, core);
    }

    const core = `Klingt interessant, ${USER_NAME}. Erzähl mir mehr darüber oder sag mir konkret, was du brauchst, dann kann ich dir gezielt helfen.`;
    return buildAnswer(emotion, core);
}

/* UI */

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const quickButtons = document.querySelectorAll(".quick-btn");

function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    row.innerHTML = `
        <div class="msg-bubble user">${text}</div>
        <img class="avatar" src="${avatarUser}">
    `;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text, emotion = null) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble ai";
    bubble.textContent = text;

    if (emotion) {
        const tag = document.createElement("div");
        tag.className = "emotion-tag";
        tag.textContent = emotionLabel(emotion);
        bubble.appendChild(tag);
    }

    row.innerHTML = `
        <img class="avatar" src="${avatarAI}">
    `;
    row.appendChild(bubble);

    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function typingAnimation() {
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = `
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    `;
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    setTimeout(() => typing.remove(), 1200);
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});

quickButtons.forEach(btn => {
    btn.addEventListener("click", () => {
        input.value = btn.dataset.text;
        send();
    });
});

function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addUser(text);
    typingAnimation();

    setTimeout(() => {
        const emotion = detectEmotion(text);
        const answer = feblCore(text);
        addAI(answer, emotion);
    }, 1200);
}

addAI(`Hey ${USER_NAME}! Ich bin Febl‑Core v3 – deine Offline‑KI mit 200+ Antwort‑Varianten im Dark‑Blue‑Style. Frag mich etwas oder nutz die Buttons unten.`, "happy");
