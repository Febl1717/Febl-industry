<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl industry KI (open beta)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}

/* Hintergrund */
body{
    background:#0f172a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#e5e7eb;
}

/* App Container – DESKTOP NORMAL */
.app{
    width:900px;
    height:90vh;
    background:#0f172a;
    border-radius:22px;
    border:1px solid rgba(148,163,184,0.35);
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* Header – DESKTOP NORMAL */
.header{
    padding:16px 18px;
    font-size:18px;
    font-weight:600;
    border-bottom:1px solid rgba(148,163,184,0.35);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.back-btn,
.clear-btn{
    padding:8px 12px;
    background:#3b82f6;
    border:none;
    border-radius:10px;
    color:white;
    font-size:14px;
    cursor:pointer;
}

.clear-btn{
    background:#ef4444;
}

/* Chat – DESKTOP NORMAL */
.chat{
    flex:1;
    padding:16px;
    overflow-y:auto;
}

.msg-row{
    margin-bottom:16px;
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.msg-label{
    font-size:11px;
    opacity:0.7;
    margin-bottom:4px;
}

.msg-bubble{
    max-width:80%;
    padding:12px 14px;
    border-radius:14px;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
}

.avatar{
    width:30px;
    height:30px;
    border-radius:999px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:16px;
    font-weight:600;
}

.user-row{
    flex-direction:row-reverse;
}

.user-row .msg-bubble{
    background:#1d4ed8;
}

.ai-row .msg-bubble{
    background:#1e293b;
    border:1px solid rgba(148,163,184,0.5);
}

.ai-avatar{
    background:#22c55e;
}

/* Footer – DESKTOP NORMAL */
.footer{
    padding:14px 16px;
    border-top:1px solid rgba(148,163,184,0.35);
    display:flex;
    gap:10px;
}

#userInput{
    flex:1;
    background:#020617;
    border:1px solid rgba(148,163,184,0.5);
    border-radius:12px;
    padding:12px;
    font-size:15px;
    color:#e5e7eb;
}

.send-btn{
    width:52px;
    height:42px;
    background:#3b82f6;
    border-radius:12px;
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

/* Intro – DESKTOP NORMAL */
.intro{
    position:fixed;
    inset:0;
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
    color:white;
    font-size:28px;
    opacity:1;
    transition:opacity 0.6s ease;
}

.intro.hidden{
    opacity:0;
    pointer-events:none;
}

/* ---------- HANDY: ALLES VIEL GRÖSSER ---------- */
@media(max-width:600px){

    .app{
        width:100%;
        height:100vh;
        border-radius:0;
        border:none;
        box-shadow:none;
    }

    .header{
        padding:24px;
        font-size:26px;
    }

    .back-btn,
    .clear-btn{
        padding:18px 22px;
        font-size:20px;
        border-radius:16px;
    }

    .chat{
        padding:22px;
    }

    .msg-row{
        margin-bottom:26px;
        gap:18px;
    }

    .msg-label{
        font-size:18px;
    }

    .msg-bubble{
        max-width:85%;
        padding:22px 24px;
        border-radius:22px;
        font-size:22px;
    }

    .avatar{
        width:46px;
        height:46px;
        font-size:24px;
    }

    .footer{
        padding:22px;
        gap:16px;
    }

    #userInput{
        padding:20px;
        font-size:22px;
        border-radius:18px;
    }

    .send-btn{
        width:80px;
        height:64px;
        font-size:28px;
        border-radius:18px;
    }

    .intro{
        font-size:34px;
    }
}
</style>
</head>
<body>

<!-- Start Intro -->
<div id="intro" class="intro">
    <div>Hallo!</div>
    <div style="font-size:18px;opacity:0.7;margin-top:10px;">Febl industry KI wird geladen…</div>
</div>

<div class="app">
    <div class="header">
        <button id="backBtn" class="back-btn">Zurück</button>
        <span>Febl industry KI</span>
        <button id="clearChatBtn" class="clear-btn">Löschen</button>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <input id="userInput" type="text" placeholder="Schreibe etwas …">
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
</div>

<script>
const API_KEY = "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";
const MODEL   = "groq/compound-mini";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

/* Intro sauber ausblenden */
setTimeout(() => {
    const intro = document.getElementById("intro");
    intro.classList.add("hidden");
    setTimeout(() => {
        intro.style.display = "none";
    }, 600);
}, 1500);

/* Verlauf */
let messages = JSON.parse(localStorage.getItem("feblChatHistory") || "[]");

function systemMessage(){
    return {
        role:"system",
        content:`Du bist Febl industry KI. Du antwortest IMMER auf Deutsch und verwendest keine Namen.`
    };
}

/* Startnachricht */
if(!messages.length){
    addMessage("ai","Hallo! Wie kann ich dir helfen?");
}else{
    messages.forEach(m=>renderMessage(m.role==="user"?"user":"ai",m.content));
}

function addMessage(role,text){
    messages.push({role:role==="user"?"user":"assistant",content:text});
    localStorage.setItem("feblChatHistory",JSON.stringify(messages));
    renderMessage(role,text);
}

function renderMessage(role,text){
    const row=document.createElement("div");
    row.className="msg-row "+(role==="user"?"user-row":"ai-row");

    const avatar=document.createElement("div");
    avatar.className="avatar "+(role==="user"?"user-avatar":"ai-avatar");
    avatar.textContent=role==="user"?"U":"F";

    const wrap=document.createElement("div");
    const label=document.createElement("div");
    label.className="msg-label";
    label.textContent=role==="user"?"Du":"Febl industry KI";

    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent=text;

    wrap.appendChild(label);
    wrap.appendChild(bubble);

    if(role==="user"){
        row.appendChild(wrap);
        row.appendChild(avatar);
    }else{
        row.appendChild(avatar);
        row.appendChild(wrap);
    }

    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
}

async function sendToAPI(userText){
    const history=[systemMessage(),...messages.slice(-10)];
    try{
        const res=await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${API_KEY}`
            },
            body:JSON.stringify({
                model:MODEL,
                messages:history
            })
        });
        const data=await res.json();
        if(!res.ok){
            addMessage("ai","API‑Fehler:\n"+JSON.stringify(data,null,2));
            return;
        }
        addMessage("ai",data.choices[0].message.content);
    }catch(e){
        addMessage("ai","Fehler:\n"+e.message);
    }
}

function send(){
    const text=input.value.trim();
    if(!text)return;
    input.value="";
    addMessage("user",text);
    sendToAPI(text);
}

sendBtn.onclick=send;
input.onkeydown=e=>{if(e.key==="Enter")send()};

document.getElementById("clearChatBtn").onclick=()=>{
    localStorage.removeItem("feblChatHistory");
    messages=[];
    chat.innerHTML="";
    addMessage("ai","Chat gelöscht. Hallo!");
};

document.getElementById("backBtn").onclick=()=>{
    window.location.href="https://febl-industry-3.jimdosite.com/";
};
</script>

</body>
</html>
