<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Febl KI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
:root{
--c1:#0a0b1f;--c2:#13143a;--c3:#1a1b4a;--c4:#1e1f4d;
--assistant:#1e1f4d;--user:#7c3aed;--accent:#7c3aed;
--t1:#fff;--t2:#e9d5ff;
}

body{background:var(--c1);color:var(--t1);height:100vh;display:flex;overflow:hidden}

#intro{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:9999;transition:1s}
#intro h1{font-size:48px;color:#fff;animation:introZoom 1.4s ease}
@keyframes introZoom{0%{transform:scale(0.4);opacity:0}100%{transform:scale(1);opacity:1}}

#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

.sidebar-chats{width:180px;background:var(--c2);display:flex;flex-direction:column;gap:10px;padding:12px;overflow-y:auto}
.chat-tab{padding:10px;background:var(--c4);border-radius:10px;cursor:pointer}
.chat-tab.active{background:var(--accent)}

.sidebar{width:60px;background:var(--c2);display:flex;flex-direction:column;gap:12px;padding:10px 6px}
.sidebar-icon{display:flex;align-items:center;gap:10px;padding:10px;background:var(--c4);border-radius:12px;cursor:pointer;color:#fff}

.settings-panel{position:fixed;right:-300px;top:0;width:300px;height:100%;background:var(--c2);padding:20px;display:flex;flex-direction:column;gap:20px;transition:.3s;z-index:999}
.settings-panel.open{right:0}
.settings-title{font-size:22px;font-weight:700;color:var(--accent)}
.settings-select{width:100%;padding:10px;border:none;border-radius:10px;background:var(--c4);color:#fff;font-size:16px}

.main{flex:1;display:flex;flex-direction:column;height:100vh;z-index:1}
.header{padding:16px 22px;font-size:22px;font-weight:700;background:var(--c3);color:var(--t2)}

.chat{flex:1;padding:20px;overflow-y:auto;background:transparent;position:relative;z-index:1}
.msg-row{margin-bottom:16px;display:flex;animation:bubbleIn .25s ease}
@keyframes bubbleIn{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
.msg-bubble{max-width:80%;padding:12px 16px;border-radius:18px;font-size:16px;line-height:1.5;white-space:pre-wrap}
.user-row{justify-content:flex-end}
.user-row .msg-bubble{background:var(--user)}
.assistant-row .msg-bubble{background:var(--assistant);border:1px solid rgba(255,255,255,.1)}

.loading{display:flex;gap:6px;padding:12px 16px;background:var(--assistant);border-radius:18px;width:40px}
.loading div{width:8px;height:8px;background:#fff;border-radius:50%;animation:load .8s infinite}
.loading div:nth-child(2){animation-delay:.2s}
.loading div:nth-child(3){animation-delay:.4s}
@keyframes load{0%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}100%{opacity:.2;transform:scale(1)}}

.input-bar{padding:10px 0;display:flex;justify-content:center;background:transparent;position:sticky;bottom:10px;z-index:50}
.input-box{width:94%;background:var(--c4);border:1px solid rgba(255,255,255,.18);padding:10px 16px;border-radius:30px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 22px rgba(0,0,0,.45);transition:.25s}
.input-box:focus-within{box-shadow:0 0 14px var(--accent),0 6px 22px rgba(0,0,0,.45)}

#userInput{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-size:18px;padding:6px 0}

.send-btn{width:44px;height:44px;background:var(--accent);border:none;border-radius:50%;color:var(--t1);font-size:22px;cursor:pointer;transition:.25s}
.send-btn:hover{transform:scale(1.1)}

.upload-btn{width:44px;height:44px;background:#444;border:none;border-radius:50%;color:#fff;font-size:22px;cursor:pointer}

@media(max-width:600px){
.sidebar-chats{display:none}
.sidebar{width:58px}
.input-box{width:94%;padding:10px 16px;border-radius:30px}
#userInput{font-size:18px;padding:6px 0}
.send-btn{width:44px;height:44px;font-size:22px}
}
</style>
</head>

<body class="theme-purple">

<div id="intro"><h1>Febl KI</h1></div>
<canvas id="particles"></canvas>

<div class="sidebar-chats" id="chatTabs"></div>

<div class="sidebar">
<div class="sidebar-icon" data-action="home">🏠</div>
<div class="sidebar-icon" data-action="about">👤</div>
<div class="sidebar-icon" data-action="support">💬</div>
<div class="sidebar-icon" data-action="newchat">➕</div>
<div class="sidebar-icon" data-action="settings">⚙️</div>
</div>

<div id="settingsPanel" class="settings-panel">
<div class="settings-title">Einstellungen</div>
<select id="themeSelect" class="settings-select">
<option value="purple">Lila</option>
<option value="blue">Blau</option>
<option value="red">Rot</option>
<option value="green">Grün</option>
<option value="black">Schwarz</option>
</select>
<select id="langSelect" class="settings-select">
<option value="de">Deutsch</option>
<option value="en">English</option>
</select>
</div>

<div class="main">
<div class="header" id="txt_header">Febl KI</div>
<div class="chat" id="chat"></div>

<div class="input-bar">
<div class="input-box">
<button class="upload-btn" id="uploadBtn">📎</button>
<input id="fileInput" type="file" style="display:none">
<input id="userInput" type="text" placeholder="Nachricht eingeben…">
<button class="send-btn" id="sendBtn">➤</button>
</div>
</div>
</div>

<script>
const API_KEY="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";
const MODEL="groq/compound-mini";
const API_URL="https://api.groq.com/openai/v1/chat/completions";

let lang="de";
let chats=[];
let activeChat=0;

function newChat(){
chats.push([]);
activeChat=chats.length-1;
renderTabs();
renderChat();
}

function renderTabs(){
const tabs=document.getElementById("chatTabs");
tabs.innerHTML="";
chats.forEach((c,i)=>{
const t=document.createElement("div");
t.className="chat-tab"+(i===activeChat?" active":"");
t.textContent="Chat "+(i+1);
t.onclick=()=>{activeChat=i;renderTabs();renderChat()};
tabs.appendChild(t);
});
}

function renderChat(){
const chat=document.getElementById("chat");
chat.innerHTML="";
chats[activeChat].forEach(m=>{
const row=document.createElement("div");
row.className="msg-row "+(m.role==="user"?"user-row":"assistant-row");
const bubble=document.createElement("div");
bubble.className="msg-bubble";
bubble.textContent=m.content;
row.appendChild(bubble);
chat.appendChild(row);
});
chat.scrollTop=chat.scrollHeight;
}

function addMessage(role,text){
chats[activeChat].push({role,content:text});
renderChat();
}

function loading(){
const chat=document.getElementById("chat");
const row=document.createElement("div");
row.className="msg-row assistant-row";
row.id="loadingBubble";
const bubble=document.createElement("div");
bubble.className="loading";
bubble.innerHTML="<div></div><div></div><div></div>";
row.appendChild(bubble);
chat.appendChild(row);
chat.scrollTop=chat.scrollHeight;
}

function removeLoading(){
const el=document.getElementById("loadingBubble");
if(el)el.remove();
}

async function sendToAI(text){
loading();
try{
const history=[
{role:"system",content:lang==="de"?"Du antwortest freundlich und hilfst dem Nutzer.":"You answer friendly and help the user."},
...chats[activeChat],
{role:"user",content:text}
];
const res=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},
body:JSON.stringify({model:MODEL,messages:history,temperature:0.7,max_tokens:1024,top_p:1})
});
const data=await res.json();
removeLoading();
if(data.error){addMessage("assistant","⚠️ Fehler: "+data.error.message);return;}
addMessage("assistant",data.choices[0].message.content);
}catch(err){
removeLoading();
addMessage("assistant","⚠️ Netzwerkfehler: "+err.message);
}
}

document.getElementById("sendBtn").onclick=()=>{
const text=document.getElementById("userInput").value.trim();
if(!text)return;
document.getElementById("userInput").value="";
addMessage("user",text);
sendToAI(text);
};

document.getElementById("userInput").onkeydown=e=>{
if(e.key==="Enter")document.getElementById("sendBtn").click();
};

document.getElementById("uploadBtn").onclick=()=>{
document.getElementById("fileInput").click();
};

document.getElementById("fileInput").onchange=e=>{
const file=e.target.files[0];
if(!file)return;
addMessage("user","📎 Datei: "+file.name);
sendToAI("Analysiere diese Datei: "+file.name);
};

document.getElementById("chat").ondrop=e=>{
e.preventDefault();
const file=e.dataTransfer.files[0];
if(!file)return;
addMessage("user","📎 Datei: "+file.name);
sendToAI("Analysiere dieses Bild: "+file.name);
};
document.getElementById("chat").ondragover=e=>e.preventDefault();

document.querySelectorAll(".sidebar-icon").forEach(icon=>{
icon.onclick=()=>{
const a=icon.dataset.action;
if(a==="home")window.location.href="https://febl-industry-3.jimdosite.com/";
if(a==="about")window.location.href="https://febl-industry-3.jimdosite.com/ueber-mich/";
if(a==="support")window.location.href="https://febl-industry-3.jimdosite.com/kontakt/";
if(a==="newchat")newChat();
if(a==="settings")document.getElementById("settingsPanel").classList.toggle("open");
};
});

document.getElementById("themeSelect").onchange=e=>{
document.body.className="theme-"+e.target.value;
};

document.getElementById("langSelect").onchange=e=>{
lang=e.target.value;
document.getElementById("txt_header").textContent=lang==="de"?"Febl KI":"Febl AI";
};

setTimeout(()=>{document.getElementById("intro").style.opacity="0"},1200);
setTimeout(()=>{document.getElementById("intro").style.display="none"},2200);

const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let particles=[];
for(let i=0;i<60;i++){
particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*3+1,dx:(Math.random()-0.5)*0.6,dy:(Math.random()-0.5)*0.6});
}
function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle="rgba(255,255,255,0.3)";
ctx.fill();
p.x+=p.dx;p.y+=p.dy;
if(p.x<0||p.x>canvas.width)p.dx*=-1;
if(p.y<0||p.y>canvas.height)p.dy*=-1;
});
requestAnimationFrame(animate);
}
animate();

newChat();
addMessage("assistant",lang==="de"?"Hallo Felix! Wie kann ich dir helfen?":"Hello Felix! How can I help you?");
</script>

</body>
</html>
