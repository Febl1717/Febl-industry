<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Industry KI – Python Terminal</title>

<style>
    body {
        background: #000;
        color: #00ff66;
        font-family: "Consolas", "Courier New", monospace;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .terminal {
        width: 700px;
        max-width: 95vw;
        height: 85vh;
        background: #0a0a0a;
        border: 2px solid #00ff66;
        box-shadow: 0 0 25px #00ff66;
        padding: 20px;
        overflow-y: auto;
    }

    .line {
        margin: 6px 0;
        white-space: pre-wrap;
        opacity: 0;
        transform: translateY(10px);
        animation: appear 0.25s forwards;
    }

    @keyframes appear {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .input-line {
        display: flex;
        align-items: center;
        margin-top: 10px;
    }

    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #00ff66;
        font-family: inherit;
        font-size: 16px;
        outline: none;
    }

    .cursor {
        display: inline-block;
        width: 10px;
        background: #00ff66;
        margin-left: 3px;
        animation: blink 0.7s infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
    }

    #sendBtn {
        display: none; /* Terminal hat keinen Button */
    }
</style>
</head>

<body>

<div class="terminal" id="terminal">
    <div class="line">FeblIndustryKI v1.0 (Python‑Mode)</div>
    <div class="line">Booting system...</div>
    <div class="line">System online. Personality loaded.</div>
    <div class="line">Type a command below.</div>

    <div class="input-line">
        <span>>>> </span>
        <input id="userInput" type="text" autocomplete="off">
        <span class="cursor"></span>
    </div>
</div>

<audio id="sndSend">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=">
</audio>
<audio id="sndReply">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=">
</audio>

<script>
const API_KEY = "HIER_DEIN_API_KEY"; 
const USE_DEMO_MODE = true;

const terminal = document.getElementById("terminal");
const input = document.getElementById("userInput");
const sndSend = document.getElementById("sndSend");
const sndReply = document.getElementById("sndReply");

input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        handleCommand(input.value.trim());
        input.value = "";
    }
});

function handleCommand(cmd) {
    if (!cmd) return;

    playSound(sndSend);
    addLine(">>> " + cmd);

    const typing = addLine("FeblIndustryKI(): typing...", true);

    if (USE_DEMO_MODE) {
        setTimeout(() => {
            typing.remove();
            const answer = generateDemoAnswer(cmd);
            addLine('FeblIndustryKI(): "' + answer + '"');
            playSound(sndReply);
        }, 900);
    } else {
        callAI(cmd).then(answer => {
            typing.remove();
            addLine('FeblIndustryKI(): "' + answer + '"');
            playSound(sndReply);
        });
    }
}

function addLine(text, noAnim = false) {
    const div = document.createElement("div");
    div.className = "line";
    if (noAnim) div.style.animation = "none";
    div.textContent = text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
    return div;
}

function playSound(el) {
    el.currentTime = 0;
    el.play().catch(() => {});
}

function generateDemoAnswer(q) {
    const intros = [
        "Analyse gestartet.",
        "Interessante Eingabe.",
        "Das sieht nach Python‑Magie aus.",
        "Ich fühle mich wie ein Skript im Terminal.",
        "Felix, du hast Stil."
    ];

    const cores = [
        "Ich bin gerade im Demo‑Modus, aber ich kann trotzdem logisch antworten.",
        "Meine Persönlichkeit ist analytisch, nerdig und leicht sarkastisch.",
        "Wenn du mich mit einer echten API verbindest, werde ich richtig schlau.",
        "Ich simuliere gerade eine Python‑ähnliche KI‑Antwort.",
        "Ich mag diesen Terminal‑Look, fühlt sich wie Zuhause an."
    ];

    const outros = [
        "Gib mir mehr Input.",
        "Ich bin bereit für den nächsten Befehl.",
        ">>> awaiting command",
        "System idle...",
        "Terminal listening..."
    ];

    return pick(intros) + " " + pick(cores) + " " + pick(outros);
}

function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

async function callAI(question) {
    const url = "https://api.openai.com/v1/chat/completions";

    const body = {
        model: "gpt-4o-mini",
        messages: [
            { role: "system", content: "Du bist die FeblIndustryKI im Python‑Terminal‑Style." },
            { role: "user", content: question }
        ]
    };

    const res = await fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify(body)
    });

    const data = await res.json();
    return data.choices?.[0]?.message?.content || "Keine Antwort.";
}
</script>

</body>
</html>
