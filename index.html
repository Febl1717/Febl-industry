<!DOCTYPE html>
<html><div class="ai-box">
    <h1>Febl Industry KI</h1>
    <p>System online. Awaiting input...</p>
</div>
<head>
<title>Febl Industry KI  (open beta )</title>
<style>.ai-box {
    background: #111;
    color: #0ff;
    padding: 20px;
    border-radius: 10px;
    border: 2px solid #0ff;
    box-shadow: 0 0 20px #0ff;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 10px #0ff; }
    50% { box-shadow: 0 0 25px #0ff; }
    100% { box-shadow: 0 0 10px #0ff; }
}
body {
    background: #111;
    color: #eee;
    font-family: Arial;
}
#chat {
    width: 400px;
    margin: auto;
    padding-top: 50px;
}
input {
    width: 300px;
    padding: 10px;
    border-radius: 5px;
    border: none;
}
button {
    padding: 10px;
    margin-left: 10px;
    border-radius: 5px;
    border: none;
    background: #444;
    color: #fff;
}
#antwort {
    margin-top: 20px;
    padding: 10px;
    background: #222;
    border-radius: 5px;
}
</style>
</head>
<body>

<div id="chat">
    <h2>Febl Industry KI  (open beta )</h2>
    <input id="frage" placeholder="Frage eingeben">
    <button onclick="senden()">Senden</button>
    <p id="antwort"></p>
</div>

<script>
async function senden() {
    let frage = document.getElementById("frage").value;

    let res = await fetch("https://febl-industry.onrender.com/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ frage })
    });

    let data = await res.json();
    document.getElementById("antwort").innerText = data.antwort;
}
</script>

</body>
</html>
