<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Febl KI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0b0d12;
    --panel:#11141b;
    --panel2:#171b24;
    --border:#272c38;
    --text:#f4f5f7;
    --muted:#9ca3af;
    --accent:#7c5cff;
    --accent2:#6244e8;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

button,
textarea,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* INTRO */

#intro{
    position:fixed;
    inset:0;
    background:#08090d;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    transition:.7s;
}

#intro.hide{
    opacity:0;
    pointer-events:none;
}

.intro-logo{
    text-align:center;
}

.intro-logo h1{
    font-size:58px;
    font-weight:800;
    letter-spacing:-3px;
}

.intro-logo p{
    color:#9ca3af;
    margin-top:10px;
}

/* APP */

.app{
    height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#0e1016;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:14px;
}

.logo{
    font-size:24px;
    font-weight:800;
    padding:12px;
    margin-bottom:12px;
}

.new-chat{
    width:100%;
    border:1px solid var(--border);
    background:var(--panel);
    color:white;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

.new-chat:hover{
    background:var(--panel2);
}

.history-title{
    color:var(--muted);
    font-size:12px;
    margin:8px 10px;
}

.history{
    flex:1;
    overflow-y:auto;
}

.history-item{
    padding:10px;
    border-radius:8px;
    color:#d1d5db;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:3px;
}

.history-item:hover{
    background:#181c25;
}

.history-item.active{
    background:#1c202b;
    color:white;
}

.sidebar-bottom{
    border-top:1px solid var(--border);
    padding-top:12px;
}

.sidebar-button{
    width:100%;
    background:none;
    color:#d1d5db;
    border:0;
    padding:10px;
    text-align:left;
    border-radius:8px;
}

.sidebar-button:hover{
    background:#181c25;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:#0d0f14;
}

.header-title{
    font-weight:700;
}

.header-right{
    display:flex;
    gap:8px;
}

.header-button{
    border:1px solid var(--border);
    background:var(--panel);
    color:#ddd;
    border-radius:8px;
    padding:8px 10px;
}

.header-button:hover{
    background:#1a1e27;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 20px 130px;
}

.chat-inner{
    max-width:900px;
    margin:auto;
}

.welcome{
    text-align:center;
    margin-top:12vh;
}

.welcome h2{
    font-size:38px;
    margin-bottom:12px;
}

.welcome p{
    color:var(--muted);
}

.message{
    display:flex;
    gap:12px;
    margin:25px 0;
    line-height:1.65;
}

.avatar{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#202431;
    font-size:14px;
}

.message.user .avatar{
    background:var(--accent);
}

.message-content{
    flex:1;
    min-width:0;
}

.message-name{
    font-size:13px;
    font-weight:700;
    margin-bottom:5px;
}

.message-text{
    white-space:pre-wrap;
    word-break:break-word;
    color:#e5e7eb;
}

.loading{
    display:flex;
    gap:5px;
    align-items:center;
}

.dot{
    width:7px;
    height:7px;
    background:#999;
    border-radius:50%;
    animation:bounce 1s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:translateY(0);
        opacity:.4;
    }
    40%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* INPUT */

.input-area{
    position:fixed;
    bottom:0;
    left:260px;
    right:0;
    background:linear-gradient(
        transparent,
        #0b0d12 35%
    );
    padding:25px 20px 18px;
}

.input-box{
    max-width:900px;
    margin:auto;
    background:#151821;
    border:1px solid #2b303c;
    border-radius:16px;
    padding:10px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

#messageInput{
    flex:1;
    background:none;
    border:0;
    outline:0;
    color:white;
    resize:none;
    min-height:42px;
    max-height:180px;
    padding:10px;
}

#messageInput::placeholder{
    color:#777d88;
}

.send-button{
    width:42px;
    height:42px;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:white;
    font-size:18px;
}

.send-button:hover{
    background:var(--accent2);
}

.send-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.bottom-info{
    max-width:900px;
    margin:7px auto 0;
    text-align:center;
    color:#666d79;
    font-size:11px;
}

/* MOBILE */

.mobile-menu{
    display:none;
}

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .mobile-menu{
        display:block;
    }

    .header{
        padding:0 12px;
    }

    .header-title{
        font-size:15px;
    }

    .chat{
        padding:20px 12px 125px;
    }

    .welcome h2{
        font-size:30px;
    }

    .input-area{
        left:0;
        padding:18px 10px 12px;
    }

    .message{
        gap:8px;
    }
}

/* LIGHT */

body.light{
    --bg:#f6f7f9;
    --panel:#ffffff;
    --panel2:#eeeeF2;
    --border:#dfe2e8;
    --text:#111318;
    --muted:#6b7280;
}

body.light .sidebar,
body.light .header{
    background:#fff;
}

body.light .message-text{
    color:#222;
}

body.light .input-box{
    background:#fff;
}
</style>
</head>

<body>

<!-- INTRO -->

<div id="intro">
    <div class="intro-logo">
        <h1>Febl KI</h1>
        <p>Dein persönlicher KI-Assistent</p>
    </div>
</div>

<!-- APP -->

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Febl KI
        </div>

        <button class="new-chat" onclick="newChat()">
            + Neuer Chat
        </button>

        <div class="history-title">
            CHATVERLAUF
        </div>

        <div id="history" class="history"></div>

        <div class="sidebar-bottom">

            <button class="sidebar-button" onclick="toggleTheme()">
                🌓 Design ändern
            </button>

            <button class="sidebar-button" onclick="clearHistory()">
                🗑 Chatverlauf löschen
            </button>

            <button class="sidebar-button"
                onclick="window.location.href='https://febl-industry-3.jimdosite.com/'">
                🌐 Website
            </button>

        </div>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <header class="header">

            <div class="header-title">
                <span class="mobile-menu">☰</span>
                Febl KI
            </div>

            <div class="header-right">

                <button class="header-button" onclick="toggleLanguage()">
                    DE
                </button>

                <button class="header-button" onclick="toggleTheme()">
                    ☾
                </button>

            </div>

        </header>

        <!-- CHAT -->

        <section id="chat" class="chat">

            <div class="chat-inner">

                <div id="welcome" class="welcome">

                    <h2>Wie kann ich dir helfen?</h2>

                    <p>
                        Frag Febl KI alles, was du wissen möchtest.
                    </p>

                </div>

                <div id="messages"></div>

            </div>

        </section>

        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Nachricht an Febl KI..."
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                ></textarea>

                <button
                    id="sendButton"
                    class="send-button"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

            <div class="bottom-info">
                Febl KI kann Fehler machen. Überprüfe wichtige Informationen.
            </div>

        </div>

    </main>

</div>

<script>

/* =========================================================
   GEMINI KONFIGURATION
   ========================================================= */

/*
   WICHTIG:

   Für einen öffentlichen Webauftritt solltest du den API-Key
   NICHT direkt hier eintragen.

   Diese Version ist für TESTS gedacht.

   Erstelle einen NEUEN Gemini API-Key und trage ihn hier ein.
*/

const API_KEY = "AQ.Ab8RN6IGF1V9uaZ2MvC563Xh7YZMTCn5Q0I2YAKmHAKIQPEZvA";

const MODEL = "gemini-2.5-flash";

const API_URL =
    "https://generativelanguage.googleapis.com/v1beta/models/" +
    MODEL +
    ":generateContent";


/* =========================================================
   APP DATEN
   ========================================================= */

let chats =
    JSON.parse(localStorage.getItem("febl_chats") || "{}");

let activeChat =
    localStorage.getItem("febl_active_chat");

let language =
    localStorage.getItem("febl_language") || "de";

let isLoading = false;


/* =========================================================
   START
   ========================================================= */

window.addEventListener("load", () => {

    setTimeout(() => {
        document.getElementById("intro").classList.add("hide");
    }, 900);

    if (!activeChat) {
        newChat();
    } else {

        if (!chats[activeChat]) {
            chats[activeChat] = [];
        }

        renderHistory();
        renderMessages();
    }

});


/* =========================================================
   NEUER CHAT
   ========================================================= */

function newChat(){

    const id =
        "chat_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,8);

    chats[id] = [];

    activeChat = id;

    saveChats();

    renderHistory();
    renderMessages();

    document.getElementById("messageInput").focus();
}


/* =========================================================
   SPEICHERN
   ========================================================= */

function saveChats(){

    localStorage.setItem(
        "febl_chats",
        JSON.stringify(chats)
    );

    localStorage.setItem(
        "febl_active_chat",
        activeChat
    );

}


/* =========================================================
   CHATVERLAUF
   ========================================================= */

function renderHistory(){

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    Object.keys(chats)
        .reverse()
        .forEach(id => {

            const item =
                document.createElement("div");

            item.className =
                "history-item" +
                (id === activeChat ? " active" : "");

            const messages = chats[id] || [];

            const firstUserMessage =
                messages.find(
                    message => message.role === "user"
                );

            item.textContent =
                firstUserMessage
                    ? firstUserMessage.content.substring(0, 35)
                    : "Neuer Chat";

            item.onclick = () => {

                activeChat = id;

                saveChats();

                renderHistory();
                renderMessages();

            };

            history.appendChild(item);

        });

}


/* =========================================================
   NACHRICHTEN DARSTELLEN
   ========================================================= */

function renderMessages(){

    const container =
        document.getElementById("messages");

    const welcome =
        document.getElementById("welcome");

    container.innerHTML = "";

    const messages =
        chats[activeChat] || [];

    if(messages.length === 0){

        welcome.style.display = "block";

        return;

    }

    welcome.style.display = "none";

    messages.forEach(message => {

        addMessageToScreen(
            message.role,
            message.content
        );

    });

}


/* =========================================================
   NACHRICHT AUF SCREEN
   ========================================================= */

function addMessageToScreen(role, text){

    const container =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message " +
        (role === "user" ? "user" : "assistant");

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        role === "user"
            ? "Du"
            : "F";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        role === "user"
            ? "Du"
            : "Febl KI";

    const textElement =
        document.createElement("div");

    textElement.className =
        "message-text";

    textElement.textContent = text;

    content.appendChild(name);
    content.appendChild(textElement);

    message.appendChild(avatar);
    message.appendChild(content);

    container.appendChild(message);

    scrollToBottom();
}


/* =========================================================
   LOADING
   ========================================================= */

function showLoading(){

    const container =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.id = "loadingMessage";

    message.className =
        "message assistant";

    message.innerHTML = `
        <div class="avatar">F</div>

        <div class="message-content">

            <div class="message-name">
                Febl KI
            </div>

            <div class="loading">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>
    `;

    container.appendChild(message);

    scrollToBottom();
}


function removeLoading(){

    const loading =
        document.getElementById("loadingMessage");

    if(loading){
        loading.remove();
    }

}


/* =========================================================
   SENDEN
   ========================================================= */

async function sendMessage(){

    if(isLoading){
        return;
    }

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    if(
        API_KEY === "DEIN_NEUER_GEMINI_API_KEY"
        || !API_KEY
    ){

        alert(
            "Bitte trage zuerst deinen neuen Gemini API-Key in API_KEY ein."
        );

        return;
    }

    isLoading = true;

    sendButton.disabled = true;

    input.value = "";

    autoResize(input);

    document.getElementById("welcome").style.display =
        "none";


    /* USER NACHRICHT */

    chats[activeChat].push({
        role: "user",
        content: text
    });

    addMessageToScreen(
        "user",
        text
    );

    saveChats();

    showLoading();


    try{

        const answer =
            await sendToAI(text);

        removeLoading();

        chats[activeChat].push({
            role: "assistant",
            content: answer
        });

        addMessageToScreen(
            "assistant",
            answer
        );

        saveChats();

        renderHistory();

    }
    catch(error){

        removeLoading();

        console.error(error);

        const errorMessage =
            "Fehler bei der Verbindung mit der KI.\n\n" +
            error.message;

        addMessageToScreen(
            "assistant",
            errorMessage
        );

    }
    finally{

        isLoading = false;

        sendButton.disabled = false;

        input.focus();

    }

}


/* =========================================================
   GEMINI API
   ========================================================= */

async function sendToAI(text){

    /*
       Gemini erwartet NICHT:

       Authorization: Bearer ...

       sondern:

       x-goog-api-key
    */


    const contents = [];


    /* System-Anweisung */

    contents.push({

        role: "user",

        parts: [

            {
                text:
                    "Du bist Febl KI, ein hilfreicher, " +
                    "freundlicher und intelligenter " +
                    "KI-Assistent. Antworte auf Deutsch, " +
                    "wenn der Benutzer Deutsch schreibt. " +
                    "Antworte klar und verständlich."
            }

        ]

    });

    contents.push({

        role: "model",

        parts: [

            {
                text:
                    "Verstanden. Ich bin Febl KI und " +
                    "helfe dem Benutzer so gut wie möglich."
            }

        ]

    });


    /* Alten Chatverlauf hinzufügen */

    const messages =
        chats[activeChat] || [];

    messages.forEach(message => {

        if(
            message.role !== "user" &&
            message.role !== "assistant"
        ){
            return;
        }

        contents.push({

            role:
                message.role === "assistant"
                    ? "model"
                    : "user",

            parts: [

                {
                    text: String(
                        message.content || ""
                    )
                }

            ]

        });

    });


    /* Aktuelle Nachricht */

    /*
       Die aktuelle Nachricht befindet sich bereits
       in chats[activeChat], deshalb muss sie hier
       NICHT noch einmal hinzugefügt werden.
    */


    const response =
        await fetch(
            API_URL,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "x-goog-api-key":
                        API_KEY

                },

                body: JSON.stringify({

                    contents: contents,

                    generationConfig: {

                        temperature: 0.7,

                        maxOutputTokens: 2048

                    }

                })

            }
        );


    let data;

    try{

        data =
            await response.json();

    }
    catch{

        throw new Error(
            "Die API hat keine gültige Antwort geliefert."
        );

    }


    /* API FEHLER */

    if(!response.ok){

        const apiMessage =
            data?.error?.message ||
            "Unbekannter Gemini API Fehler.";

        throw new Error(
            "Gemini API Fehler (" +
            response.status +
            "): " +
            apiMessage
        );

    }


    /* ANTWORT */

    const parts =
        data?.candidates?.[0]?.content?.parts;

    if(!Array.isArray(parts)){

        throw new Error(
            "Gemini hat keinen Text zurückgegeben."
        );

    }


    const answer =
        parts
            .map(part => part.text || "")
            .join("")
            .trim();


    if(!answer){

        throw new Error(
            "Gemini hat eine leere Antwort zurückgegeben."
        );

    }


    return answer;

}


/* =========================================================
   ENTER / SHIFT+ENTER
   ========================================================= */

function handleKeyDown(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   TEXTAREA GRÖSSE
   ========================================================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "input",
        function(){

            autoResize(this);

        }
    );


function autoResize(element){

    element.style.height = "auto";

    element.style.height =
        Math.min(
            element.scrollHeight,
            180
        ) + "px";

}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollToBottom(){

    const chat =
        document.getElementById("chat");

    setTimeout(() => {

        chat.scrollTop =
            chat.scrollHeight;

    }, 50);

}


/* =========================================================
   CHATVERLAUF LÖSCHEN
   ========================================================= */

function clearHistory(){

    const confirmDelete =
        confirm(
            "Möchtest du wirklich deinen gesamten Chatverlauf löschen?"
        );

    if(!confirmDelete){
        return;
    }

    chats = {};

    localStorage.removeItem("febl_chats");
    localStorage.removeItem("febl_active_chat");

    newChat();

}


/* =========================================================
   DESIGN
   ========================================================= */

function toggleTheme(){

    document.body.classList.toggle("light");

    localStorage.setItem(
        "febl_theme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );

}


/* gespeichertes Design */

if(
    localStorage.getItem("febl_theme") === "light"
){

    document.body.classList.add("light");

}


/* =========================================================
   SPRACHE
   ========================================================= */

function toggleLanguage(){

    language =
        language === "de"
            ? "en"
            : "de";

    localStorage.setItem(
        "febl_language",
        language
    );

    const input =
        document.getElementById("messageInput");

    if(language === "en"){

        input.placeholder =
            "Message Febl AI...";

    }
    else{

        input.placeholder =
            "Nachricht an Febl KI...";

    }

}


/* =========================================================
   ENDE
   ========================================================= */

</script>

</body>
</html>
