<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl industry KI (open beta)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}

/* Hintergrund */
body{
    background:#0f172a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#e5e7eb;
}

/* App Container */
.app{
    width:900px;
    height:90vh;
    background:#0f172a;
    border-radius:22px;
    border:1px solid rgba(148,163,184,0.35);
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* Handy Vollbild */
@media(max-width:600px){
    .app{
        width:100%;
        height:100vh;
        border-radius:0;
        border:none;
        box-shadow:none;
    }
}

/* Header */
.header{
    padding:20px;
    font-size:22px;
    font-weight:600;
    border-bottom:1px solid rgba(148,163,184,0.35);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* Buttons im Header */
.back-btn{
    padding:14px 20px;
    background:#3b82f6;
    border:none;
    border-radius:14px;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.clear-btn{
    padding:14px 20px;
    background:#ef4444;
    border:none;
    border-radius:14px;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* Chat Bereich */
.chat{
    flex:1;
    padding:20px;
    overflow-y:auto;
}

/* Nachrichten */
.msg-row{
    margin-bottom:24px;
    display:flex;
    align-items:flex-start;
    gap:16px;
}

.msg-label{
    font-size:15px;
    opacity:0.7;
    margin-bottom:6px;
}

.msg-bubble{
    max-width:85%;
    padding:18px 20px;
    border-radius:20px;
    font-size:20px;
    line-height:1.6;
    white-space:pre-wrap;
}

/* Avatare */
.avatar{
    width:45px;
    height:45px;
    border-radius:999px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:600;
}

/* Nutzer */
.user-row{
    flex-direction:row-reverse;
}

.user-row .msg-bubble{
    background:#1d4ed8;
}

/* KI */
.ai-row .msg-bubble{
    background:#1e293b;
    border:1px solid rgba(148,163,184,0.5);
}

.ai-avatar{
    background:#22c55e;
}

/* Footer */
.footer{
    padding:20px;
    border-top:1px solid rgba(148,163,184,0.35);
    display:flex;
    gap:16px;
}

/* Eingabe */
#userInput{
    flex:1;
    background:#020617;
    border:1px solid rgba(148,163,184,0.5);
    border-radius:16px;
    padding:18px;
    font-size:20px;
    color:#e5e7eb;
}

/* Senden Button */
.send-btn{
    width:80px;
    height:70px;
    background:#3b82f6;
    border-radius:16px;
    border:none;
    color:#fff;
    font-size:32px;
    cursor:pointer;
}

/* Intro */
.intro{
    position:fixed;
    inset:0;
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
    color:white;
    font-size:40px;
    opacity:1;
    transition:opacity 0.6s ease;
}

.intro.hidden{
    opacity:0;
    pointer-events:none;
}
</style>
</head>
<body>

<!-- Start Intro -->
<div id="intro" class="intro">
    <div>Hallo!</div>
    <div style="font-size:22px;opacity:0.7;margin-top:10px;">Febl industry KI wird geladen…</div>
</div>

<div class="app">
    <div class="header">
        <button id="backBtn" class="back-btn">Zurück</button>
        <span>Febl industry KI</span>
        <button id="clearChatBtn" class="clear-btn">Löschen</button>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <input id="userInput" type="text" placeholder="Schreibe etwas …">
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
</div>

<script>
/* API */
const API_KEY = "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";
const MODEL   = "groq/compound-mini";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

/* Intro Fix */
setTimeout(() => {
    const intro = document.getElementById("intro");
    intro.classList.add("hidden");

    setTimeout(() => {
        intro.style.display = "none";
    }, 600);
}, 1500);

/* Chat-Verlauf */
let messages = JSON.parse(localStorage.getItem("feblChatHistory") || "[]");

/* System-Prompt */
function systemMessage(){
    return {
        role:"system",
        content:`Du bist Febl industry KI. Du antwortest IMMER auf Deutsch und verwendest keine Namen.`
    };
}

/* Startnachricht */
if(!messages.length){
    addMessage("ai","Hallo! Wie kann ich dir helfen?");
}else{
    messages.forEach(m=>renderMessage(m.role==="user"?"user":"ai",m.content));
}

/* Nachricht speichern */
function addMessage(role,text){
    messages.push({role:role==="user"?"user":"assistant",content:text});
    localStorage.setItem("feblChatHistory",JSON.stringify(messages));
    renderMessage(role,text);
}

/* Render */
function renderMessage(role,text){
    const row=document.createElement("div");
    row.className="msg-row "+(role==="user"?"user-row":"ai-row");

    const avatar=document.createElement("div");
    avatar.className="avatar "+(role==="user"?"user-avatar":"ai-avatar");
    avatar.textContent=role==="user"?"U":"F";

    const wrap=document.createElement("div");
    const label=document.createElement("div");
    label.className="msg-label";
    label.textContent=role==="user"?"Du":"Febl industry KI";

    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent=text;

    wrap.appendChild(label);
    wrap.appendChild(bubble);

    if(role==="user"){
        row.appendChild(wrap);
        row.appendChild(avatar);
    }else{
        row.appendChild(avatar);
        row.appendChild(wrap);
    }

    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
}

/* API */
async function sendToAPI(userText){
    const history=[systemMessage(),...messages.slice(-10)];

    try{
        const res=await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${API_KEY}`
            },
            body:JSON.stringify({
                model:MODEL,
                messages:history
            })
        });

        const data=await res.json();

        if(!res.ok){
            addMessage("ai","API‑Fehler:\n"+JSON.stringify(data,null,2));
            return;
        }

        addMessage("ai",data.choices[0].message.content);

    }catch(e){
        addMessage("ai","Fehler:\n"+e.message);
    }
}

/* Senden */
function send(){
    const text=input.value.trim();
    if(!text)return;
    input.value="";
    addMessage("user",text);
    sendToAPI(text);
}

sendBtn.onclick=send;
input.onkeydown=e=>{if(e.key==="Enter")send()};

/* Chat löschen */
document.getElementById("clearChatBtn").onclick=()=>{
    localStorage.removeItem("feblChatHistory");
    messages=[];
    chat.innerHTML="";
    addMessage("ai","Chat gelöscht. Hallo!");
};

/* Zurück Button */
document.getElementById("backBtn").onclick=()=>{
    window.location.href="https://febl-industry-3.jimdosite.com/";
};
</script>

</body>
</html>
