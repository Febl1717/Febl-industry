<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl industry KI (open beta)</title>

<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #020617;
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 900px;
        height: 90vh;
        background: #0b1120;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.35);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    .header {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(148,163,184,0.35);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(34,197,94,0.8);
        margin-right: 6px;
        display: inline-block;
    }

    .chat {
        padding: 20px;
        overflow-y: auto;
    }

    .msg-row {
        margin-bottom: 14px;
    }

    .msg-label {
        font-size: 11px;
        margin-bottom: 4px;
        color: #9ca3af;
    }

    .msg-bubble {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
    }

    .user {
        text-align: right;
    }

    .user .msg-bubble {
        margin-left: auto;
        background: #1d4ed8;
        color: #e5e7eb;
    }

    .ai .msg-bubble {
        background: #111827;
        border: 1px solid rgba(148,163,184,0.5);
    }

    .footer {
        padding: 14px 20px;
        border-top: 1px solid rgba(148,163,184,0.35);
    }

    .input-wrapper {
        display: flex;
        gap: 10px;
    }

    #userInput {
        flex: 1;
        background: #020617;
        border-radius: 10px;
        border: 1px solid rgba(148,163,184,0.5);
        color: #e5e7eb;
        padding: 10px 12px;
        font-size: 14px;
    }

    .send-btn {
        padding: 10px 16px;
        background: #2563eb;
        border-radius: 10px;
        border: none;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        .app {
            width: 100%;
            height: 100vh;
            border-radius: 0;
        }
        .chat {
            padding: 12px;
        }
        .msg-bubble {
            max-width: 100%;
            font-size: 15px;
            padding: 12px 16px;
        }
        #userInput {
            font-size: 16px;
            padding: 14px;
        }
        .send-btn {
            padding: 14px 18px;
            font-size: 16px;
        }
    }
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <span>Febl industry KI (open beta)</span>
        <span><span class="status-dot"></span>bereit</span>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" placeholder="Frag etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
// ⭐ GROQ API
const API_KEY = "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";

// ⭐ FUNKTIONIERENDES MODELL (2026)
const MODEL = "llama-3.1-70b-versatile";

// ⭐ Groq OpenAI-kompatible API
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

let messages = [
    { role: "system", content: "Du bist Febl industry KI (open beta). Antworte freundlich, klar und auf Deutsch." }
];

function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = "msg-row " + (role === "user" ? "user" : "ai");

    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = role === "user" ? "Du" : "Febl industry KI";

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";
    bubble.textContent = text;

    row.appendChild(label);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

async function sendToAPI(userText) {
    messages.push({ role: "user", content: userText });

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: MODEL,
                messages: messages
            })
        });

        if (!res.ok) {
            const errText = await res.text();
            addMessage("assistant", "API‑Fehler:\n" + errText);
            return;
        }

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || "(Keine Antwort)";
        messages.push({ role: "assistant", content: reply });
        addMessage("assistant", reply);
    } catch (e) {
        addMessage("assistant", "Fehler:\n" + e.message);
    }
}

function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage("user", text);
    sendToAPI(text);
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});

// Begrüßung
addMessage("assistant", "Hallo nutzer! Ich bin **Febl industry KI (open beta)** — jetzt mit dem funktionierenden Groq‑Modell `llama-3.1-70b-versatile`.");
</script>

</body>
</html>
