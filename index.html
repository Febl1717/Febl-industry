<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Industry KI – Copilot Chat + SerpAPI</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: radial-gradient(circle at top, #050816 0%, #000 70%);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 960px;
        max-width: 95vw;
        height: 85vh;
        background: #0b1120;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.4);
        box-shadow: 0 24px 60px rgba(15,23,42,0.9);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    .header {
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(30,64,175,0.6);
        background: linear-gradient(90deg, rgba(30,64,175,0.4), transparent);
    }

    .logo-dot {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: radial-gradient(circle, #38bdf8 0%, #1d4ed8 60%, #020617 100%);
        box-shadow: 0 0 18px rgba(56,189,248,0.8);
    }

    .chat {
        padding: 16px 20px;
        overflow-y: auto;
        background: radial-gradient(circle at top, rgba(15,23,42,0.9), #020617);
    }

    .msg-row {
        display: flex;
        margin-bottom: 12px;
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-bubble {
        max-width: 70%;
        padding: 10px 12px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.4;
        white-space: pre-wrap;
    }

    .msg-bubble.user {
        background: #1d4ed8;
        color: #e5e7eb;
        border-bottom-right-radius: 4px;
    }

    .msg-bubble.ai {
        background: #020617;
        color: #e5e7eb;
        border: 1px solid rgba(148,163,184,0.5);
        border-bottom-left-radius: 4px;
    }

    .footer {
        padding: 12px 20px;
        border-top: 1px solid rgba(31,41,55,0.9);
        background: linear-gradient(to top, #020617, rgba(15,23,42,0.9));
    }

    .input-wrapper {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #020617;
        border-radius: 999px;
        border: 1px solid rgba(55,65,81,0.9);
        padding: 6px 10px;
    }

    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #e5e7eb;
        font-size: 14px;
        outline: none;
    }

    .send-btn {
        padding: 6px 14px;
        border-radius: 999px;
        border: none;
        background: #1d4ed8;
        color: #e5e7eb;
        font-size: 13px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="app">
    <div class="header">
        <div style="display:flex;align-items:center;gap:10px;">
            <div class="logo-dot"></div>
            <div>
                <div style="font-size:15px;font-weight:600;">Febl Industry KI</div>
                <div style="font-size:12px;color:#9ca3af;">Copilot‑Style Chat + Google‑Suche</div>
            </div>
        </div>
        <div style="font-size:12px;color:#9ca3af;">Operator: Felix</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" autocomplete="off" placeholder="Frag deine KI etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
const SERP_API_KEY = "06ed74f1cece99fa0eb7f01951cdb7d8ba7a7bb700e5715848ee74ae2ac78c6f";  // <--- WICHTIG

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

addAI("Hey Felix! Ich bin deine Febl‑KI mit Google‑Power. Frag mich irgendwas – ich suche es live für dich raus.");

input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
sendBtn.addEventListener("click", send);

function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addUser(text);
    handleAI(text);
}

function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble user";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble ai";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

async function handleAI(prompt) {
    addAI("Suche…");

    try {
        const url = `https://serpapi.com/search.json?engine=google&q=${encodeURIComponent(prompt)}&hl=de&gl=de&api_key=${SERP_API_KEY}`;

        const res = await fetch(url);
        const data = await res.json();

        let answer = "";

        if (data.answer_box?.answer) {
            answer = data.answer_box.answer;
        } else if (data.answer_box?.snippet) {
            answer = data.answer_box.snippet;
        } else if (data.organic_results?.length > 0) {
            answer = data.organic_results[0].snippet || data.organic_results[0].title;
        } else {
            answer = "Ich habe etwas gefunden, aber Google hat mir keine klare Antwort gegeben.";
        }

        addAI(answer);

    } catch (err) {
        addAI("Fehler bei der Google‑Suche: " + err);
    }
}
</script>

</body>
</html>
