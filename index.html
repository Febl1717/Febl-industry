<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl industry KI (open beta)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}

body{
    background:#020617;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#e5e7eb;
}

/* App */
.app{
    width:900px;
    height:90vh;
    background:#0f172a;
    border-radius:22px;
    border:1px solid rgba(148,163,184,0.35);
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* Handy */
@media(max-width:600px){
    .app{
        width:100%;
        height:100vh;
        border-radius:0;
    }
}

/* Header */
.header{
    padding:16px 22px;
    font-size:18px;
    font-weight:600;
    border-bottom:1px solid rgba(148,163,184,0.35);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* Chat löschen Button */
.clear-btn{
    padding:10px 14px;
    background:#ef4444;
    border:none;
    border-radius:12px;
    color:white;
    font-size:14px;
    cursor:pointer;
}

/* Handy: Chat löschen Button größer + unter Header */
@media(max-width:600px){
    .clear-btn{
        width:100%;
        margin-top:10px;
        padding:14px;
        font-size:16px;
    }
}

/* Chat */
.chat{
    flex:1;
    padding:18px;
    overflow-y:auto;
}

/* Nachrichten */
.msg-row{
    margin-bottom:18px;
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.msg-label{
    font-size:11px;
    opacity:0.6;
    margin-bottom:4px;
}

.msg-bubble{
    max-width:80%;
    padding:12px 16px;
    border-radius:16px;
    font-size:15px;
    line-height:1.6;
    white-space:pre-wrap;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:999px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:16px;
    font-weight:600;
}

.user-row{
    flex-direction:row-reverse;
}

.user-row .msg-bubble{
    background:#1d4ed8;
}

.ai-row .msg-bubble{
    background:#1e293b;
    border:1px solid rgba(148,163,184,0.5);
}

.ai-avatar{
    background:#22c55e;
}

/* Footer */
.footer{
    padding:14px 18px;
    border-top:1px solid rgba(148,163,184,0.35);
    display:flex;
    gap:10px;
}

#userInput{
    flex:1;
    background:#020617;
    border:1px solid rgba(148,163,184,0.5);
    border-radius:14px;
    padding:12px 14px;
    font-size:15px;
    color:#e5e7eb;
}

.send-btn{
    width:52px;
    height:42px;
    background:#3b82f6;
    border-radius:14px;
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

/* Popup */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(6px);
    z-index:999;
    opacity:1;
    transition:0.4s;
}

.popup.hidden{
    opacity:0;
    pointer-events:none;
}

.popup-content{
    background:#0f172a;
    padding:26px;
    border-radius:18px;
    border:1px solid rgba(148,163,184,0.35);
    text-align:center;
    width:280px;
}

#nameInput{
    width:100%;
    padding:10px;
    border-radius:12px;
    border:1px solid rgba(148,163,184,0.35);
    background:#020617;
    color:#e5e7eb;
    margin-bottom:16px;
}

#saveNameBtn{
    width:100%;
    padding:10px;
    background:#22c55e;
    border:none;
    border-radius:12px;
    color:white;
    cursor:pointer;
}
</style>
</head>
<body>

<!-- Popup nur EINMAL -->
<div id="namePopup" class="popup">
    <div class="popup-content">
        <h2>Wie heißt du?</h2>
        <input id="nameInput" type="text" placeholder="Dein Name">
        <button id="saveNameBtn">Speichern</button>
    </div>
</div>

<div class="app">
    <div class="header">
        <span>Febl industry KI (open beta)</span>
        <button id="clearChatBtn" class="clear-btn">Chat löschen</button>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <input id="userInput" type="text" placeholder="Schreibe etwas …">
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
</div>

<script>
const API_KEY = "DEIN_API_KEY_HIER";
const MODEL   = "llama-3.1-70b-versatile";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

let userName = localStorage.getItem("feblUserName") || null;
let messages = JSON.parse(localStorage.getItem("feblChatHistory") || "[]");

/* Popup nur einmal */
if(!userName){
    document.getElementById("namePopup").classList.remove("hidden");
}else{
    if(!messages.length){
        addMessage("ai",`Hallo ${userName}! Ich bin Febl industry KI.`);
    }else{
        messages.forEach(m=>renderMessage(m.role==="user"?"user":"ai",m.content));
    }
}

/* Name speichern */
document.getElementById("saveNameBtn").onclick=()=>{
    const name=document.getElementById("nameInput").value.trim();
    if(!name)return;
    userName=name;
    localStorage.setItem("feblUserName",userName);
    document.getElementById("namePopup").classList.add("hidden");
    addMessage("ai",`Hallo ${userName}! Schön dich zu sehen.`);
};

/* System-Prompt */
function systemMessage(){
    return {
        role:"system",
        content:`Du bist Febl industry KI. Du antwortest IMMER auf Deutsch und sprichst den Nutzer mit seinem Namen (${userName||"Nutzer"}) an.`
    };
}

/* Nachricht speichern */
function addMessage(role,text){
    messages.push({role:role==="user"?"user":"assistant",content:text});
    localStorage.setItem("feblChatHistory",JSON.stringify(messages));
    renderMessage(role,text);
}

/* Render */
function renderMessage(role,text){
    const row=document.createElement("div");
    row.className="msg-row "+(role==="user"?"user-row":"ai-row");

    const avatar=document.createElement("div");
    avatar.className="avatar "+(role==="user"?"user-avatar":"ai-avatar");
    avatar.textContent=role==="user"?(userName?userName[0].toUpperCase():"U"):"F";

    const wrap=document.createElement("div");
    const label=document.createElement("div");
    label.className="msg-label";
    label.textContent=role==="user"?userName:"Febl industry KI";

    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent=text;

    wrap.appendChild(label);
    wrap.appendChild(bubble);

    if(role==="user"){
        row.appendChild(wrap);
        row.appendChild(avatar);
    }else{
        row.appendChild(avatar);
        row.appendChild(wrap);
    }

    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
}

/* API */
async function sendToAPI(userText){
    const history=[systemMessage(),...messages.slice(-10)];

    try{
        const res=await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${API_KEY}`
            },
            body:JSON.stringify({
                model:MODEL,
                messages:history
            })
        });

        const data=await res.json();

        if(!res.ok){
            addMessage("ai","API‑Fehler:\n"+JSON.stringify(data,null,2));
            return;
        }

        addMessage("ai",data.choices[0].message.content);

    }catch(e){
        addMessage("ai","Fehler:\n"+e.message);
    }
}

/* Senden */
function send(){
    const text=input.value.trim();
    if(!text)return;
    input.value="";
    addMessage("user",text);
    sendToAPI(text);
}

sendBtn.onclick=send;
input.onkeydown=e=>{if(e.key==="Enter")send()};

/* Chat löschen */
document.getElementById("clearChatBtn").onclick=()=>{
    localStorage.removeItem("feblChatHistory");
    messages=[];
    chat.innerHTML="";
    addMessage("ai",`Chat gelöscht. Ich bin wieder da, ${userName}!`);
};
</script>

</body>
</html>
