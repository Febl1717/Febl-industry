<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl KI – Copilot Style</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}

/* Hintergrund */
body{
    background:#0a0b1f;
    height:100vh;
    display:flex;
    overflow:hidden;
    color:white;
}

/* --- SEITENLEISTE LINKS --- */
.sidebar{
    width:260px;
    background:#13143a;
    border-right:1px solid rgba(255,255,255,0.08);
    display:flex;
    flex-direction:column;
    padding:20px;
    gap:20px;
    box-shadow:4px 0 20px rgba(0,0,0,0.4);
}

.sidebar-title{
    font-size:26px;
    font-weight:700;
    margin-bottom:10px;
    color:#c084fc;
}

.sidebar-btn{
    padding:16px;
    background:#1e1f4d;
    border:none;
    border-radius:14px;
    color:white;
    font-size:18px;
    cursor:pointer;
    text-align:left;
    transition:0.25s;
}

.sidebar-btn:hover{
    background:#7c3aed;
    transform:translateX(6px);
}

/* --- MAIN APP BEREICH --- */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* HEADER MIT LILA GLOW */
.header{
    padding:20px 26px;
    font-size:26px;
    font-weight:700;
    background:#1a1b4a;
    border-bottom:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 25px #7c3aed;
    color:#e9d5ff;
}

/* CHAT */
.chat{
    flex:1;
    padding:26px;
    overflow-y:auto;
}

/* CHAT BUBBLES */
.msg-row{
    margin-bottom:26px;
    display:flex;
    align-items:flex-start;
    gap:16px;
}

.msg-bubble{
    max-width:75%;
    padding:18px 22px;
    border-radius:22px;
    font-size:20px;
    line-height:1.6;
    white-space:pre-wrap;
    animation:fadeIn 0.3s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}

.user-row{
    flex-direction:row-reverse;
}

.user-row .msg-bubble{
    background:#7c3aed;
    color:white;
}

.ai-row .msg-bubble{
    background:#1e1f4d;
    border:1px solid rgba(255,255,255,0.1);
}

/* --- EINGABE LEISTE UNTEN --- */
.input-bar{
    padding:20px;
    background:#1a1b4a;
    border-top:1px solid rgba(255,255,255,0.1);
    display:flex;
    justify-content:center;
}

.input-box{
    width:90%;
    background:#1e1f4d;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:30px;
    padding:18px 24px;
    display:flex;
    gap:14px;
    align-items:center;
    transition:0.25s;
}

.input-box:focus-within{
    box-shadow:0 0 12px #7c3aed;
}

#userInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:20px;
}

.send-btn{
    width:60px;
    height:60px;
    background:#7c3aed;
    border:none;
    border-radius:50%;
    color:white;
    font-size:26px;
    cursor:pointer;
    transition:0.25s;
}

.send-btn:hover{
    background:#9d4edd;
    transform:scale(1.1);
}

/* --- EINSTELLUNGEN PANEL --- */
.settings-panel{
    position:fixed;
    right:-350px;
    top:0;
    width:350px;
    height:100%;
    background:#13143a;
    box-shadow:-4px 0 20px rgba(0,0,0,0.5);
    padding:30px;
    display:flex;
    flex-direction:column;
    gap:20px;
    transition:0.4s;
    z-index:9999;
}

.settings-panel.open{
    right:0;
}

.settings-title{
    font-size:26px;
    font-weight:700;
    color:#c084fc;
}

.settings-item{
    padding:18px;
    background:#1e1f4d;
    border-radius:16px;
    font-size:20px;
    cursor:pointer;
    transition:0.25s;
}

.settings-item:hover{
    background:#7c3aed;
}

/* --- MOBILE VERSION --- */
@media(max-width:600px){

    .sidebar{
        width:80px;
        padding:10px;
        gap:10px;
    }

    .sidebar-title{
        font-size:18px;
    }

    .sidebar-btn{
        font-size:14px;
        padding:12px;
        border-radius:10px;
    }

    .header{
        font-size:22px;
        padding:18px;
    }

    .msg-bubble{
        font-size:22px;
        padding:26px;
        border-radius:26px;
        max-width:85%;
    }

    .input-box{
        width:95%;
        padding:22px;
        border-radius:40px;
    }

    #userInput{
        font-size:24px;
    }

    .send-btn{
        width:80px;
        height:80px;
        font-size:34px;
    }
}
</style>
</head>
<body>

<!-- SEITENLEISTE -->
<div class="sidebar">
    <div class="sidebar-title">Febl KI</div>

    <button class="sidebar-btn" onclick="window.location.href='https://febl-industry-3.jimdosite.com/'">Startseite</button>

    <button class="sidebar-btn" onclick="window.location.href='https://febl-industry-3.jimdosite.com/ueber-mich/'">
        Über Febl
    </button>

    <button class="sidebar-btn" onclick="window.location.href='https://febl-industry-3.jimdosite.com/kontakt/'">
        Support
    </button>

    <button class="sidebar-btn" onclick="openSettings()">
        Einstellungen
    </button>
</div>

<!-- EINSTELLUNGEN PANEL -->
<div id="settingsPanel" class="settings-panel">
    <div class="settings-title">KI Einstellungen</div>

    <div class="settings-item">Antwort‑Stil ändern</div>
    <div class="settings-item">Sprache ändern</div>
    <div class="settings-item">Chat‑Verlauf löschen</div>
    <div class="settings-item">Theme ändern</div>
</div>

<!-- MAIN -->
<div class="main">

    <div class="header">Chat</div>

    <div class="chat" id="chat"></div>

    <div class="input-bar">
        <div class="input-box">
            <input id="userInput" type="text" placeholder="Nachricht eingeben …">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

</div>

<script>
const API_KEY = "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";
const MODEL   = "groq/compound-mini";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

/* EINSTELLUNGEN PANEL */
function openSettings(){
    document.getElementById("settingsPanel").classList.add("open");
}
document.body.onclick=e=>{
    if(!e.target.closest(".settings-panel") && !e.target.closest(".sidebar-btn")){
        document.getElementById("settingsPanel").classList.remove("open");
    }
};

/* CHAT */
const chat=document.getElementById("chat");
const input=document.getElementById("userInput");
const sendBtn=document.getElementById("sendBtn");

let messages=JSON.parse(localStorage.getItem("feblChatHistory")||"[]");

function systemMessage(){
    return {
        role:"system",
        content:`Du bist Febl industry KI. Du antwortest IMMER auf Deutsch und verwendest keine Namen.`
    };
}

if(!messages.length){
    addMessage("ai","Hallo! Wie kann ich dir helfen?");
}else{
    messages.forEach(m=>renderMessage(m.role==="user"?"user":"ai",m.content));
}

function addMessage(role,text){
    messages.push({role:role==="user"?"user":"assistant",content:text});
    localStorage.setItem("feblChatHistory",JSON.stringify(messages));
    renderMessage(role,text);
}

function renderMessage(role,text){
    const row=document.createElement("div");
    row.className="msg-row "+(role==="user"?"user-row":"ai-row");

    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent=text;

    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
}

async function sendToAPI(userText){
    const history=[systemMessage(),...messages.slice(-10)];
    try{
        const res=await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${API_KEY}`
            },
            body:JSON.stringify({
                model:MODEL,
                messages:history
            })
        });
        const data=await res.json();
        if(!res.ok){
            addMessage("ai","API‑Fehler:\n"+JSON.stringify(data,null,2));
            return;
        }
        addMessage("ai",data.choices[0].message.content);
    }catch(e){
        addMessage("ai","Fehler:\n"+e.message);
    }
}

function send(){
    const text=input.value.trim();
    if(!text)return;
    input.value="";
    addMessage("user",text);
    sendToAPI(text);
}

sendBtn.onclick=send;
input.onkeydown=e=>{if(e.key==="Enter")send()};
</script>

</body>
</html>
