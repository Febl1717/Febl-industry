<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mini ChatGPT – Responsive</title>

<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #020617;
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 900px;
        height: 90vh;
        background: #0b1120;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.35);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    .header {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(148,163,184,0.35);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
    }

    .header span {
        font-weight: 600;
    }

    .status {
        font-size: 12px;
        color: #9ca3af;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        display: inline-block;
        margin-right: 6px;
        box-shadow: 0 0 10px rgba(34,197,94,0.8);
    }

    .chat {
        padding: 20px;
        overflow-y: auto;
    }

    .msg-row {
        margin-bottom: 14px;
    }

    .msg-label {
        font-size: 11px;
        margin-bottom: 4px;
        color: #9ca3af;
    }

    .msg-bubble {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
    }

    .user {
        text-align: right;
    }

    .user .msg-bubble {
        margin-left: auto;
        background: #1d4ed8;
        color: #e5e7eb;
    }

    .ai .msg-bubble {
        background: #111827;
        border: 1px solid rgba(148,163,184,0.5);
    }

    .footer {
        padding: 14px 20px;
        border-top: 1px solid rgba(148,163,184,0.35);
    }

    .input-wrapper {
        display: flex;
        gap: 10px;
    }

    #userInput {
        flex: 1;
        background: #020617;
        border-radius: 10px;
        border: 1px solid rgba(148,163,184,0.5);
        color: #e5e7eb;
        padding: 10px 12px;
        font-size: 14px;
    }

    #userInput::placeholder {
        color: #6b7280;
    }

    .send-btn {
        padding: 10px 16px;
        background: #2563eb;
        border-radius: 10px;
        border: none;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 14px;
    }

    .small {
        font-size: 11px;
        color: #6b7280;
        margin-top: 6px;
    }

    /* 📱 MOBILE DESIGN */
    @media (max-width: 600px) {
        body {
            align-items: flex-start;
            padding-top: 10px;
        }

        .app {
            width: 100%;
            height: 100vh;
            border-radius: 0;
        }

        .header {
            padding: 10px 14px;
            font-size: 14px;
        }

        .chat {
            padding: 12px;
        }

        .msg-bubble {
            max-width: 100%;
            font-size: 15px;
            padding: 12px 16px;
        }

        #userInput {
            font-size: 16px;
            padding: 14px;
        }

        .send-btn {
            padding: 14px 18px;
            font-size: 16px;
        }

        .input-wrapper {
            gap: 6px;
        }

        .small {
            font-size: 10px;
            text-align: center;
        }
    }
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <span>Mini ChatGPT</span>
        <div class="status">
            <span class="status-dot"></span>
            bereit
        </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" placeholder="Frag etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
        <div class="small">
            API‑Key im Code eintragen (OpenAI / DeepSeek / Groq).
        </div>
    </div>
</div>

<script>
// ⚙️ API-DATEN EINTRAGEN
const API_KEY = "DEIN_API_KEY_HIER";
const API_URL = "https://api.openai.com/v1/chat/completions";
const MODEL   = "gpt-4o-mini";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

let messages = [
    { role: "system", content: "Du bist eine hilfreiche KI, die auf Deutsch antwortet." }
];

function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = "msg-row " + (role === "user" ? "user" : "ai");

    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = role === "user" ? "Du" : "KI";

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";
    bubble.textContent = text;

    row.appendChild(label);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

async function sendToAPI(userText) {
    messages.push({ role: "user", content: userText });

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: MODEL,
                messages: messages
            })
        });

        if (!res.ok) {
            const errText = await res.text();
            addMessage("assistant", "API‑Fehler:\n" + errText);
            return;
        }

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || "(Keine Antwort)";
        messages.push({ role: "assistant", content: reply });
        addMessage("assistant", reply);
    } catch (e) {
        addMessage("assistant", "Fehler:\n" + e.message);
    }
}

function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage("user", text);
    sendToAPI(text);
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});

// Begrüßung
addMessage("assistant", "Hi Felix! Ich bin dein Mini‑ChatGPT. Trag deinen API‑Key im Code ein und frag mich etwas.");
</script>

</body>
