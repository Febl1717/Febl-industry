<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl industry KI – App UI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}

/* Hintergrund */
body{
    background:#0a0f1a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#e5e7eb;
}

/* APP CONTAINER */
.app{
    width:900px;
    height:90vh;
    background:#0d1526;
    border-radius:26px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* MOBILE FULLSCREEN */
@media(max-width:600px){
    .app{
        width:100%;
        height:100vh;
        border-radius:0;
        border:none;
        box-shadow:none;
    }
}

/* GLOW HEADER */
.header{
    padding:22px 26px;
    font-size:26px;
    font-weight:700;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0f1b33;
    border-bottom:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 25px #1e3a8a;
}

/* HEADER BUTTONS */
.back-btn{
    padding:14px 20px;
    background:#3b82f6;
    border:none;
    border-radius:16px;
    color:white;
    font-size:20px;
    cursor:pointer;
    font-weight:600;
}

.menu-btn{
    padding:14px 20px;
    background:#1f2937;
    border:none;
    border-radius:16px;
    color:white;
    font-size:20px;
    cursor:pointer;
    font-weight:600;
}

/* CHAT */
.chat{
    flex:1;
    padding:26px;
    overflow-y:auto;
}

/* CHAT BUBBLES */
.msg-row{
    margin-bottom:30px;
    display:flex;
    align-items:flex-start;
    gap:18px;
}

.msg-label{
    font-size:16px;
    opacity:0.7;
    margin-bottom:8px;
}

.msg-bubble{
    max-width:80%;
    padding:22px 26px;
    border-radius:26px;
    font-size:22px;
    line-height:1.6;
    white-space:pre-wrap;
}

/* AVATARS */
.avatar{
    width:50px;
    height:50px;
    border-radius:999px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    font-weight:700;
}

/* USER */
.user-row{
    flex-direction:row-reverse;
}

.user-row .msg-bubble{
    background:#4ea8ff;
    color:white;
}

/* KI */
.ai-row .msg-bubble{
    background:#1b2436;
    border:1px solid rgba(255,255,255,0.1);
}

.ai-avatar{
    background:#22c55e;
}

/* FOOTER */
.footer{
    padding:26px;
    border-top:1px solid rgba(255,255,255,0.08);
    display:flex;
    gap:20px;
    background:#111a2d;
}

#userInput{
    flex:1;
    background:#0f172a;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:26px;
    padding:26px;
    font-size:24px;
    color:#e5e7eb;
}

.send-btn{
    width:90px;
    height:90px;
    background:#4ea8ff;
    border-radius:26px;
    border:none;
    color:white;
    font-size:40px;
    cursor:pointer;
    font-weight:700;
}

/* SPLASH SCREEN */
.splash{
    position:fixed;
    inset:0;
    background:#0a0f1a;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    color:white;
    font-size:48px;
    opacity:1;
    transition:opacity 1s ease;
}

.splash.hidden{
    opacity:0;
    pointer-events:none;
}

/* APP MENU */
.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    z-index:9998;
}

.menu-panel{
    position:fixed;
    right:-300px;
    top:0;
    width:300px;
    height:100%;
    background:#111a2d;
    box-shadow:-4px 0 20px rgba(0,0,0,0.5);
    padding:30px;
    display:flex;
    flex-direction:column;
    gap:20px;
    transition:0.4s;
    z-index:9999;
}

.menu-panel.open{
    right:0;
}

.menu-btn-item{
    padding:20px;
    background:#1f2937;
    border-radius:20px;
    color:white;
    font-size:22px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
}

/* MOBILE BOOST */
@media(max-width:600px){
    .header{
        padding:32px;
        font-size:34px;
    }
    .back-btn, .menu-btn{
        padding:26px 34px;
        font-size:28px;
        border-radius:26px;
    }
    .msg-bubble{
        font-size:30px;
        padding:32px 36px;
        border-radius:32px;
    }
    #userInput{
        font-size:30px;
        padding:32px;
        border-radius:32px;
    }
    .send-btn{
        width:120px;
        height:120px;
        font-size:50px;
        border-radius:32px;
    }
    .avatar{
        width:80px;
        height:80px;
        font-size:40px;
    }
}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash" class="splash">
    <div style="font-size:60px;font-weight:700;">Febl</div>
    <div style="font-size:26px;opacity:0.7;margin-top:10px;">industry KI wird geladen…</div>
</div>

<!-- APP MENU -->
<div id="menuOverlay" class="menu-overlay"></div>
<div id="menuPanel" class="menu-panel">
    <div class="menu-btn-item">Startseite</div>
    <div class="menu-btn-item">Über Febl</div>
    <div class="menu-btn-item">Einstellungen</div>
    <div class="menu-btn-item">Support</div>
</div>

<div class="app">
    <div class="header">
        <button id="backBtn" class="back-btn">←</button>
        <span>Febl KI</span>
        <button id="menuBtn" class="menu-btn">☰</button>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <input id="userInput" type="text" placeholder="Schreibe etwas …">
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
</div>

<script>
const API_KEY = "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";
const MODEL   = "groq/compound-mini";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

/* SPLASH SCREEN */
setTimeout(()=>{
    const splash=document.getElementById("splash");
    splash.classList.add("hidden");
    setTimeout(()=>splash.style.display="none",1000);
},2000);

/* MENU */
const menuBtn=document.getElementById("menuBtn");
const menuPanel=document.getElementById("menuPanel");
const menuOverlay=document.getElementById("menuOverlay");

menuBtn.onclick=()=>{
    menuPanel.classList.add("open");
    menuOverlay.style.display="block";
};

menuOverlay.onclick=()=>{
    menuPanel.classList.remove("open");
    menuOverlay.style.display="none";
};

/* CHAT */
const chat=document.getElementById("chat");
const input=document.getElementById("userInput");
const sendBtn=document.getElementById("sendBtn");

let messages=JSON.parse(localStorage.getItem("feblChatHistory")||"[]");

function systemMessage(){
    return {
        role:"system",
        content:`Du bist Febl industry KI. Du antwortest IMMER auf Deutsch und verwendest keine Namen.`
    };
}

if(!messages.length){
    addMessage("ai","Hallo! Wie kann ich dir helfen?");
}else{
    messages.forEach(m=>renderMessage(m.role==="user"?"user":"ai",m.content));
}

function addMessage(role,text){
    messages.push({role:role==="user"?"user":"assistant",content:text});
    localStorage.setItem("feblChatHistory",JSON.stringify(messages));
    renderMessage(role,text);
}

function renderMessage(role,text){
    const row=document.createElement("div");
    row.className="msg-row "+(role==="user"?"user-row":"ai-row");

    const avatar=document.createElement("div");
    avatar.className="avatar "+(role==="user"?"user-avatar":"ai-avatar");
    avatar.textContent=role==="user"?"U":"F";

    const wrap=document.createElement("div");
    const label=document.createElement("div");
    label.className="msg-label";
    label.textContent=role==="user"?"Du":"Febl industry KI";

    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent=text;

    wrap.appendChild(label);
    wrap.appendChild(bubble);

    if(role==="user"){
        row.appendChild(wrap);
        row.appendChild(avatar);
    }else{
        row.appendChild(avatar);
        row.appendChild(wrap);
    }

    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
}

async function sendToAPI(userText){
    const history=[systemMessage(),...messages.slice(-10)];
    try{
        const res=await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${API_KEY}`
            },
            body:JSON.stringify({
                model:MODEL,
                messages:history
            })
        });
        const data=await res.json();
        if(!res.ok){
            addMessage("ai","API‑Fehler:\n"+JSON.stringify(data,null,2));
            return;
        }
        addMessage("ai",data.choices[0].message.content);
    }catch(e){
        addMessage("ai","Fehler:\n"+e.message);
    }
}

function send(){
    const text=input.value.trim();
    if(!text)return;
    input.value="";
    addMessage("user",text);
    sendToAPI(text);
}

sendBtn.onclick=send;
input.onkeydown=e=>{if(e.key==="Enter")send()};

document.getElementById("backBtn").onclick=()=>{
    window.location.href="https://febl-industry-3.jimdosite.com/";
};
</script>

</body>
</html>
