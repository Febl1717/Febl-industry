<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl industry KI (open beta)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}

body{
    background:#020617;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#e5e7eb;
}

/* App */
.app{
    width:900px;
    height:90vh;
    background:#0f172a;
    border-radius:22px;
    border:1px solid rgba(148,163,184,0.35);
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

@media(max-width:600px){
    .app{
        width:100%;
        height:100vh;
        border-radius:0;
    }
}

/* Header */
.header{
    padding:16px 22px;
    font-size:18px;
    font-weight:600;
    border-bottom:1px solid rgba(148,163,184,0.35);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* Chat löschen Button */
.clear-btn{
    padding:10px 14px;
    background:#ef4444;
    border:none;
    border-radius:12px;
    color:white;
    font-size:14px;
    cursor:pointer;
}

@media(max-width:600px){
    .clear-btn{
        width:100%;
        margin-top:10px;
        padding:14px;
        font-size:16px;
    }
}

/* Chat */
.chat{
    flex:1;
    padding:18px;
    overflow-y:auto;
}

/* Nachrichten */
.msg-row{
    margin-bottom:18px;
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.msg-label{
    font-size:11px;
    opacity:0.6;
    margin-bottom:4px;
}

.msg-bubble{
    max-width:80%;
    padding:12px 16px;
    border-radius:16px;
    font-size:15px;
    line-height:1.6;
    white-space:pre-wrap;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:999px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:16px;
    font-weight:600;
}

.user-row{
    flex-direction:row-reverse;
}

.user-row .msg-bubble{
    background:#1d4ed8;
}

.ai-row .msg-bubble{
    background:#1e293b;
    border:1px solid rgba(148,163,184,0.5);
}

.ai-avatar{
    background:#22c55e;
}

/* Footer */
.footer{
    padding:14px 18px;
    border-top:1px solid rgba(148,163,184,0.35);
    display:flex;
    gap:10px;
}

#userInput{
    flex:1;
    background:#020617;
    border:1px solid rgba(148,163,184,0.5);
    border-radius:14px;
    padding:12px 14px;
    font-size:15px;
    color:#e5e7eb;
}

.send-btn{
    width:52px;
    height:42px;
    background:#3b82f6;
    border-radius:14px;
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

/* Mikrofon */
.mic-btn{
    width:52px;
    height:42px;
    background:#22c55e;
    border-radius:14px;
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

/* Popup Intro */
.intro{
    position:fixed;
    inset:0;
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
    color:white;
    font-size:28px;
    opacity:1;
    transition:0.6s;
}

.intro.hidden{
    opacity:0;
    pointer-events:none;
}
</style>
</head>
<body>

<!-- Start Intro -->
<div id="intro" class="intro">
    <div>Hallo!</div>
    <div style="font-size:16px;opacity:0.7;margin-top:10px;">Febl industry KI wird geladen…</div>
</div>

<div class="app">
    <div class="header">
        <span>Febl industry KI (open beta)</span>
        <button id="clearChatBtn" class="clear-btn">Chat löschen</button>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <input id="userInput" type="text" placeholder="Schreibe etwas …">
        <button class="mic-btn" id="micBtn">🎤</button>
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
</div>

<script>
/* API */
const API_KEY = "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";
const MODEL   = "groq/compound-mini";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

/* Start Intro */
setTimeout(()=>{
    document.getElementById("intro").classList.add("hidden");
},1500);

/* Chat-Verlauf */
let messages = JSON.parse(localStorage.getItem("feblChatHistory") || "[]");

/* System-Prompt */
function systemMessage(){
    return {
        role:"system",
        content:`Du bist Febl industry KI. Du antwortest IMMER auf Deutsch und nennst den Nutzer einfach "Nutzer".`
    };
}

/* Startnachricht */
if(!messages.length){
    addMessage("ai","Hallo Nutzer! Wie kann ich dir helfen?");
}else{
    messages.forEach(m=>renderMessage(m.role==="user"?"user":"ai",m.content));
}

/* Nachricht speichern */
function addMessage(role,text){
    messages.push({role:role==="user"?"user":"assistant",content:text});
    localStorage.setItem("feblChatHistory",JSON.stringify(messages));
    renderMessage(role,text);
}

/* Render */
function renderMessage(role,text){
    const row=document.createElement("div");
    row.className="msg-row "+(role==="user"?"user-row":"ai-row");

    const avatar=document.createElement("div");
    avatar.className="avatar "+(role==="user"?"user-avatar":"ai-avatar");
    avatar.textContent=role==="user"?"U":"F";

    const wrap=document.createElement("div");
    const label=document.createElement("div");
    label.className="msg-label";
    label.textContent=role==="user"?"Nutzer":"Febl industry KI";

    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent=text;

    wrap.appendChild(label);
    wrap.appendChild(bubble);

    if(role==="user"){
        row.appendChild(wrap);
        row.appendChild(avatar);
    }else{
        row.appendChild(avatar);
        row.appendChild(wrap);
    }

    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
}

/* API */
async function sendToAPI(userText){
    const history=[systemMessage(),...messages.slice(-10)];

    try{
        const res=await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${API_KEY}`
            },
            body:JSON.stringify({
                model:MODEL,
                messages:history
            })
        });

        const data=await res.json();

        if(!res.ok){
            addMessage("ai","API‑Fehler:\n"+JSON.stringify(data,null,2));
            return;
        }

        const reply=data.choices[0].message.content;
        addMessage("ai",reply);

        speak(reply);

    }catch(e){
        addMessage("ai","Fehler:\n"+e.message);
    }
}

/* Senden */
function send(){
    const text=input.value.trim();
    if(!text)return;
    input.value="";
    addMessage("user",text);
    sendToAPI(text);
}

sendBtn.onclick=send;
input.onkeydown=e=>{if(e.key==="Enter")send()};

/* Chat löschen */
document.getElementById("clearChatBtn").onclick=()=>{
    localStorage.removeItem("feblChatHistory");
    messages=[];
    chat.innerHTML="";
    addMessage("ai","Chat gelöscht. Hallo Nutzer!");
};

/* Sprachfunktion – Zuhören */
micBtn.onclick=()=>{
    const rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
    rec.lang="de-DE";
    rec.start();

    rec.onresult=e=>{
        const text=e.results[0][0].transcript;
        input.value=text;
        send();
    };
};

/* Sprachfunktion – Reden */
function speak(text){
    const msg=new SpeechSynthesisUtterance();
    msg.text=text;
    msg.lang="de-DE";
    msg.rate=1.0;
    speechSynthesis.speak(msg);
}
</script>

</body>
</html>
