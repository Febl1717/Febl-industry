<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl KI – Copilot Style</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}

/* THEME VARIABLEN */
:root{
    --bg-main:#0a0b1f;
    --bg-sidebar:#13143a;
    --bg-header:#1a1b4a;
    --bg-chat:#0a0b1f;
    --bg-input:#1e1f4d;
    --bg-bubble-ai:#1e1f4d;
    --bg-bubble-user:#7c3aed;
    --accent:#7c3aed;
    --accent-soft:#9d4edd;
    --text-main:#ffffff;
    --text-soft:#e9d5ff;
}

/* THEMES */
.theme-blue{
    --bg-main:#0b1120;
    --bg-sidebar:#0f172a;
    --bg-header:#1e293b;
    --bg-chat:#020617;
    --bg-input:#1f2937;
    --bg-bubble-ai:#1e293b;
    --bg-bubble-user:#3b82f6;
    --accent:#3b82f6;
    --accent-soft:#60a5fa;
    --text-main:#ffffff;
    --text-soft:#e5e7eb;
}
.theme-purple{
    --bg-main:#0a0b1f;
    --bg-sidebar:#13143a;
    --bg-header:#1a1b4a;
    --bg-chat:#0a0b1f;
    --bg-input:#1e1f4d;
    --bg-bubble-ai:#1e1f4d;
    --bg-bubble-user:#7c3aed;
    --accent:#7c3aed;
    --accent-soft:#9d4edd;
    --text-main:#ffffff;
    --text-soft:#e9d5ff;
}
.theme-red{
    --bg-main:#1a0b0b;
    --bg-sidebar:#3b0f0f;
    --bg-header:#4c1d1d;
    --bg-chat:#1a0b0b;
    --bg-input:#3f1f1f;
    --bg-bubble-ai:#3f1f1f;
    --bg-bubble-user:#ef4444;
    --accent:#ef4444;
    --accent-soft:#f97373;
    --text-main:#ffffff;
    --text-soft:#fee2e2;
}
.theme-green{
    --bg-main:#022c22;
    --bg-sidebar:#064e3b;
    --bg-header:#065f46;
    --bg-chat:#022c22;
    --bg-input:#064e3b;
    --bg-bubble-ai:#064e3b;
    --bg-bubble-user:#22c55e;
    --accent:#22c55e;
    --accent-soft:#4ade80;
    --text-main:#ecfdf5;
    --text-soft:#bbf7d0;
}
.theme-black{
    --bg-main:#000000;
    --bg-sidebar:#0a0a0a;
    --bg-header:#111827;
    --bg-chat:#000000;
    --bg-input:#111827;
    --bg-bubble-ai:#111827;
    --bg-bubble-user:#3b82f6;
    --accent:#3b82f6;
    --accent-soft:#60a5fa;
    --text-main:#f9fafb;
    --text-soft:#e5e7eb;
}

/* Hintergrund */
body{
    background:var(--bg-main);
    height:100vh;
    display:flex;
    overflow:hidden;
    color:var(--text-main);
}

/* --- SEITENLEISTE LINKS --- */
.sidebar{
    width:260px;
    background:var(--bg-sidebar);
    border-right:1px solid rgba(255,255,255,0.08);
    display:flex;
    flex-direction:column;
    padding:20px;
    gap:20px;
    box-shadow:4px 0 20px rgba(0,0,0,0.4);
}

.sidebar-title{
    font-size:26px;
    font-weight:700;
    margin-bottom:10px;
    color:var(--accent);
}

.sidebar-btn{
    padding:16px;
    background:#1e1f4d;
    border:none;
    border-radius:14px;
    color:var(--text-main);
    font-size:18px;
    cursor:pointer;
    text-align:left;
    transition:0.25s;
}

.sidebar-btn:hover{
    background:var(--accent);
    transform:translateX(6px);
}

/* --- MAIN APP BEREICH --- */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* HEADER MIT GLOW */
.header{
    padding:20px 26px;
    font-size:26px;
    font-weight:700;
    background:var(--bg-header);
    border-bottom:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 25px var(--accent);
    color:var(--text-soft);
}

/* CHAT */
.chat{
    flex:1;
    padding:26px;
    overflow-y:auto;
}

/* CHAT BUBBLES */
.msg-row{
    margin-bottom:26px;
    display:flex;
    align-items:flex-start;
    gap:16px;
}

.msg-bubble{
    max-width:75%;
    padding:18px 22px;
    border-radius:22px;
    font-size:20px;
    line-height:1.6;
    white-space:pre-wrap;
    animation:fadeIn 0.3s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}

.user-row{
    flex-direction:row-reverse;
}

.user-row .msg-bubble{
    background:var(--bg-bubble-user);
    color:var(--text-main);
}

.ai-row .msg-bubble{
    background:var(--bg-bubble-ai);
    border:1px solid rgba(255,255,255,0.1);
}

/* --- EINGABE LEISTE UNTEN --- */
.input-bar{
    padding:20px;
    background:var(--bg-header);
    border-top:1px solid rgba(255,255,255,0.1);
    display:flex;
    justify-content:center;
}

.input-box{
    width:90%;
    background:var(--bg-input);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:30px;
    padding:18px 24px;
    display:flex;
    gap:14px;
    align-items:center;
    transition:0.25s;
}

.input-box:focus-within{
    box-shadow:0 0 12px var(--accent);
}

#userInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text-main);
    font-size:20px;
}

.send-btn{
    width:60px;
    height:60px;
    background:var(--accent);
    border:none;
    border-radius:50%;
    color:var(--text-main);
    font-size:26px;
    cursor:pointer;
    transition:0.25s;
}

.send-btn:hover{
    background:var(--accent-soft);
    transform:scale(1.1);
}

/* --- EINSTELLUNGEN PANEL --- */
.settings-panel{
    position:fixed;
    right:-380px;
    top:0;
    width:380px;
    height:100%;
    background:var(--bg-sidebar);
    box-shadow:-4px 0 20px rgba(0,0,0,0.5);
    padding:30px;
    display:flex;
    flex-direction:column;
    gap:20px;
    transition:0.4s;
    z-index:9999;
}

.settings-panel.open{
    right:0;
}

.settings-title{
    font-size:26px;
    font-weight:700;
    color:var(--accent);
}

.settings-section-title{
    font-size:18px;
    margin-top:10px;
    margin-bottom:6px;
}

.settings-item{
    padding:14px;
    background:#1e1f4d;
    border-radius:16px;
    font-size:18px;
    cursor:pointer;
    transition:0.25s;
    margin-bottom:8px;
}

.settings-item:hover{
    background:var(--accent);
}

/* DROPDOWN */
.settings-select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#1e1f4d;
    color:var(--text-main);
    font-size:16px;
}

/* --- MOBILE VERSION --- */
@media(max-width:600px){

    .sidebar{
        width:80px;
        padding:10px;
        gap:10px;
    }

    .sidebar-title{
        font-size:18px;
    }

    .sidebar-btn{
        font-size:14px;
        padding:12px;
        border-radius:10px;
    }

    .header{
        font-size:22px;
        padding:18px;
    }

    .msg-bubble{
        font-size:22px;
        padding:26px;
        border-radius:26px;
        max-width:85%;
    }

    .input-box{
        width:95%;
        padding:22px;
        border-radius:40px;
    }

    #userInput{
        font-size:24px;
    }

    .send-btn{
        width:80px;
        height:80px;
        font-size:34px;
    }

    .settings-panel{
        width:100%;
    }
}
</style>
</head>
<body class="theme-purple">

<!-- SEITENLEISTE -->
<div class="sidebar">
    <div class="sidebar-title">Febl KI</div>

    <button class="sidebar-btn" onclick="window.location.href='https://febl-industry-3.jimdosite.com/'">
        Startseite
    </button>

    <button class="sidebar-btn" onclick="window.location.href='https://febl-industry-3.jimdosite.com/ueber-mich/'">
        Über Febl
    </button>

    <button class="sidebar-btn" onclick="window.location.href='https://febl-industry-3.jimdosite.com/kontakt/'">
        Support
    </button>

    <button class="sidebar-btn" onclick="openSettings()">
        Einstellungen
    </button>
</div>

<!-- EINSTELLUNGEN PANEL -->
<div id="settingsPanel" class="settings-panel">
    <div class="settings-title">KI Einstellungen</div>

    <div class="settings-section-title">Antwort‑Stil</div>
    <select id="styleSelect" class="settings-select">
        <option value="normal">Normal</option>
        <option value="kurz">Kurz</option>
        <option value="ausführlich">Ausführlich</option>
        <option value="kreativ">Kreativ</option>
    </select>

    <div class="settings-section-title">Sprache</div>
    <select id="langSelect" class="settings-select">
        <option value="de">Deutsch</option>
        <option value="en">Englisch</option>
    </select>

    <div class="settings-section-title">Theme</div>
    <select id="themeSelect" class="settings-select">
        <option value="purple">Lila</option>
        <option value="blue">Blau</option>
        <option value="red">Rot</option>
        <option value="green">Grün</option>
        <option value="black">Schwarz</option>
    </select>

    <div class="settings-section-title">Aktionen</div>
    <div class="settings-item" onclick="clearChat()">Chat‑Verlauf löschen</div>
</div>

<!-- MAIN -->
<div class="main">

    <div class="header">Chat</div>

    <div class="chat" id="chat"></div>

    <div class="input-bar">
        <div class="input-box">
            <input id="userInput" type="text" placeholder="Nachricht eingeben …">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

</div>

<script>
const API_KEY = "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";
const MODEL   = "groq/compound-mini";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

/* EINSTELLUNGEN PANEL */
function openSettings(){
    document.getElementById("settingsPanel").classList.add("open");
}
document.body.addEventListener("click",e=>{
    if(!e.target.closest(".settings-panel") && !e.target.closest(".sidebar-btn")){
        document.getElementById("settingsPanel").classList.remove("open");
    }
});

/* STATE */
let messages=JSON.parse(localStorage.getItem("feblChatHistory")||"[]");
let answerStyle=localStorage.getItem("feblStyle")||"normal";
let answerLang=localStorage.getItem("feblLang")||"de";
let currentTheme=localStorage.getItem("feblTheme")||"purple";

/* INIT SETTINGS UI */
document.getElementById("styleSelect").value=answerStyle;
document.getElementById("langSelect").value=answerLang;
document.getElementById("themeSelect").value=currentTheme;
applyTheme(currentTheme);

/* SETTINGS CHANGE */
document.getElementById("styleSelect").onchange=e=>{
    answerStyle=e.target.value;
    localStorage.setItem("feblStyle",answerStyle);
};
document.getElementById("langSelect").onchange=e=>{
    answerLang=e.target.value;
    localStorage.setItem("feblLang",answerLang);
};
document.getElementById("themeSelect").onchange=e=>{
    currentTheme=e.target.value;
    localStorage.setItem("feblTheme",currentTheme);
    applyTheme(currentTheme);
};

function applyTheme(theme){
    const body=document.body;
    body.classList.remove("theme-blue","theme-purple","theme-red","theme-green","theme-black");
    if(theme==="blue")body.classList.add("theme-blue");
    if(theme==="purple")body.classList.add("theme-purple");
    if(theme==="red")body.classList.add("theme-red");
    if(theme==="green")body.classList.add("theme-green");
    if(theme==="black")body.classList.add("theme-black");
}

/* SYSTEM MESSAGE */
function systemMessage(){
    let styleText="";
    if(answerStyle==="kurz")styleText="Antworte kurz und knapp.";
    if(answerStyle==="ausführlich")styleText="Antworte ausführlich und detailliert.";
    if(answerStyle==="kreativ")styleText="Antworte kreativ und locker.";

    let langText=answerLang==="de"
        ?"Du antwortest IMMER auf Deutsch und verwendest keine Namen."
        :"You ALWAYS answer in English and do not use names.";

    return {
        role:"system",
        content:`${langText} ${styleText}`
    };
}

/* CHAT INIT */
const chat=document.getElementById("chat");
const input=document.getElementById("userInput");
const sendBtn=document.getElementById("sendBtn");

if(!messages.length){
    addMessage("ai",answerLang==="de"?"Hallo! Wie kann ich dir helfen?":"Hi! How can I help you?");
}else{
    messages.forEach(m=>renderMessage(m.role==="user"?"user":"ai",m.content));
}

/* CHAT FUNKTIONEN */
function addMessage(role,text){
    messages.push({role:role==="user"?"user":"assistant",content:text});
    localStorage.setItem("feblChatHistory",JSON.stringify(messages));
    renderMessage(role,text);
}

function renderMessage(role,text){
    const row=document.createElement("div");
    row.className="msg-row "+(role==="user"?"user-row":"ai-row");

    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent=text;

    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
}

async function sendToAPI(userText){
    const history=[systemMessage(),...messages.slice(-10)];
    try{
        const res=await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${API_KEY}`
            },
            body:JSON.stringify({
                model:MODEL,
                messages:history
            })
        });
        const data=await res.json();
        if(!res.ok){
            addMessage("ai","API‑Fehler:\n"+JSON.stringify(data,null,2));
            return;
        }
        addMessage("ai",data.choices[0].message.content);
    }catch(e){
        addMessage("ai","Fehler:\n"+e.message);
    }
}

function send(){
    const text=input.value.trim();
    if(!text)return;
    input.value="";
    addMessage("user",text);
    sendToAPI(text);
}

sendBtn.onclick=send;
input.onkeydown=e=>{if(e.key==="Enter")send()};

/* CHAT LÖSCHEN */
function clearChat(){
    localStorage.removeItem("feblChatHistory");
    messages=[];
    chat.innerHTML="";
    addMessage("ai",answerLang==="de"?"Chat gelöscht. Hallo!":"Chat cleared. Hi!");
}
</script>

</body>
</html>
