<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Industry KI – Copilot Chat + SerpAPI ohne Server</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #0b1120;
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 900px;
        height: 85vh;
        background: #111827;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.4);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    .header {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(30,64,175,0.6);
        background: #1e293b;
        font-size: 15px;
        font-weight: 600;
    }

    .chat {
        padding: 16px 20px;
        overflow-y: auto;
    }

    .msg-row {
        display: flex;
        margin-bottom: 12px;
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-bubble {
        max-width: 70%;
        padding: 10px 12px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.4;
        white-space: pre-wrap;
    }

    .msg-bubble.user {
        background: #2563eb;
        color: #e5e7eb;
        border-bottom-right-radius: 4px;
    }

    .msg-bubble.ai {
        background: #1e293b;
        color: #e5e7eb;
        border: 1px solid rgba(148,163,184,0.5);
        border-bottom-left-radius: 4px;
    }

    .footer {
        padding: 12px 20px;
        border-top: 1px solid rgba(31,41,55,0.9);
        background: #1e293b;
    }

    .input-wrapper {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #0f172a;
        border-radius: 999px;
        border: 1px solid rgba(55,65,81,0.9);
        padding: 6px 10px;
    }

    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #e5e7eb;
        font-size: 14px;
        outline: none;
    }

    .send-btn {
        padding: 6px 14px;
        border-radius: 999px;
        border: none;
        background: #2563eb;
        color: #e5e7eb;
        font-size: 13px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="app">
    <div class="header">Febl Industry KI – Copilot Style + Google Suche</div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" autocomplete="off" placeholder="Frag deine KI etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
const SERP_API_KEY = "DEIN_SERPAPI_KEY_HIER";  // <-- WICHTIG

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

addAI("Hey Felix! Ich bin deine Febl‑KI mit Google‑Suche – ohne Server, ohne WebGPU, ohne Fehler.");

input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
sendBtn.addEventListener("click", send);

function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addUser(text);
    handleAI(text);
}

function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble user";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble ai";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

async function handleAI(prompt) {
    addAI("Suche…");

    try {
        // Öffentlicher Proxy, der CORS erlaubt
        const proxy = "https://corsproxy.io/?";

        const url = proxy + encodeURIComponent(
            `https://serpapi.com/search.json?engine=google&q=${encodeURIComponent(prompt)}&hl=de&gl=de&api_key=${SERP_API_KEY}`
        );

        const res = await fetch(url);
        const data = await res.json();

        let answer = "";

        if (data.answer_box?.answer) {
            answer = data.answer_box.answer;
        } else if (data.answer_box?.snippet) {
            answer = data.answer_box.snippet;
        } else if (data.organic_results?.length > 0) {
            answer = data.organic_results[0].snippet || data.organic_results[0].title;
        } else {
            answer = "Ich habe etwas gefunden, aber Google hat mir keine klare Antwort gegeben.";
        }

        addAI(answer);

    } catch (err) {
        addAI("Fehler: " + err);
    }
}
</script>

</body>
</html>
