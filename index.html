<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Industry KI – Console</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: radial-gradient(circle at top, #050816 0%, #000 70%);
        font-family: "JetBrains Mono", monospace;
        color: #e0f7ff;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 960px;
        max-width: 95vw;
        height: 85vh;
        max-height: 95vh;
        background: rgba(5, 20, 40, 0.85);
        border-radius: 14px;
        border: 1px solid rgba(0,255,255,0.35);
        box-shadow: 0 0 30px rgba(0,255,255,0.25);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    /* Header */
    .header {
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(90deg, rgba(0,255,255,0.15), transparent);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #7ee7ff;
    }

    .header-title {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .header-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00f2ff;
        box-shadow: 0 0 8px #00f2ff;
    }

    .header-status {
        font-size: 11px;
        color: #9af3ff;
    }

    /* Main */
    .main {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 0;
        padding: 10px 12px;
    }

    /* Chat Panel */
    .chat-panel {
        border-right: 1px solid rgba(0,255,255,0.2);
        padding-right: 10px;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .chat-body {
        flex: 1;
        background: rgba(0, 10, 20, 0.9);
        border-radius: 8px;
        padding: 10px;
        overflow-y: auto;
        font-size: 13px;
        border: 1px solid rgba(0,255,255,0.15);
    }

    .msg {
        margin: 6px 0;
        white-space: pre-wrap;
        opacity: 0;
        transform: translateY(4px);
        animation: fadeIn 0.2s forwards;
    }

    @keyframes fadeIn {
        to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
        color: #e0f7ff;
    }

    .msg.ai {
        color: #7ee7ff;
        text-shadow: 0 0 6px #00eaff;
    }

    /* Side Panel */
    .side-panel {
        padding-left: 10px;
        display: flex;
        flex-direction: column;
        height: 100%;
        font-size: 12px;
    }

    .side-section {
        background: rgba(0, 15, 30, 0.9);
        border-radius: 8px;
        border: 1px solid rgba(0,255,255,0.2);
        padding: 8px;
        margin-bottom: 8px;
    }

    .side-title {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 11px;
        color: #7ee7ff;
        margin-bottom: 4px;
    }

    .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid rgba(0,255,255,0.4);
        font-size: 10px;
        margin-right: 4px;
        color: #9af3ff;
    }

    /* Footer / Input */
    .footer {
        padding: 8px 14px;
        border-top: 1px solid rgba(0,255,255,0.25);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .prompt-label {
        font-size: 12px;
        color: #7ee7ff;
    }

    #userInput {
        flex: 1;
        background: rgba(0, 10, 20, 0.9);
        border-radius: 6px;
        border: 1px solid rgba(0,255,255,0.4);
        color: #e0f7ff;
        font-family: inherit;
        font-size: 13px;
        padding: 6px 8px;
        outline: none;
    }

    #userInput:focus {
        border-color: #00f2ff;
        box-shadow: 0 0 10px rgba(0,255,255,0.35);
    }

    .send-btn {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(0,255,255,0.6);
        background: rgba(0,255,255,0.1);
        color: #e0f7ff;
        font-size: 12px;
        cursor: pointer;
    }

    .send-btn:hover {
        background: rgba(0,255,255,0.2);
    }
</style>
</head>

<body>

<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <div class="header-dot"></div>
            <span>FEBL INDUSTRY KI – CONSOLE</span>
        </div>
        <div class="header-status">MODE: ANALYTIC · LINK: LOCAL KI</div>
    </div>

    <!-- Main -->
    <div class="main">
        <!-- Chat -->
        <div class="chat-panel">
            <div class="chat-body" id="chatBody"></div>
        </div>

        <!-- Side Info -->
        <div class="side-panel">
            <div class="side-section">
                <div class="side-title">SESSION</div>
                <div>Operator: Felix</div>
                <div>Environment: Browser · Local KI</div>
            </div>
            <div class="side-section">
                <div class="side-title">MODES</div>
                <div>
                    <span class="badge">ANALYSE</span>
                    <span class="badge">EXPLAIN</span>
                    <span class="badge">IDEAS</span>
                </div>
            </div>
            <div class="side-section">
                <div class="side-title">TIPPS</div>
                <div>- „Erklär mir …“</div>
                <div>- „Analysiere …“</div>
                <div>- „Gib mir Ideen für …“</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <span class="prompt-label">Prompt:</span>
        <input id="userInput" type="text" autocomplete="off" placeholder="Frag deine Febl-KI etwas...">
        <button class="send-btn" id="sendBtn">Senden</button>
    </div>
</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const chatBody = document.getElementById("chatBody");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

let engine = null;

/* Boot-Messages */
const bootLines = [
    "[System] Starte Febl Industry KI Console...",
    "[System] Prüfe WebGPU...",
    "[System] Lade lokales KI-Modell (Llama-3.1-8B-Instruct)...",
    "[System] Session bereit. Du kannst Fragen stellen."
];

bootLines.forEach((line, i) => {
    setTimeout(() => addMsg(line, "ai"), i * 400);
});

/* Engine laden */
(async () => {
    try {
        engine = await webllm.CreateMLCEngine("Llama-3.1-8B-Instruct");
        addMsg("[System] KI-Modell erfolgreich geladen.", "ai");
    } catch (e) {
        addMsg("[System] Fehler beim Laden des Modells: " + e, "ai");
    }
})();

/* Input Events */
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        sendCurrent();
    }
});

sendBtn.addEventListener("click", sendCurrent);

function sendCurrent() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    handleUserInput(text);
}

/* Chat Handling */
function handleUserInput(text) {
    addMsg("Du: " + text, "user");

    if (!engine) {
        addMsg("[KI] Modell lädt noch, bitte kurz warten.", "ai");
        return;
    }

    const loadingId = addMsg("[KI] Denke nach...", "ai");

    callAI(text).then(answer => {
        replaceMsg(loadingId, "[KI] " + answer, "ai");
    }).catch(err => {
        replaceMsg(loadingId, "[KI] Fehler: " + err, "ai");
    });
}

/* KI-Aufruf */
async function callAI(question) {
    const reply = await engine.chat.completions.create({
        messages: [
            {
                role: "system",
                content: "Du bist die Febl Industry KI Console. Antworte klar, direkt, leicht futuristisch, aber verständlich. Du sprichst mit Felix."
            },
            {
                role: "user",
                content: question
            }
        ]
    });

    return reply.choices[0].message.content;
}

/* Chat Rendering */
let msgCounter = 0;

function addMsg(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + (type || "");
    div.textContent = text;
    div.dataset.id = ++msgCounter;
    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
    return div.dataset.id;
}

function replaceMsg(id, newText, type) {
    const el = [...chatBody.querySelectorAll(".msg")].find(m => m.dataset.id === String(id));
    if (!el) return;
    el.textContent = newText;
    el.className = "msg " + (type || "");
}
</script>

</body>
</html>
