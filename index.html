<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Febl KI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
:root{
--c1:#0a0b1f;--c2:#13143a;--c3:#1a1b4a;--c4:#1e1f4d;
--assistant:#1e1f4d;--user:#7c3aed;--accent:#7c3aed;
--t1:#fff;--t2:#e9d5ff;
}

body.theme-purple{}
body.theme-blue{--c1:#0b1120;--c2:#0f172a;--c3:#1e293b;--c4:#1f2937;--assistant:#1e293b;--user:#3b82f6;--accent:#3b82f6;--t2:#e5e7eb}
body.theme-red{--c1:#1a0b0b;--c2:#3b0f0f;--c3:#4c1d1d;--c4:#3f1f1f;--assistant:#3f1f1f;--user:#ef4444;--accent:#ef4444;--t2:#fee2e2}
body.theme-green{--c1:#022c22;--c2:#064e3b;--c3:#065f46;--c4:#064e3b;--assistant:#064e3b;--user:#22c55e;--accent:#22c55e;--t2:#bbf7d0}
body.theme-black{--c1:#000;--c2:#0a0a0a;--c3:#111827;--c4:#111827;--assistant:#111827;--user:#3b82f6;--accent:#3b82f6;--t2:#e5e7eb}

body{
background:var(--c1);
color:var(--t1);
height:100vh;
display:flex;
overflow:hidden;
}

/* SPLASH */
#splash{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#000;display:flex;flex-direction:column;
justify-content:center;align-items:center;z-index:9999;
transition:1s;
}
#splash h1{font-size:40px;color:#fff}
#splash p{color:#aaa;margin-top:10px}

/* SIDEBAR */
.sidebar{
width:60px;background:var(--c2);
display:flex;flex-direction:column;gap:12px;
padding:10px 6px;transition:.3s;
}
.sidebar:hover{width:200px}
.sidebar-icon{
display:flex;align-items:center;gap:10px;
padding:10px;background:var(--c4);
border-radius:12px;cursor:pointer;
white-space:nowrap;overflow:hidden;
}
.sidebar-icon span{font-size:22px}
.sidebar-text{opacity:0;transition:.3s}
.sidebar:hover .sidebar-text{opacity:1}

/* SETTINGS */
.settings-panel{
position:fixed;right:-260px;top:0;width:260px;height:100%;
background:var(--c2);padding:20px;display:flex;
flex-direction:column;gap:12px;transition:.3s;z-index:999;
}
.settings-panel.open{right:0}
.settings-title{font-size:20px;font-weight:700;color:var(--accent)}
.settings-section-title{font-size:14px}
.settings-select{
width:100%;padding:8px;border:none;
border-radius:8px;background:var(--c4);color:var(--t1);
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;height:100vh}
.header{
padding:16px 22px;font-size:22px;font-weight:700;
background:var(--c3);color:var(--t2);
}

/* CHAT */
.chat{
flex:1;padding:20px;overflow-y:auto;background:var(--c1);
}
.msg-row{margin-bottom:16px;display:flex}
.msg-bubble{
max-width:80%;padding:12px 16px;border-radius:18px;
font-size:16px;line-height:1.5;white-space:pre-wrap;
}
.user-row{justify-content:flex-end}
.user-row .msg-bubble{background:var(--user)}
.assistant-row .msg-bubble{background:var(--assistant);border:1px solid rgba(255,255,255,.1)}

/* LOADING DOTS */
.loading{
display:flex;
gap:6px;
padding:12px 16px;
background:var(--assistant);
border-radius:18px;
width:40px;
}
.loading div{
width:8px;height:8px;
background:#fff;
border-radius:50%;
animation:load 0.8s infinite;
}
.loading div:nth-child(2){animation-delay:0.2s}
.loading div:nth-child(3){animation-delay:0.4s}

@keyframes load{
0%{opacity:0.2;transform:scale(1)}
50%{opacity:1;transform:scale(1.4)}
100%{opacity:0.2;transform:scale(1)}
}

/* INPUT */
.input-bar{
padding:10px 0;
display:flex;
justify-content:center;
background:var(--c1);
position:sticky;
bottom:0;
}
.input-box{
width:94%;
background:var(--c4);
border:1px solid rgba(255,255,255,.18);
padding:10px 16px;
border-radius:30px;
display:flex;
gap:10px;
align-items:center;
}
#userInput{
flex:1;background:transparent;border:none;outline:none;
color:var(--t1);font-size:18px;
}
.send-btn{
width:44px;height:44px;background:var(--accent);
border:none;border-radius:50%;color:var(--t1);
font-size:22px;cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){
.sidebar{width:58px}
.sidebar:hover{width:58px}
.sidebar-text{display:none}
.msg-bubble{font-size:15px}
#userInput{font-size:16px}
.send-btn{width:40px;height:40px;font-size:20px}
.input-bar{padding:12px 0}
}
</style>
</head>

<body class="theme-purple">

<!-- SPLASH -->
<div id="splash">
<h1>Febl KI</h1>
<p>Loading…</p>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="sidebar-icon" data-action="home"><span>🏠</span><p class="sidebar-text" id="txt_home">Home</p></div>
<div class="sidebar-icon" data-action="about"><span>👤</span><p class="sidebar-text" id="txt_about">Über Febl</p></div>
<div class="sidebar-icon" data-action="support"><span>💬</span><p class="sidebar-text" id="txt_support">Support</p></div>
<div class="sidebar-icon" data-action="clear"><span>🗑️</span><p class="sidebar-text" id="txt_clear">Chat löschen</p></div>
<div class="sidebar-icon" data-action="settings"><span>⚙️</span><p class="sidebar-text" id="txt_settings">Einstellungen</p></div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel" class="settings-panel">
<div class="settings-title" id="txt_settings_title">Einstellungen</div>

<div class="settings-section-title" id="txt_theme_title">Theme</div>
<select id="themeSelect" class="settings-select">
<option value="purple">Lila</option>
<option value="blue">Blau</option>
<option value="red">Rot</option>
<option value="green">Grün</option>
<option value="black">Schwarz</option>
</select>

<div class="settings-section-title" id="txt_lang_title">Sprache</div>
<select id="langSelect" class="settings-select">
<option value="de">Deutsch</option>
<option value="en">English</option>
</select>
</div>

<!-- MAIN -->
<div class="main">
<div class="header" id="txt_header">Febl KI</div>
<div class="chat" id="chat"></div>

<div class="input-bar">
<div class="input-box">
<input id="userInput" type="text" placeholder="Nachricht eingeben…">
<button class="send-btn" id="sendBtn">➤</button>
</div>
</div>
</div>

<script>
const API_KEY="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";
const MODEL="meta-llama/llama-prompt-guard-2-22m";
const API_URL="https://api.groq.com/openai/v1/chat/completions";

const chat=document.getElementById("chat");
const input=document.getElementById("userInput");
const sendBtn=document.getElementById("sendBtn");
const settingsPanel=document.getElementById("settingsPanel");
const themeSelect=document.getElementById("themeSelect");
const langSelect=document.getElementById("langSelect");

let lang="de";
let messages=[];

/* SPLASH */
setTimeout(()=>{document.getElementById("splash").style.opacity="0"},1200);
setTimeout(()=>{document.getElementById("splash").style.display="none"},2200);

/* LANGUAGE */
function updateLanguage(){
document.getElementById("txt_home").textContent=lang==="de"?"Home":"Home";
document.getElementById("txt_about").textContent=lang==="de"?"Über Febl":"About Febl";
document.getElementById("txt_support").textContent=lang==="de"?"Support":"Support";
document.getElementById("txt_clear").textContent=lang==="de"?"Chat löschen":"Clear chat";
document.getElementById("txt_settings").textContent=lang==="de"?"Einstellungen":"Settings";
document.getElementById("txt_settings_title").textContent=lang==="de"?"Einstellungen":"Settings";
document.getElementById("txt_theme_title").textContent=lang==="de"?"Theme":"Theme";
document.getElementById("txt_lang_title").textContent=lang==="de"?"Sprache":"Language";
document.getElementById("txt_header").textContent=lang==="de"?"Febl KI":"Febl AI";
input.placeholder=lang==="de"?"Nachricht eingeben…":"Type a message…";
}

function t(de,en){return lang==="de"?de:en}

/* CHAT */
function renderMessage(role,text){
const row=document.createElement("div");
row.className="msg-row "+(role==="user"?"user-row":"assistant-row");
const bubble=document.createElement("div");
bubble.className="msg-bubble";
bubble.textContent=text;
row.appendChild(bubble);
chat.appendChild(row);
chat.scrollTop=chat.scrollHeight;
}

function addMessage(role,text){
messages.push({role,content:text});
renderMessage(role,text);
}

/* LOADING DOTS */
function loading(){
const row=document.createElement("div");
row.className="msg-row assistant-row";
const bubble=document.createElement("div");
bubble.className="loading";
bubble.innerHTML="<div></div><div></div><div></div>";
row.id="loadingBubble";
row.appendChild(bubble);
chat.appendChild(row);
chat.scrollTop=chat.scrollHeight;
}

function removeLoading(){
const el=document.getElementById("loadingBubble");
if(el)el.remove();
}

/* Startnachricht als assistant */
addMessage("assistant",t("Hallo ! Wie kann ich dir helfen?","Hello ! How can I help you?"));

/* KI ANTWORTET IMMER – AUCH BEI FEHLER */
async function sendToAI(text){
loading();

try{
const history=[
{role:"system",content:t("Du antwortest freundlich und hilfst dem Nutzer.","You answer friendly and help the user.")},
...messages,
{role:"user",content:text}
];

const res=await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+API_KEY
},
body:JSON.stringify({
model:MODEL,
messages:history,
temperature:0.7,
max_tokens:1024,
top_p:1
})
});

const data=await res.json();
removeLoading();

/* Wenn API Fehler zurückgibt → trotzdem antworten */
if(data.error){
addMessage("assistant","⚠️ Fehler: "+data.error.message);
return;
}

/* Normale Antwort */
addMessage("assistant",data.choices[0].message.content);

}catch(err){
removeLoading();

/* Wenn Fetch komplett scheitert → trotzdem antworten */
addMessage("assistant","⚠️ Netzwerkfehler: "+err.message);
}
}

function send(){
const text=input.value.trim();
if(!text)return;
input.value="";
addMessage("user",text);
sendToAI(text);
}

sendBtn.onclick=send;
input.onkeydown=e=>{if(e.key==="Enter")send()};

/* SIDEBAR */
document.querySelectorAll(".sidebar-icon").forEach(icon=>{
icon.onclick=()=>{
const a=icon.dataset.action;
if(a==="home")window.location.href="https://febl-industry-3.jimdosite.com/";
if(a==="about")window.location.href="https://febl-industry-3.jimdosite.com/ueber-mich/";
if(a==="support")window.location.href="https://febl-industry-3.jimdosite.com/kontakt/";
if(a==="clear"){
messages=[];
chat.innerHTML="";
addMessage("assistant",t("Chat gelöscht.","Chat cleared."));
}
if(a==="settings")settingsPanel.classList.toggle("open");
};
});

/* SETTINGS */
themeSelect.onchange=e=>document.body.className="theme-"+e.target.value;
langSelect.onchange=e=>{lang=e.target.value;updateLanguage()};

document.body.onclick=e=>{
if(!e.target.closest(".settings-panel")&&!e.target.closest(".sidebar-icon"))
settingsPanel.classList.remove("open");
};

updateLanguage();
</script>

</body>
</html>
