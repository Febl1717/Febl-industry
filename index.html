<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Chat – Offline KI</title>

<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #0a1224;
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 900px;
        height: 85vh;
        background: #0f1a33;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.25);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    .header {
        padding: 14px 20px;
        background: #0d1730;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        font-size: 16px;
        font-weight: 600;
    }

    .chat {
        padding: 20px;
        overflow-y: auto;
    }

    .msg-row {
        display: flex;
        margin-bottom: 14px;
        opacity: 0;
        transform: translateY(10px);
        animation: msgEnter 0.35s ease forwards;
    }
    @keyframes msgEnter {
        to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-bubble {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-wrap;
        animation: bubblePop 0.25s ease;
    }
    @keyframes bubblePop {
        0% { transform: scale(0.9); }
        100% { transform: scale(1); }
    }

    .msg-bubble.user {
        background: #1e3a8a;
        color: #e5e7eb;
    }
    .msg-bubble.ai {
        background: #162447;
        color: #e5e7eb;
        border: 1px solid rgba(255,255,255,0.08);
    }

    .typing {
        display: flex;
        gap: 6px;
        padding: 10px 16px;
        background: #162447;
        border-radius: 14px;
        width: fit-content;
        margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.08);
        opacity: 0;
        animation: msgEnter 0.35s ease forwards;
    }
    .dot {
        width: 8px;
        height: 8px;
        background: #3b82f6;
        border-radius: 50%;
        animation: blink 1.4s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
        0% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 0.2; }
    }

    .footer {
        padding: 16px 20px;
        background: #0d1730;
        border-top: 1px solid rgba(255,255,255,0.08);
    }
    .input-wrapper {
        display: flex;
        gap: 12px;
        background: #0a1224;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.15);
        padding: 12px 16px;
    }
    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #e5e7eb;
        font-size: 16px;
    }
    .send-btn {
        padding: 10px 18px;
        background: #1e3a8a;
        border-radius: 10px;
        border: none;
        color: #e5e7eb;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="app">
    <div class="header">Febl Chat – Offline KI</div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" placeholder="Schreib etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

/* Offline-KI: einfache Logik */
function offlineAI(prompt) {
    prompt = prompt.toLowerCase();

    if (prompt.includes("wie geht")) return "Mir geht’s gut, Felix! Ich bin deine Offline‑KI.";
    if (prompt.includes("wer bist")) return "Ich bin eine kleine Offline‑KI, die komplett im Browser läuft.";
    if (prompt.includes("hilfe")) return "Klar! Sag mir einfach, wobei du Hilfe brauchst.";
    if (prompt.includes("idee")) return "Hier eine Idee: Bau dir ein eigenes KI‑Dashboard im Dark‑Blue‑Style!";
    if (prompt.includes("was ist")) return "Das kann ich dir erklären! Schreib einfach: erklär + Thema.";

    if (prompt.startsWith("erklär")) {
        const topic = prompt.replace("erklär", "").trim();
        return "Okay, ich erklär dir: " + topic + "\n\nIch bin zwar offline, aber ich kann einfache Erklärungen geben.";
    }

    return "Interessant! Erzähl mir mehr darüber.";
}

/* Chat Funktionen */
function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    row.innerHTML = `<div class="msg-bubble user">${text}</div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    row.innerHTML = `<div class="msg-bubble ai">${text}</div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function typingAnimation() {
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = `
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    `;
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    setTimeout(() => typing.remove(), 1200);
}

/* Senden */
sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});

function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addUser(text);
    typingAnimation();

    setTimeout(() => {
        const answer = offlineAI(text);
        addAI(answer);
    }, 1200);
}
</script>

</body>
</html>
