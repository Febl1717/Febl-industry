<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl KI – Copilot Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}

/* THEMES */
:root{
    --bg-main:#0a0b1f;
    --bg-sidebar:#13143a;
    --bg-header:#1a1b4a;
    --bg-chat:#0a0b1f;
    --bg-input:#1e1f4d;
    --bg-bubble-ai:#1e1f4d;
    --bg-bubble-user:#7c3aed;
    --accent:#7c3aed;
    --accent-soft:#9d4edd;
    --text-main:#ffffff;
    --text-soft:#e9d5ff;
}
.theme-blue{
    --bg-main:#0b1120;
    --bg-sidebar:#0f172a;
    --bg-header:#1e293b;
    --bg-chat:#020617;
    --bg-input:#1f2937;
    --bg-bubble-ai:#1e293b;
    --bg-bubble-user:#3b82f6;
    --accent:#3b82f6;
    --accent-soft:#60a5fa;
    --text-main:#ffffff;
    --text-soft:#e5e7eb;
}
.theme-purple{
    --bg-main:#0a0b1f;
    --bg-sidebar:#13143a;
    --bg-header:#1a1b4a;
    --bg-chat:#0a0b1f;
    --bg-input:#1e1f4d;
    --bg-bubble-ai:#1e1f4d;
    --bg-bubble-user:#7c3aed;
    --accent:#7c3aed;
    --accent-soft:#9d4edd;
    --text-main:#ffffff;
    --text-soft:#e9d5ff;
}
.theme-red{
    --bg-main:#1a0b0b;
    --bg-sidebar:#3b0f0f;
    --bg-header:#4c1d1d;
    --bg-chat:#1a0b0b;
    --bg-input:#3f1f1f;
    --bg-bubble-ai:#3f1f1f;
    --bg-bubble-user:#ef4444;
    --accent:#ef4444;
    --accent-soft:#f97373;
    --text-main:#ffffff;
    --text-soft:#fee2e2;
}
.theme-green{
    --bg-main:#022c22;
    --bg-sidebar:#064e3b;
    --bg-header:#065f46;
    --bg-chat:#022c22;
    --bg-input:#064e3b;
    --bg-bubble-ai:#064e3b;
    --bg-bubble-user:#22c55e;
    --accent:#22c55e;
    --accent-soft:#4ade80;
    --text-main:#ecfdf5;
    --text-soft:#bbf7d0;
}
.theme-black{
    --bg-main:#000000;
    --bg-sidebar:#0a0a0a;
    --bg-header:#111827;
    --bg-chat:#000000;
    --bg-input:#111827;
    --bg-bubble-ai:#111827;
    --bg-bubble-user:#3b82f6;
    --accent:#3b82f6;
    --accent-soft:#60a5fa;
    --text-main:#f9fafb;
    --text-soft:#e5e7eb;
}

/* BODY */
body{
    background:var(--bg-main);
    height:100vh;
    display:flex;
    overflow:hidden;
    color:var(--text-main);
}

/* SIDEBAR */
.sidebar{
    width:70px;
    background:var(--bg-sidebar);
    border-right:1px solid rgba(255,255,255,0.08);
    display:flex;
    flex-direction:column;
    padding:14px 8px;
    gap:14px;
    transition:0.3s;
    position:relative;
}
.sidebar:hover{
    width:240px;
}
.sidebar-icon{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    background:#1e1f4d;
    border-radius:12px;
    cursor:pointer;
    transition:0.25s;
    overflow:hidden;
    white-space:nowrap;
}
.sidebar-icon span{
    font-size:22px;
}
.sidebar-icon:hover{
    background:var(--accent);
    transform:translateX(6px);
}
.sidebar-text{
    opacity:0;
    font-size:14px;
    transition:0.3s;
}
.sidebar:hover .sidebar-text{
    opacity:1;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* HEADER */
.header{
    padding:16px 22px;
    font-size:22px;
    font-weight:700;
    background:var(--bg-header);
    border-bottom:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 25px var(--accent);
    color:var(--text-soft);
}

/* CHAT */
.chat{
    flex:1;
    padding:20px;
    overflow-y:auto;
}

/* BUBBLES */
.msg-row{
    margin-bottom:20px;
    display:flex;
    align-items:flex-start;
    gap:12px;
}
.msg-bubble{
    max-width:75%;
    padding:14px 18px;
    border-radius:18px;
    font-size:17px;
    line-height:1.6;
    white-space:pre-wrap;
    animation:fadeIn 0.3s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}
.user-row{
    flex-direction:row-reverse;
}
.user-row .msg-bubble{
    background:var(--bg-bubble-user);
    color:var(--text-main);
}
.ai-row .msg-bubble{
    background:var(--bg-bubble-ai);
    border:1px solid rgba(255,255,255,0.1);
}

/* INPUT */
.input-bar{
    padding:16px;
    background:var(--bg-header);
    border-top:1px solid rgba(255,255,255,0.1);
    display:flex;
    justify-content:center;
}
.input-box{
    width:90%;
    background:var(--bg-input);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:26px;
    padding:14px 18px;
    display:flex;
    gap:10px;
    align-items:center;
    transition:0.25s;
}
.input-box:focus-within{
    box-shadow:0 0 12px var(--accent);
}
#userInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text-main);
    font-size:17px;
}
.send-btn{
    width:50px;
    height:50px;
    background:var(--accent);
    border:none;
    border-radius:50%;
    color:var(--text-main);
    font-size:22px;
    cursor:pointer;
    transition:0.25s;
}
.send-btn:hover{
    background:var(--accent-soft);
    transform:scale(1.1);
}

/* SETTINGS PANEL */
.settings-panel{
    position:fixed;
    right:-340px;
    top:0;
    width:340px;
    height:100%;
    background:var(--bg-sidebar);
    box-shadow:-4px 0 20px rgba(0,0,0,0.5);
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:16px;
    transition:0.4s;
    z-index:9999;
}
.settings-panel.open{
    right:0;
}
.settings-title{
    font-size:22px;
    font-weight:700;
    color:var(--accent);
}
.settings-section-title{
    font-size:16px;
    margin-top:8px;
    margin-bottom:4px;
}
.settings-select{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
    background:#1e1f4d;
    color:var(--text-main);
    font-size:15px;
}
.settings-item{
    padding:12px;
    background:#1e1f4d;
    border-radius:14px;
    font-size:16px;
    cursor:pointer;
    transition:0.25s;
    margin-bottom:6px;
}
.settings-item:hover{
    background:var(--accent);
}

/* MOBILE */
@media(max-width:600px){
    .sidebar{
        width:70px;
    }
    .sidebar:hover{
        width:70px;
    }
    .sidebar-text{
        display:none;
    }
    .settings-panel{
        width:100%;
    }
}
</style>
</head>
<body class="theme-purple">

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-icon" data-action="home">
        <span>🏠</span><p class="sidebar-text">Startseite</p>
    </div>
    <div class="sidebar-icon" data-action="about">
        <span>👤</span><p class="sidebar-text">Über Febl</p>
    </div>
    <div class="sidebar-icon" data-action="support">
        <span>💬</span><p class="sidebar-text">Support</p>
    </div>
    <div class="sidebar-icon" data-action="settings">
        <span>⚙️</span><p class="sidebar-text">Einstellungen</p>
    </div>
</div>

<!-- SETTINGS PANEL -->
<div id="settingsPanel" class="settings-panel">
    <div class="settings-title" id="txt_settings_title">KI Einstellungen</div>

    <div class="settings-section-title" id="txt_style_title">Antwort‑Stil</div>
    <select id="styleSelect" class="settings-select">
        <option value="normal">Normal</option>
        <option value="kurz">Kurz</option>
        <option value="ausführlich">Ausführlich</option>
        <option value="kreativ">Kreativ</option>
    </select>

    <div class="settings-section-title" id="txt_lang_title">Sprache</div>
    <select id="langSelect" class="settings-select">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
    </select>

    <div class="settings-section-title" id="txt_theme_title">Theme</div>
    <select id="themeSelect" class="settings-select">
        <option value="purple">Lila</option>
        <option value="blue">Blau</option>
        <option value="red">Rot</option>
        <option value="green">Grün</option>
        <option value="black">Schwarz</option>
    </select>

    <div class="settings-section-title" id="txt_actions_title">Aktionen</div>
    <div class="settings-item" id="txt_clear_chat">Chat‑Verlauf löschen</div>
</div>

<!-- MAIN -->
<div class="main">
    <div class="header" id="txt_header">Chat</div>

    <div class="chat" id="chat"></div>

    <div class="input-bar">
        <div class="input-box">
            <input id="userInput" type="text" placeholder="Nachricht eingeben …">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<script>
const API_KEY = "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";
const MODEL   = "groq/compound-mini";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const settingsPanel = document.getElementById("settingsPanel");

let messages = JSON.parse(localStorage.getItem("feblChatHistory") || "[]");
let answerStyle = localStorage.getItem("feblStyle") || "normal";
let answerLang = localStorage.getItem("feblLang") || "de";
let currentTheme = localStorage.getItem("feblTheme") || "purple";

document.getElementById("styleSelect").value = answerStyle;
document.getElementById("langSelect").value = answerLang;
document.getElementById("themeSelect").value = currentTheme;

applyTheme(currentTheme);
applyLanguage(answerLang);

/* SIDEBAR ACTIONS */
document.querySelectorAll(".sidebar-icon").forEach(icon => {
    icon.onclick = () => {
        const action = icon.dataset.action;
        if(action === "home"){
            window.location.href = "https://febl-industry-3.jimdosite.com/";
        }
        if(action === "about"){
            window.location.href = "https://febl-industry-3.jimdosite.com/ueber-mich/";
        }
        if(action === "support"){
            window.location.href = "https://febl-industry-3.jimdosite.com/kontakt/";
        }
        if(action === "settings"){
            openSettings();
        }
    };
});

/* SETTINGS PANEL */
function openSettings(){
    settingsPanel.classList.add("open");
}
document.body.addEventListener("click", e => {
    if(!e.target.closest(".settings-panel") && !e.target.closest(".sidebar-icon")){
        settingsPanel.classList.remove("open");
    }
});

/* SETTINGS CHANGE */
document.getElementById("styleSelect").onchange = e => {
    answerStyle = e.target.value;
    localStorage.setItem("feblStyle", answerStyle);
};
document.getElementById("langSelect").onchange = e => {
    answerLang = e.target.value;
    localStorage.setItem("feblLang", answerLang);
    applyLanguage(answerLang);
};
document.getElementById("themeSelect").onchange = e => {
    currentTheme = e.target.value;
    localStorage.setItem("feblTheme", currentTheme);
    applyTheme(currentTheme);
};

/* LANGUAGE SYSTEM */
function applyLanguage(lang){
    if(lang === "de"){
        document.getElementById("txt_header").textContent = "Chat";
        document.getElementById("txt_settings_title").textContent = "KI Einstellungen";
        document.getElementById("txt_style_title").textContent = "Antwort‑Stil";
        document.getElementById("txt_lang_title").textContent = "Sprache";
        document.getElementById("txt_theme_title").textContent = "Theme";
        document.getElementById("txt_actions_title").textContent = "Aktionen";
        document.getElementById("txt_clear_chat").textContent = "Chat‑Verlauf löschen";
        input.placeholder = "Nachricht eingeben …";

        document.querySelector('[data-action="home"] .sidebar-text').textContent = "Startseite";
        document.querySelector('[data-action="about"] .sidebar-text').textContent = "Über Febl";
        document.querySelector('[data-action="support"] .sidebar-text').textContent = "Support";
        document.querySelector('[data-action="settings"] .sidebar-text').textContent = "Einstellungen";
    }
    if(lang === "en"){
        document.getElementById("txt_header").textContent = "Chat";
        document.getElementById("txt_settings_title").textContent = "AI Settings";
        document.getElementById("txt_style_title").textContent = "Response Style";
        document.getElementById("txt_lang_title").textContent = "Language";
        document.getElementById("txt_theme_title").textContent = "Theme";
        document.getElementById("txt_actions_title").textContent = "Actions";
        document.getElementById("txt_clear_chat").textContent = "Clear Chat";
        input.placeholder = "Type a message…";

        document.querySelector('[data-action="home"] .sidebar-text').textContent = "Home";
        document.querySelector('[data-action="about"] .sidebar-text').textContent = "About Febl";
        document.querySelector('[data-action="support"] .sidebar-text').textContent = "Support";
        document.querySelector('[data-action="settings"] .sidebar-text').textContent = "Settings";
    }
}

/* THEME SYSTEM */
function applyTheme(theme){
    const body = document.body;
    body.classList.remove("theme-blue","theme-purple","theme-red","theme-green","theme-black");
    body.classList.add("theme-" + theme);
}

/* SYSTEM MESSAGE */
function systemMessage(){
    let styleText = "";
    if(answerStyle === "kurz") styleText = answerLang==="de"?"Antworte kurz und knapp.":"Answer briefly and concisely.";
    if(answerStyle === "ausführlich") styleText = answerLang==="de"?"Antworte ausführlich und detailliert.":"Answer in a detailed and extensive way.";
    if(answerStyle === "kreativ") styleText = answerLang==="de"?"Antworte kreativ und locker.":"Answer creatively and casually.";

    let langText = answerLang==="de"
        ?"Du antwortest IMMER auf Deutsch und verwendest keine Namen."
        :"You ALWAYS answer in English and do not use names.";

    return {
        role:"system",
        content:`${langText} ${styleText}`
    };
}

/* CHAT INIT */
if(!messages.length){
    addMessage("ai",answerLang==="de"?"Hallo! Wie kann ich dir helfen?":"Hi! How can I help you?");
}else{
    messages.forEach(m=>renderMessage(m.role==="user"?"user":"ai",m.content));
}

/* CHAT FUNKTIONEN */
function addMessage(role,text){
    messages.push({role:role==="user"?"user":"assistant",content:text});
    localStorage.setItem("feblChatHistory",JSON.stringify(messages));
    renderMessage(role,text);
}
function renderMessage(role,text){
    const row=document.createElement("div");
    row.className="msg-row "+(role==="user"?"user-row":"ai-row");
    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent=text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
}

/* API CALL */
async function sendToAPI(userText){
    const history=[systemMessage(),...messages.slice(-10),{role:"user",content:userText}];
    try{
        const res=await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${API_KEY}`
            },
            body:JSON.stringify({
                model:MODEL,
                messages:history
            })
        });
        const data=await res.json();
        if(!res.ok){
            addMessage("ai","API‑Fehler:\n"+JSON.stringify(data,null,2));
            return;
        }
        addMessage("ai",data.choices[0].message.content);
    }catch(e){
        addMessage("ai","Fehler:\n"+e.message);
    }
}

/* SEND */
function send(){
    const text=input.value.trim();
    if(!text)return;
    input.value="";
    addMessage("user",text);
    sendToAPI(text);
}
sendBtn.onclick=send;
input.onkeydown=e=>{if(e.key==="Enter")send()};

/* CLEAR CHAT */
document.getElementById("txt_clear_chat").onclick = clearChat;
function clearChat(){
    localStorage.removeItem("feblChatHistory");
    messages=[];
    chat.innerHTML="";
    addMessage("ai",answerLang==="de"?"Chat gelöscht. Hallo!":"Chat cleared. Hi!");
}
</script>
</body>
</html>
