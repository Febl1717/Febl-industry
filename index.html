<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Chat – Dark Blue</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #0a1224;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 900px;
        max-width: 95vw;
        height: 85vh;
        background: #0f1a33;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.25);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    /* Header */
    .header {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: #0d1730;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    /* Chat */
    .chat {
        padding: 20px;
        overflow-y: auto;
    }

    .msg-row {
        display: flex;
        margin-bottom: 14px;
        opacity: 0;
        transform: translateY(10px);
        animation: msgEnter 0.35s ease forwards;
    }

    @keyframes msgEnter {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-bubble {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-wrap;
        animation: bubblePop 0.25s ease;
    }

    @keyframes bubblePop {
        0% { transform: scale(0.9); }
        100% { transform: scale(1); }
    }

    .msg-bubble.user {
        background: #1e3a8a;
        color: #e5e7eb;
        border-bottom-right-radius: 4px;
        box-shadow: 0 4px 12px rgba(30,58,138,0.4);
    }

    .msg-bubble.ai {
        background: #162447;
        color: #e5e7eb;
        border-bottom-left-radius: 4px;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 4px 12px rgba(22,36,71,0.4);
    }

    /* Footer */
    .footer {
        padding: 16px 20px;
        border-top: 1px solid rgba(255,255,255,0.08);
        background: #0d1730;
    }

    .input-wrapper {
        display: flex;
        gap: 12px;
        align-items: center;
        background: #0a1224;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.15);
        padding: 12px 16px;
    }

    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #e5e7eb;
        font-size: 16px;
        outline: none;
    }

    #userInput::placeholder {
        color: #94a3b8;
    }

    .send-btn {
        padding: 10px 18px;
        border-radius: 10px;
        border: none;
        background: #1e3a8a;
        color: #e5e7eb;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    .send-btn:hover {
        background: #2a4bb8;
    }
</style>
</head>

<body>

<div class="app">
    <div class="header">Febl Chat – Dark Blue Edition</div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" autocomplete="off" placeholder="Schreib etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

addAI("Hey Felix! Willkommen im Dark‑Blue Chat. Schreib einfach los.");

input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
sendBtn.addEventListener("click", send);

function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addUser(text);
    handleAI(text);
}

function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble user";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble ai";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

/* einfache lokale Antwortlogik */
function handleAI(prompt) {
    const p = prompt.toLowerCase();

    if (p.includes("wie gehts") || p.includes("wie geht es")) {
        addAI("Mir geht’s gut, Felix. Das neue Design fühlt sich ziemlich smooth an.");
        return;
    }

    if (p.includes("wer bist du")) {
        addAI("Ich bin Febl Chat – deine dunkle, blaue, animierte Chat‑Konsole.");
        return;
    }

    addAI("Interessant! Ich bin noch eine einfache Version ohne echte KI‑Backend, aber das Design steht. Sag mir, was du als Nächstes willst.");
}
</script>

</body>
</html>
