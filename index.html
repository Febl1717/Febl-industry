<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Chat – Febl‑Core v2</title>

<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #0a1224;
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 900px;
        height: 85vh;
        background: #0f1a33;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.25);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    .header {
        padding: 14px 20px;
        background: #0d1730;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        font-size: 16px;
        font-weight: 600;
    }

    .chat {
        padding: 20px;
        overflow-y: auto;
    }

    .msg-row {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
        opacity: 0;
        transform: translateY(10px);
        animation: msgEnter 0.35s ease forwards;
    }
    @keyframes msgEnter {
        to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .msg-bubble {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-wrap;
        animation: bubblePop 0.25s ease;
    }
    @keyframes bubblePop {
        0% { transform: scale(0.9); }
        100% { transform: scale(1); }
    }

    .msg-bubble.user {
        background: #1e3a8a;
        color: #e5e7eb;
    }
    .msg-bubble.ai {
        background: #162447;
        color: #e5e7eb;
        border: 1px solid rgba(255,255,255,0.08);
    }

    .typing {
        display: flex;
        gap: 6px;
        padding: 10px 16px;
        background: #162447;
        border-radius: 14px;
        width: fit-content;
        margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.08);
        opacity: 0;
        animation: msgEnter 0.35s ease forwards;
    }
    .dot {
        width: 8px;
        height: 8px;
        background: #3b82f6;
        border-radius: 50%;
        animation: blink 1.4s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
        0% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 0.2; }
    }

    .footer {
        padding: 16px 20px;
        background: #0d1730;
        border-top: 1px solid rgba(255,255,255,0.08);
    }
    .input-wrapper {
        display: flex;
        gap: 12px;
        background: #0a1224;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.15);
        padding: 12px 16px;
    }
    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #e5e7eb;
        font-size: 16px;
    }
    .send-btn {
        padding: 10px 18px;
        background: #1e3a8a;
        border-radius: 10px;
        border: none;
        color: #e5e7eb;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="app">
    <div class="header">Febl‑Core v2 – Offline Super‑KI</div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" placeholder="Schreib etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
/* Profilbilder */
const avatarUser = "https://api.iconify.design/mdi:account-circle.svg?color=white";
const avatarAI   = "https://api.iconify.design/mdi:robot.svg?color=white";

/* Kontext-Gedächtnis */
let memory = {
    lastEmotion: "neutral",
    lastTopic: "",
    conversationHistory: []
};

/* Synonyme */
const synonyms = {
    "wie geht": ["wie gehts", "wie geht es dir", "alles gut"],
    "hilfe": ["kannst du mir helfen", "brauch hilfe", "hilfe bitte"],
    "idee": ["inspiration", "vorschlag", "tipp"],
    "erklär": ["erklaere", "erkläre", "erklär mal"],
    "liste": ["mach mir eine liste", "liste erstellen", "auflisten"]
};

/* Emotionserkennung */
function detectEmotion(text) {
    text = text.toLowerCase();
    if (text.includes("traurig") || text.includes("schlecht") || text.includes("down")) return "sad";
    if (text.includes("wütend") || text.includes("sauer") || text.includes("genervt")) return "angry";
    if (text.includes("glücklich") || text.includes("gut") || text.includes("nice")) return "happy";
    return "neutral";
}

/* Antwort-Varianten */
const tones = {
    neutral: [
        "Okay Felix, lass uns das anschauen:",
        "Alles klar, ich erklär dir das:",
        "Verstanden, hier ist meine Antwort:",
        "Gute Frage, Felix:",
        "Ich sag’s dir direkt:"
    ],
    happy: [
        "Nice! Das klingt gut:",
        "Geile Energie, Felix:",
        "Love it! Hier:",
        "Mega Stimmung, also:",
        "Okay, mit guter Laune geht’s leichter:"
    ],
    sad: [
        "Hey Felix… klingt nicht so gut. Ich helf dir:",
        "Ich bin bei dir, lass uns das klären:",
        "Klingt schwer… aber wir schaffen das:",
        "Ich hör dir zu:",
        "Okay… Schritt für Schritt:"
    ],
    angry: [
        "Okay, Felix… ruhig bleiben. Ich helf dir:",
        "Ich versteh den Frust. Lass uns das lösen:",
        "Alles klar, wir fixen das:",
        "Okay, direkt zur Sache:",
        "Ich mach’s kurz und klar:"
    ]
};

/* Synonym-Matcher */
function matchIntent(text) {
    text = text.toLowerCase();
    for (const key in synonyms) {
        for (const syn of synonyms[key]) {
            if (text.includes(syn)) return key;
        }
    }
    return null;
}

/* Haupt-KI */
function feblCore(text) {
    const emotion = detectEmotion(text);
    memory.lastEmotion = emotion;
    memory.conversationHistory.push(text);

    const tone = tones[emotion][Math.floor(Math.random() * tones[emotion].length)];

    const intent = matchIntent(text);

    /* Intent-Handling */
    if (intent === "wie geht") {
        return `${tone} Mir geht’s gut, Felix — ich bin bereit!`;
    }

    if (intent === "hilfe") {
        return `${tone} Klar, sag einfach, wobei du Hilfe brauchst.`;
    }

    if (intent === "idee") {
        return `${tone} Hier eine Idee: Bau dir ein KI‑Dashboard mit animierten Panels und Live‑Status.`;
    }

    if (intent === "liste") {
        return `${tone} Okay, hier ist deine Liste:\n\n• Punkt 1\n• Punkt 2\n• Punkt 3\n\nSag mir, was rein soll, dann mach ich sie personalisiert.`;
    }

    if (intent === "erklär") {
        const topic = text.replace(/erklär|erklaere|erkläre|erklär mal/i, "").trim();
        memory.lastTopic = topic;
        return `${tone} Ich erklär dir **${topic}**:\n\n${topic} ist ein Thema, das man gut versteht, wenn man es in kleine Teile zerlegt.`;
    }

    /* Standard */
    return `${tone} Interessant! Erzähl mir mehr darüber.`;
}

/* Chat UI */
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    row.innerHTML = `
        <img class="avatar" src="${avatarUser}">
        <div class="msg-bubble user">${text}</div>
    `;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    row.innerHTML = `
        <img class="avatar" src="${avatarAI}">
        <div class="msg-bubble ai">${text}</div>
    `;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function typingAnimation() {
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = `
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    `;
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    setTimeout(() => typing.remove(), 1200);
}

/* Senden */
sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});

function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addUser(text);
    typingAnimation();

    setTimeout(() => {
        const answer = feblCore(text);
        addAI(answer);
    }, 1200);
}
</script>

</body>
</html>
