<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Chat – Local KI</title>

<!-- Neuer funktionierender WebLLM Loader -->
<script type="module">
    import * as webllm from "https://esm.run/webllm";

    window.webllm = webllm; // global verfügbar machen
</script>

<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #0a1224;
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .loader-screen {
        position: absolute;
        inset: 0;
        background: #0a1224;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
    }
    .loader-circle {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 6px solid rgba(255,255,255,0.1);
        border-top-color: #3b82f6;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
        font-size: 18px;
        letter-spacing: 1px;
        color: #cbd5e1;
        text-align: center;
        max-width: 300px;
    }

    .app {
        width: 900px;
        height: 85vh;
        background: #0f1a33;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.25);
        display: none;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
    }

    .header {
        padding: 14px 20px;
        background: #0d1730;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        font-size: 16px;
        font-weight: 600;
    }

    .chat {
        padding: 20px;
        overflow-y: auto;
    }

    .msg-row {
        display: flex;
        margin-bottom: 14px;
        opacity: 0;
        transform: translateY(10px);
        animation: msgEnter 0.35s ease forwards;
    }
    @keyframes msgEnter {
        to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-bubble {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-wrap;
        animation: bubblePop 0.25s ease;
    }
    @keyframes bubblePop {
        0% { transform: scale(0.9); }
        100% { transform: scale(1); }
    }

    .msg-bubble.user {
        background: #1e3a8a;
        color: #e5e7eb;
    }
    .msg-bubble.ai {
        background: #162447;
        color: #e5e7eb;
        border: 1px solid rgba(255,255,255,0.08);
    }

    .typing {
        display: flex;
        gap: 6px;
        padding: 10px 16px;
        background: #162447;
        border-radius: 14px;
        width: fit-content;
        margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.08);
        opacity: 0;
        animation: msgEnter 0.35s ease forwards;
    }
    .dot {
        width: 8px;
        height: 8px;
        background: #3b82f6;
        border-radius: 50%;
        animation: blink 1.4s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
        0% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 0.2; }
    }

    .footer {
        padding: 16px 20px;
        background: #0d1730;
        border-top: 1px solid rgba(255,255,255,0.08);
    }
    .input-wrapper {
        display: flex;
        gap: 12px;
        background: #0a1224;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.15);
        padding: 12px 16px;
    }
    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #e5e7eb;
        font-size: 16px;
    }
    .send-btn {
        padding: 10px 18px;
        background: #1e3a8a;
        border-radius: 10px;
        border: none;
        color: #e5e7eb;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="loader-screen" id="loader">
    <div class="loader-circle"></div>
    <div class="loader-text" id="loaderText">
        KI wird geladen…<br><br>
        Das dauert beim ersten Start 20–60 Sekunden.<br>
        Bitte warte kurz.
    </div>
</div>

<div class="app" id="app">
    <div class="header">Febl Chat – Local KI</div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" placeholder="Schreib etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script type="module">
let engine = null;
let modelReady = false;

const loader = document.getElementById("loader");
const loaderText = document.getElementById("loaderText");
const app = document.getElementById("app");
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

/* KI laden */
(async () => {
    try {
        loaderText.innerHTML = "KI wird geladen…<br><br>Bitte warte.";
        engine = await window.webllm.createEngine("Llama-3.2-3B-Instruct");
        modelReady = true;

        loader.style.display = "none";
        app.style.display = "grid";

        addAI("Hey Felix! Ich bin jetzt bereit. Frag mich einfach etwas.");
    } catch (e) {
        loaderText.innerHTML = "Fehler beim Laden der KI:<br>" + e;
    }
})();

/* Senden */
sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});

function send() {
    const text = input.value.trim();
    if (!text) return;

    if (!modelReady) {
        addAI("Die KI lädt noch. Warte bitte einen Moment.");
        return;
    }

    input.value = "";
    addUser(text);
    typingAnimation();

    setTimeout(() => {
        callLocalAI(text);
    }, 1200);
}

/* Chat Funktionen */
function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    row.innerHTML = `<div class="msg-bubble user">${text}</div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    row.innerHTML = `<div class="msg-bubble ai">${text}</div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function typingAnimation() {
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = `
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    `;
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    setTimeout(() => typing.remove(), 1200);
}

/* KI Antwort */
async function callLocalAI(prompt) {
    try {
        const result = await engine.chat.completions.create({
            messages: [
                { role: "system", content: "Du bist eine freundliche KI für Felix." },
                { role: "user", content: prompt }
            ]
        });

        addAI(result.choices[0].message.content);
    } catch (e) {
        addAI("Fehler: " + e);
    }
}
</script>

</body>
</html>
