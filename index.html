<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Febl KI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
:root{
--c1:#0a0b1f;--c2:#13143a;--c3:#1a1b4a;--c4:#1e1f4d;
--assistant:#1e1f4d;--user:#7c3aed;--accent:#7c3aed;
--t1:#fff;--t2:#e9d5ff;
--glass:rgba(255,255,255,0.04);
--soft:rgba(255,255,255,0.06);
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--c1),#05050a);color:var(--t1);display:flex;flex-direction:column;overflow:hidden}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:9999;transition:opacity .6s}
#particles{position:fixed;inset:0;pointer-events:none;z-index:0}
.header{height:64px;background:linear-gradient(90deg,var(--c3),rgba(26,27,74,0.9));display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:5}
.header-left{display:flex;align-items:center;gap:10px}
.header-btn{width:44px;height:44px;border-radius:12px;background:var(--glass);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--t1);cursor:pointer;backdrop-filter:blur(6px);transition:transform .18s,box-shadow .18s}
.header-btn:active{transform:scale(.98)}
.header-title{font-weight:700;font-size:18px;color:var(--t2);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:8px}
.container{display:flex;flex:1;position:relative;z-index:2;overflow:hidden}
.chat{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:8px}
.msg-row{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-bubble{max-width:78%;padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;box-shadow:0 6px 18px rgba(0,0,0,0.45)}
.user-row{justify-content:flex-end}
.user-row .msg-bubble{background:linear-gradient(90deg,var(--user),#5b2be6);color:#fff;border-radius:16px 16px 12px 16px}
.assistant-row .msg-bubble{background:linear-gradient(180deg,var(--assistant),rgba(255,255,255,0.02));color:var(--t1);border:1px solid rgba(255,255,255,0.04)}
.msg-meta{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:6px}
.input-bar{padding:12px;background:transparent;display:flex;justify-content:center;align-items:center;z-index:6}
.input-box{width:96%;max-width:980px;background:var(--soft);border-radius:999px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
#userInput{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-size:16px;padding:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--t1);cursor:pointer;font-size:20px;transition:transform .12s}
.icon-btn:active{transform:scale(.96)}
.send-btn{width:48px;height:48px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 30px rgba(124,58,237,0.18);transition:transform .12s}
.send-btn:active{transform:scale(.98)}
.bottom-sheet{position:fixed;left:0;right:0;bottom:-100%;background:linear-gradient(180deg,var(--c2),#0b0b16);padding:18px;border-radius:18px 18px 0 0;transition:bottom .28s cubic-bezier(.2,.9,.2,1);z-index:50}
.bottom-sheet.open{bottom:0}
.sheet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sheet-item{padding:12px;border-radius:12px;background:var(--glass);text-align:center;color:var(--t1);font-weight:600;cursor:pointer}
.tabs-sheet{position:fixed;left:0;right:0;bottom:-100%;background:linear-gradient(180deg,var(--c2),#0b0b16);padding:18px;border-radius:18px 18px 0 0;transition:bottom .28s cubic-bezier(.2,.9,.2,1);z-index:50}
.tabs-sheet.open{bottom:0}
.tab-item{padding:12px;border-radius:10px;background:var(--glass);margin-bottom:8px;color:var(--t1);cursor:pointer}
.side-panel{position:fixed;right:-360px;top:0;height:100%;width:360px;background:linear-gradient(180deg,var(--c2),#05050a);box-shadow:-20px 0 60px rgba(0,0,0,0.6);transition:right .28s;z-index:60;padding:18px;overflow:auto}
.side-panel.open{right:0}
.panel-section{margin-bottom:14px}
.panel-title{font-weight:700;color:var(--t2);margin-bottom:8px}
.todo-list{display:flex;flex-direction:column;gap:8px}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--glass)}
.todo-item .text{flex:1;color:var(--t1)}
.profile{display:flex;align-items:center;gap:10px}
.avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#5b2be6);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.emoji-picker{position:absolute;bottom:80px;left:18px;background:var(--c2);padding:8px;border-radius:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:80;box-shadow:0 10px 40px rgba(0,0,0,0.6)}
.emoji-btn{width:36px;height:36px;border-radius:8px;background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer}
.animated{transition:transform .18s,box-shadow .18s}
.animated:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,0.5)}
.profile-pic{width:36px;height:36px;border-radius:8px;object-fit:cover}
.gradient-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(600px 400px at 10% 10%,rgba(124,58,237,0.12),transparent),radial-gradient(500px 300px at 90% 90%,rgba(51,153,255,0.08),transparent)}
@media(min-width:900px){
.header{padding:0 24px}
.input-box{width:70%}
}
</style>
</head>
<body>
<div id="intro"><h1 style="color:#fff;font-size:28px">Febl KI</h1></div>
<div id="particles"></div>
<div class="gradient-bg"></div>
<div class="header">
  <div class="header-left">
    <div class="header-btn animated" id="menuBtn">☰</div>
    <div class="header-title" id="txt_header">Febl KI</div>
  </div>
  <div class="header-right">
    <div class="header-btn animated" id="tabsBtn">⋮</div>
    <img id="miniAvatar" class="profile-pic" src="" alt="" style="display:none">
  </div>
</div>
<div class="container">
  <div class="chat" id="chat"></div>
</div>
<div class="input-bar">
  <div class="input-box">
    <button class="icon-btn animated" id="emojiBtn">😊</button>
    <input id="userInput" type="text" placeholder="Nachricht eingeben…">
    <button class="icon-btn animated" id="micBtn">🎤</button>
    <button class="send-btn animated" id="sendBtn">➤</button>
  </div>
</div>
<div class="bottom-sheet" id="menuSheet">
  <div class="sheet-grid">
    <div class="sheet-item" id="btn_newchat">Neuer Chat</div>
    <div class="sheet-item" id="btn_deletechat">Chat löschen</div>
    <div class="sheet-item" id="btn_todo">To‑Do</div>
    <div class="sheet-item" id="btn_cache">Cache</div>
    <div class="sheet-item" id="btn_theme">Theme</div>
    <div class="sheet-item" id="btn_profile">Profilbild</div>
    <div class="sheet-item" id="btn_about">Über Febl</div>
    <div class="sheet-item" id="btn_support">Support</div>
  </div>
</div>
<div class="tabs-sheet" id="tabsSheet">
  <div id="tabsList"></div>
  <div class="sheet-item" id="tabs_newchat">Neuer Chat</div>
</div>
<div class="side-panel" id="sidePanel">
  <div class="panel-section">
    <div class="panel-title">To‑Do Liste</div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="todoInput" placeholder="Neue Aufgabe" style="flex:1;padding:10px;border-radius:10px;border:none;background:var(--soft);color:var(--t1)">
      <button id="todoAdd" class="sheet-item" style="padding:10px;border-radius:10px">Hinzufügen</button>
    </div>
    <div class="todo-list" id="todoList"></div>
  </div>
  <div class="panel-section">
    <div class="panel-title">Profil</div>
    <div class="profile">
      <div class="avatar" id="avatarPreview">F</div>
      <div style="flex:1">
        <div style="display:flex;gap:8px">
          <input id="nameInput" placeholder="Name" style="flex:1;padding:8px;border-radius:8px;border:none;background:var(--soft);color:var(--t1)">
          <input id="avatarUpload" type="file" accept="image/*" style="display:none">
          <button id="avatarBtn" class="sheet-item" style="padding:8px;border-radius:8px">Hochladen</button>
        </div>
      </div>
    </div>
  </div>
  <div class="panel-section">
    <div class="panel-title">Cache & Cleanup</div>
    <div style="display:flex;gap:8px">
      <button id="clearCache" class="sheet-item" style="flex:1">Cache leeren</button>
      <button id="autoCleanup" class="sheet-item" style="flex:1">Auto‑Cleanup</button>
    </div>
  </div>
</div>
<div id="emojiPicker" class="emoji-picker" style="display:none"></div>
<script>
const API_KEY="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";
const MODEL="groq/compound-mini";
const API_URL="https://api.groq.com/openai/v1/chat/completions";
let lang="de";
let theme="purple";
let chats=[];
let activeChat=0;
let todos=[];
let autoCleanupEnabled=true;
let maxChats=40;

function safeInit(){
  if(!Array.isArray(chats)) chats=[[]];
  if(chats.length===0) chats=[[]];
  if(typeof activeChat!=="number"||isNaN(activeChat)) activeChat=0;
  if(activeChat<0) activeChat=0;
  if(activeChat>=chats.length) activeChat=chats.length-1;
  if(!Array.isArray(chats[activeChat])) chats[activeChat]=[];
  if(!Array.isArray(todos)) todos=[];
}

function saveAll(){
  try{ localStorage.setItem("febl_chats",JSON.stringify(chats)); }catch(e){}
  try{ localStorage.setItem("febl_lang",lang); }catch(e){}
  try{ localStorage.setItem("febl_theme",theme); }catch(e){}
  try{ localStorage.setItem("febl_activeChat",String(activeChat)); }catch(e){}
  try{ localStorage.setItem("febl_todos",JSON.stringify(todos)); }catch(e){}
  try{ localStorage.setItem("febl_avatar",document.getElementById("avatarPreview").dataset.src||""); }catch(e){}
}

function loadAll(){
  try{ const raw=localStorage.getItem("febl_chats"); if(raw){ const p=JSON.parse(raw); if(Array.isArray(p)) chats=p; } }catch(e){ chats=[[]]; }
  try{ const l=localStorage.getItem("febl_lang"); if(l) lang=l; }catch(e){}
  try{ const t=localStorage.getItem("febl_theme"); if(t) theme=t; }catch(e){}
  try{ const a=localStorage.getItem("febl_activeChat"); if(a!==null) activeChat=parseInt(a); }catch(e){}
  try{ const td=localStorage.getItem("febl_todos"); if(td){ const p=JSON.parse(td); if(Array.isArray(p)) todos=p; } }catch(e){ todos=[]; }
  safeInit();
  applyTheme(theme);
  applyLanguage();
  renderTabs();
  renderChat();
  renderTodos();
  const av=localStorage.getItem("febl_avatar"); 
  if(av){ 
    const img=document.getElementById("miniAvatar"); 
    img.src=av; 
    img.style.display="block"; 
    const ap=document.getElementById("avatarPreview"); 
    ap.style.backgroundImage=`url(${av})`; 
    ap.dataset.src=av; 
    ap.textContent=""; 
  }
  updateHeader();   // WICHTIG: Header nach Laden aktualisieren
}

function applyLanguage(){
  // ⚠️ FIX: Header NICHT mehr hier setzen!
  document.getElementById("userInput").placeholder = lang==="de" ? "Nachricht eingeben…" : "Type a message…";
  document.getElementById("btn_newchat").textContent = lang==="de" ? "Neuer Chat" : "New chat";
  document.getElementById("btn_deletechat").textContent = lang==="de" ? "Chat löschen" : "Delete chat";
  document.getElementById("tabs_newchat").textContent = lang==="de" ? "Neuer Chat" : "New chat";
  saveAll();
}

function setVar(k,v){document.documentElement.style.setProperty(k,v)}

function applyTheme(t){
  theme=t;
  if(t==="purple"){ setVar("--accent","#7c3aed"); setVar("--user","#7c3aed"); }
  if(t==="blue"){ setVar("--accent","#3399ff"); setVar("--user","#3399ff"); }
  if(t==="green"){ setVar("--accent","#33cc99"); setVar("--user","#33cc99"); }
  saveAll();
}

function limitChats(){
  if(chats.length>maxChats){
    chats = chats.slice(chats.length-maxChats);
    activeChat = Math.min(activeChat, chats.length-1);
  }
}

function autoCleanup(){
  if(!autoCleanupEnabled) return;
  limitChats();
  for(let i=chats.length-1;i>=0;i--){
    if(Array.isArray(chats[i]) && chats[i].length===0 && chats.length>1){
      chats.splice(i,1);
    }
  }
  if(chats.length===0) chats=[[]];
  activeChat = Math.min(activeChat, chats.length-1);
  saveAll();
}

function newChat(){
  safeInit();
  chats.push([]);
  activeChat = chats.length-1;
  autoCleanup();
  renderTabs();
  renderChat();
  saveAll();
  updateHeader();
}

function deleteChat(){
  safeInit();
  if(chats.length>1){
    chats.splice(activeChat,1);
    activeChat = Math.max(0, activeChat-1);
  } else {
    chats[0]=[];
  }
  autoCleanup();
  renderTabs();
  renderChat();
  saveAll();
  updateHeader();
}

function renderTabs(){
  safeInit();
  const list=document.getElementById("tabsList");
  if(!list) return;
  list.innerHTML="";
  chats.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="tab-item";
    div.textContent = (i===activeChat ? "● " : "") + (lang==="de" ? "Chat " : "Chat ") + (i+1);
    div.onclick = ()=>{ 
      activeChat=i; 
      document.getElementById("tabsSheet").classList.remove("open"); 
      renderTabs(); 
      renderChat(); 
      saveAll(); 
      updateHeader();
    };
    list.appendChild(div);
  });
}

function deriveTitleFromChat(chat){
  if(!Array.isArray(chat) || chat.length===0) return null;
  for(let i=chat.length-1;i>=0;i--){
    const m=chat[i];
    if(!m || !m.content) continue;
    const txt=String(m.content).trim();
    if(txt.length===0) continue;
    const short = txt.split("\n")[0].slice(0,40);
    return short + (short.length>=40 ? "…" : "");
  }
  return null;
}

function updateHeader(){
  safeInit();
  const name = (document.getElementById("nameInput") && document.getElementById("nameInput").value) || "";
  const titleEl = document.getElementById("txt_header");
  const chatTitle = deriveTitleFromChat(chats[activeChat]);
  if(chatTitle){
    titleEl.textContent = chatTitle;
  } else if(name){
    titleEl.textContent = name;
  } else {
    titleEl.textContent = (lang==="de" ? "Chat " : "Chat ") + (activeChat+1);
  }
}

function renderChat(){
  safeInit();
  const chatEl=document.getElementById("chat");
  if(!chatEl) return;
  chatEl.innerHTML="";
  const current = chats[activeChat] || [];
  current.forEach(m=>{
    if(!m || typeof m.content==="undefined") return;
    const row=document.createElement("div");
    row.className="msg-row "+(m.role==="user"?"user-row":"assistant-row");
    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent=String(m.content);
    row.appendChild(bubble);
    chatEl.appendChild(row);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
  updateHeader();   // Header nach jedem Render aktualisieren
}

function addMessage(role,text){
  safeInit();
  if(typeof text==="undefined"||text===null) text="";
  chats[activeChat].push({role:role||"assistant",content:String(text),ts:Date.now()});
  renderChat();
  saveAll();
}
  <script>
async function sendToAIStream(text){
  loadingBubble();
  try{
    const history=[
      {role:"system",content:lang==="de"?"Du antwortest freundlich und hilfst.":"You respond friendly and helpful."},
      ...(Array.isArray(chats[activeChat])?chats[activeChat]:[]),
      {role:"user",content:String(text)}
    ];
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},
      body:JSON.stringify({model:MODEL,messages:history,stream:true,temperature:0.7})
    });
    if(!res.body){ removeLoading(); addMessage("assistant","⚠️ Keine Streaming‑Antwort vom Server."); return; }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let done=false;
    let assistantText="";
    const chatEl=document.getElementById("chat");
    const row=document.createElement("div");
    row.className="msg-row assistant-row";
    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent="";
    row.appendChild(bubble);
    chatEl.appendChild(row);
    chatEl.scrollTop=chatEl.scrollHeight;
    while(!done){
      const {value,done:doneReading} = await reader.read();
      done = doneReading;
      if(value){
        const chunk = decoder.decode(value);
        assistantText += chunk;
        bubble.textContent = assistantText;
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }
    removeLoading();
    addMessage("assistant",assistantText);
  }catch(e){
    removeLoading();
    addMessage("assistant","Fehler: "+(e.message||String(e)));
  }
}

document.getElementById("sendBtn")?.addEventListener("click",()=>{
  const input=document.getElementById("userInput");
  if(!input) return;
  const t=String(input.value||"").trim();
  if(!t) return;
  input.value="";
  addMessage("user",t);
  sendToAIStream(t);
});

document.getElementById("userInput")?.addEventListener("keydown",e=>{
  if(e.key==="Enter") document.getElementById("sendBtn")?.click();
});

document.getElementById("menuBtn")?.addEventListener("click",()=>{
  const s=document.getElementById("menuSheet"); s.classList.toggle("open");
});

document.getElementById("tabsBtn")?.addEventListener("click",()=>{
  const s=document.getElementById("tabsSheet"); s.classList.toggle("open");
});

document.addEventListener("click",e=>{
  const menu=document.getElementById("menuSheet");
  const tabs=document.getElementById("tabsSheet");
  const side=document.getElementById("sidePanel");
  const menuBtn=document.getElementById("menuBtn");
  const tabsBtn=document.getElementById("tabsBtn");
  const sideOpen = side && side.classList.contains("open");
  if(menu && !menu.contains(e.target) && e.target!==menuBtn) menu.classList.remove("open");
  if(tabs && !tabs.contains(e.target) && e.target!==tabsBtn) tabs.classList.remove("open");
  if(side && sideOpen && !side.contains(e.target) && e.target!==document.getElementById("btn_todo")) side.classList.remove("open");
});

document.getElementById("btn_newchat")?.addEventListener("click",()=>{ 
  newChat(); 
  document.getElementById("menuSheet").classList.remove("open"); 
});

document.getElementById("tabs_newchat")?.addEventListener("click",()=>{ 
  newChat(); 
  document.getElementById("tabsSheet").classList.remove("open"); 
});

document.getElementById("btn_deletechat")?.addEventListener("click",()=>{ 
  deleteChat(); 
  document.getElementById("menuSheet").classList.remove("open"); 
});

document.getElementById("btn_todo")?.addEventListener("click",()=>{
  const side=document.getElementById("sidePanel"); 
  side.classList.toggle("open"); 
  document.getElementById("menuSheet").classList.remove("open");
});

document.getElementById("todoAdd")?.addEventListener("click",()=>{
  const v=document.getElementById("todoInput").value; 
  if(!v) return; 
  addTodo(v); 
  document.getElementById("todoInput").value="";
});

document.getElementById("btn_cache")?.addEventListener("click",()=>{
  const size = (JSON.stringify(localStorage).length/1024).toFixed(1);
  alert("Lokaler Speicher: ~"+size+" KB");
});

document.getElementById("clearCache")?.addEventListener("click",()=>{
  clearCache(); 
  alert("Cache geleert");
});

document.getElementById("autoCleanup")?.addEventListener("click",()=>{
  toggleAutoCleanup();
});

document.getElementById("btn_theme")?.addEventListener("click",()=>{
  theme = theme==="purple"?"blue": theme==="blue"?"green":"purple";
  applyTheme(theme);
  document.getElementById("menuSheet").classList.remove("open");
});

document.getElementById("avatarBtn")?.addEventListener("click",()=> document.getElementById("avatarUpload").click());

document.getElementById("avatarUpload")?.addEventListener("change",e=>{
  const f=e.target.files && e.target.files[0]; 
  if(!f) return; 
  setAvatarFromFile(f);
});

document.getElementById("nameInput")?.addEventListener("input",e=>{
  const v=e.target.value||"";
  document.getElementById("avatarPreview").textContent = v? v.charAt(0).toUpperCase() : "F";
  saveAll();
  updateHeader();
});

document.getElementById("btn_profile")?.addEventListener("click",()=>{ 
  document.getElementById("sidePanel").classList.toggle("open"); 
  document.getElementById("menuSheet").classList.remove("open"); 
});

document.getElementById("btn_about")?.addEventListener("click",()=>{ 
  alert("Febl KI — Mobile & Desktop App"); 
  document.getElementById("menuSheet").classList.remove("open"); 
});

document.getElementById("btn_support")?.addEventListener("click",()=>{ 
  window.location.href="https://febl-industry-3.jimdosite.com/kontakt/"; 
});

document.getElementById("btn_deletechat")?.addEventListener("dblclick",()=>{ 
  chats=[]; 
  chats=[[]]; 
  activeChat=0; 
  saveAll(); 
  renderTabs(); 
  renderChat(); 
});

const emojis = ["😀","😄","😅","😂","😊","😉","😍","🤔","😴","😎","👍","🙏","🔥","✨","🎉","💡","✅","❌","📎","📝"];
const picker=document.getElementById("emojiPicker");
emojis.forEach(e=>{
  const b=document.createElement("div");
  b.className="emoji-btn";
  b.textContent=e;
  b.addEventListener("click",()=>{ 
    const input=document.getElementById("userInput"); 
    input.value = (input.value||"") + e; 
    input.focus(); 
    picker.style.display="none"; 
  });
  picker.appendChild(b);
});

document.getElementById("emojiBtn")?.addEventListener("click",()=>{
  const p=document.getElementById("emojiPicker");
  p.style.display = p.style.display==="none" ? "flex" : "none";
});

document.getElementById("micBtn")?.addEventListener("click",()=>{
  if(!navigator.mediaDevices || !window.MediaRecorder){ 
    alert("Mikrofon nicht verfügbar"); 
    return; 
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const rec = new MediaRecorder(stream);
    const chunks=[];
    rec.ondataavailable = ev => chunks.push(ev.data);
    rec.onstop = async ()=>{
      const blob = new Blob(chunks,{type:'audio/webm'});
      addMessage("user","🎤 Sprachaufnahme gesendet");
      sendToAIStream("Sprachaufnahme erhalten (Dateiname: audio.webm)");
      stream.getTracks().forEach(t=>t.stop());
    };
    rec.start();
    setTimeout(()=>rec.stop(),5000);
  }).catch(()=>alert("Zugriff verweigert"));
});

function periodicCleanup(){
  if(!autoCleanupEnabled) return;
  const now=Date.now();
  const maxAge = 1000*60*60*24*30;
  for(let i=chats.length-1;i>=0;i--){
    const c=chats[i];
    if(Array.isArray(c) && c.length>0){
      const last = c[c.length-1];
      if(last && last.ts && (now - last.ts) > maxAge){
        chats.splice(i,1);
      }
    } else if(Array.isArray(c) && c.length===0 && chats.length>1){
      chats.splice(i,1);
    }
  }
  limitChats();
  saveAll();
}

setInterval(periodicCleanup,1000*60*60);

(function initParticles(){
  const canvas = document.getElementById("particles");
  canvas.style.position="fixed"; canvas.style.left="0"; canvas.style.top="0"; canvas.style.width="100%"; canvas.style.height="100%"; canvas.style.zIndex="0";
  const ctx = canvas.getContext && canvas.getContext("2d");
  if(!ctx) return;
  function fit(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  fit(); window.addEventListener("resize",fit);
  const parts=[];
  for(let i=0;i<80;i++) parts.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+0.6,dx:(Math.random()-0.5)*0.4,dy:(Math.random()-0.5)*0.4,alpha:Math.random()*0.6+0.1});
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(p=>{
      ctx.beginPath();
      ctx.fillStyle = "rgba(124,58,237,"+p.alpha+")";
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      p.x+=p.dx; p.y+=p.dy;
      if(p.x<0||p.x>canvas.width) p.dx*=-1;
      if(p.y<0||p.y>canvas.height) p.dy*=-1;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

loadAll();
addMessage("assistant", lang==="de" ? "Hallo Felix! Wie kann ich dir helfen?" : "Hello Felix! How can I help you?");
</script>
