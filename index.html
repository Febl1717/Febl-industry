<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Febl Industry KI</title>
    <style>
        body {
            background: #0a0a0a;
            color: #0ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        .ai-box {
            width: 400px;
            margin: auto;
            padding: 20px;
            border: 2px solid #0ff;
            border-radius: 10px;
            box-shadow: 0 0 20px #0ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px #0ff; }
            50% { box-shadow: 0 0 25px #0ff; }
            100% { box-shadow: 0 0 10px #0ff; }
        }

        #userInput {
            width: 80%;
            padding: 10px;
            margin-top: 20px;
            border-radius: 5px;
            border: none;
            outline: none;
        }

        #sendBtn {
            margin-top: 10px;
            padding: 10px 20px;
            background: #0ff;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #sendBtn:hover {
            background: #00cccc;
        }

        #output {
            margin-top: 20px;
            text-align: left;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        .answer {
            background: #111;
            padding: 10px;
            margin-top: 10px;
            border-left: 3px solid #0ff;
            opacity: 0;
            transform: translateY(10px);
            animation: appear 0.4s forwards;
        }

        @keyframes appear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="ai-box">
        <h1>Febl Industry KI</h1>

        <input id="userInput" type="text" placeholder="Frage eingeben...">
        <button id="sendBtn">Senden</button>

        <div id="output"></div>
    </div>

    <script>
        document.getElementById("sendBtn").addEventListener("click", () => {
            const input = document.getElementById("userInput").value.trim();

            if (input === "") {
                printAnswer("Bitte eine Frage eingeben.");
                return;
            }

            reply(input);
            document.getElementById("userInput").value = "";
        });

        function reply(question) {
            printAnswer("Verarbeite: " + question);
        }

        function printAnswer(text) {
            const box = document.getElementById("output");
            const div = document.createElement("div");
            div.className = "answer";
            div.innerText = text;
            box.appendChild(div);
        }
    </script>

</body>
</html>
