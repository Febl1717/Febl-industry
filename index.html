<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Febl KI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}

/* COLORS */
:root{
  --c1:#0a0b1f;--c2:#13143a;--c3:#1a1b4a;--c4:#1e1f4d;
  --assistant:#1e1f4d;--user:#7c3aed;--accent:#7c3aed;
  --t1:#fff;--t2:#e9d5ff;
  --vh:1vh;
}

/* LAYOUT */
html,body{height:100%}
body{
  background:linear-gradient(180deg,var(--c1),#070717);
  color:var(--t1);
  height:calc(var(--vh)*100);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  height:60px;background:var(--c3);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;color:var(--t2);font-size:20px;font-weight:600;
}

/* CHAT */
.chat{
  flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;
}

/* BUBBLES */
.msg-row{display:flex}
.user-row{justify-content:flex-end}
.msg-bubble{
  max-width:80%;padding:12px 16px;border-radius:16px;font-size:15px;
}
.user-row .msg-bubble{background:var(--user)}
.assistant-row .msg-bubble{background:var(--assistant)}

/* IMAGE BUBBLE */
.msg-bubble img{
  max-width:100%;border-radius:12px;cursor:pointer;
  transition:transform .2s ease;
}
.msg-bubble img:hover{transform:scale(1.02)}

/* INPUT BAR */
.input-bar{
  padding:12px;background:transparent;display:flex;justify-content:center;
}
.input-box{
  width:96%;background:var(--c4);border-radius:999px;padding:10px 12px;
  display:flex;gap:10px;align-items:center;
}
#userInput{
  flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;
}

/* ANIMATED IMAGE BUTTON */
.img-btn{
  width:48px;height:48px;border:none;border-radius:14px;
  background:#7c3aed;color:#fff;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s cubic-bezier(.2,.9,.2,1), box-shadow .25s;
  box-shadow:0 6px 18px rgba(0,0,0,.45);
}
.img-btn:hover{
  transform:translateY(-4px) scale(1.05);
  box-shadow:0 14px 30px rgba(0,0,0,.55);
}
.img-btn:active{
  transform:scale(.95);
}

/* LOADING SPINNER */
.spinner{
  width:32px;height:32px;border:4px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;
  animation:spin 0.8s linear infinite;margin:auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* FULLSCREEN VIEWER */
#viewer{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  display:none;justify-content:center;align-items:center;
  z-index:9999;
}
#viewer img{
  max-width:90%;max-height:90%;border-radius:12px;
}
#viewerClose{
  position:absolute;top:20px;right:20px;font-size:32px;color:#fff;cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <div>Febl KI</div>
</div>

<div class="chat" id="chat"></div>

<div class="input-bar">
  <div class="input-box">
    <input id="userInput" type="text" placeholder="Bild‑Prompt eingeben…">
    <button class="img-btn" id="imgBtn">🖼</button>
  </div>
</div>

<!-- FULLSCREEN VIEWER -->
<div id="viewer">
  <div id="viewerClose">✕</div>
  <img id="viewerImg">
</div>

<script>
(() => {
  "use strict";

  const API_KEY = "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";
  const MODEL_IMAGE = "groq/flux-schnell";
  const API_IMG = "https://api.groq.com/openai/v1/images/generations";

  let chats = [[]];
  let activeChat = 0;

  const $ = id => document.getElementById(id);

  /* RENDER CHAT */
  function renderChat(){
    const chat = $("chat");
    chat.innerHTML = "";
    chats[activeChat].forEach(m=>{
      const row = document.createElement("div");
      row.className = "msg-row assistant-row";

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";

      if(m.type === "image"){
        const img = document.createElement("img");
        img.src = m.url;
        img.onclick = ()=>openViewer(m.url);
        bubble.appendChild(img);
      } else {
        bubble.textContent = m.content;
      }

      row.appendChild(bubble);
      chat.appendChild(row);
    });

    chat.scrollTop = chat.scrollHeight;
  }

  function addImage(url){
    chats[activeChat].push({type:"image",url});
    renderChat();
  }

  /* FULLSCREEN VIEWER */
  function openViewer(url){
    $("viewerImg").src = url;
    $("viewer").style.display = "flex";
  }
  $("viewerClose").onclick = ()=> $("viewer").style.display = "none";

  /* LOADING SPINNER */
  function showSpinner(){
    const chat = $("chat");
    const row = document.createElement("div");
    row.className = "msg-row assistant-row";
    row.id = "spinnerRow";

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";

    const sp = document.createElement("div");
    sp.className = "spinner";

    bubble.appendChild(sp);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }
  function hideSpinner(){
    const s = $("spinnerRow");
    if(s) s.remove();
  }

  /* IMAGE GENERATION */
  async function generateImage(prompt){
    showSpinner();

    try{
      const res = await fetch(API_IMG,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+API_KEY
        },
        body:JSON.stringify({
          model:MODEL_IMAGE,
          prompt:String(prompt),
          size:"1024x1024"
        })
      });

      const data = await res.json();
      hideSpinner();

      const url = data?.data?.[0]?.url || null;
      const b64 = data?.data?.[0]?.b64_json || null;

      if(b64){
        const blob = b64ToBlob(b64);
        const objUrl = URL.createObjectURL(blob);
        addImage(objUrl);
        return;
      }

      if(url){
        addImage(url);
      }

    }catch(e){
      hideSpinner();
      chats[activeChat].push({content:"Fehler: "+e.message});
      renderChat();
    }
  }

  function b64ToBlob(b64){
    const byteChars = atob(b64);
    const byteArrays = [];
    for(let offset=0;offset<byteChars.length;offset+=512){
      const slice = byteChars.slice(offset,offset+512);
      const nums = new Array(slice.length);
      for(let i=0;i<slice.length;i++) nums[i]=slice.charCodeAt(i);
      byteArrays.push(new Uint8Array(nums));
    }
    return new Blob(byteArrays,{type:"image/png"});
  }

  /* BUTTON EVENT */
  $("imgBtn").onclick = ()=>{
    const prompt = $("userInput").value.trim();
    if(!prompt){
      chats[activeChat].push({content:"Bitte gib einen Bild‑Prompt ein."});
      renderChat();
      return;
    }
    $("userInput").value = "";
    generateImage(prompt);
  };

})();
</script>
</body>
</html>
