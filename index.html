<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Febl KI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}

:root{
--c1:#0a0b1f;--c2:#13143a;--c3:#1a1b4a;--c4:#1e1f4d;
--assistant:#1e1f4d;--user:#7c3aed;--accent:#7c3aed;
--t1:#fff;--t2:#e9d5ff;
}

body{background:var(--c1);color:var(--t1);height:100vh;display:flex;flex-direction:column;overflow:hidden}

#intro{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:9999;transition:1s}
#intro h1{font-size:48px;color:#fff;animation:introZoom 1.4s ease}
@keyframes introZoom{0%{transform:scale(0.4);opacity:0}100%{transform:scale(1);opacity:1}}

#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

.header{height:60px;background:var(--c3);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--t2);font-size:20px;font-weight:600}

.header-btn{width:40px;height:40px;border-radius:10px;background:var(--c4);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;cursor:pointer}

.chat{flex:1;overflow-y:auto;padding:16px;z-index:1}

.msg-row{margin-bottom:16px;display:flex;animation:bubbleIn .25s ease}
@keyframes bubbleIn{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}

.msg-bubble{max-width:80%;padding:12px 16px;border-radius:18px;font-size:16px;line-height:1.5;white-space:pre-wrap}

.user-row{justify-content:flex-end}
.user-row .msg-bubble{background:var(--user)}

.assistant-row .msg-bubble{background:var(--assistant);border:1px solid rgba(255,255,255,.1)}

.input-bar{padding:10px;background:var(--c1);display:flex;justify-content:center}
.input-box{width:95%;background:var(--c4);border-radius:30px;padding:10px 16px;display:flex;gap:10px;align-items:center}

#userInput{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-size:18px}

.send-btn{width:44px;height:44px;background:var(--accent);border:none;border-radius:50%;color:#fff;font-size:22px;cursor:pointer}

.upload-btn{width:44px;height:44px;background:#444;border:none;border-radius:50%;color:#fff;font-size:22px;cursor:pointer}

.bottom-sheet{position:fixed;left:0;right:0;bottom:-100%;background:var(--c2);padding:20px;border-radius:20px 20px 0 0;transition:.3s;z-index:999}
.bottom-sheet.open{bottom:0}

.tabs-sheet{position:fixed;left:0;right:0;bottom:-100%;background:var(--c2);padding:20px;border-radius:20px 20px 0 0;transition:.3s;z-index:999}
.tabs-sheet.open{bottom:0}

.sheet-btn{width:100%;padding:14px;background:var(--c4);border-radius:12px;color:#fff;font-size:18px;margin-bottom:10px;text-align:center}

.tab-item{padding:14px;background:var(--c4);border-radius:12px;color:#fff;font-size:18px;margin-bottom:10px;text-align:center}

@media(min-width:700px){
  .bottom-sheet{
    width:300px;height:100%;right:-300px;left:auto;top:0;bottom:0;border-radius:0;
  }
  .bottom-sheet.open{right:0}

  .tabs-sheet{
    width:300px;height:100%;left:-300px;top:0;bottom:0;border-radius:0;
  }
  .tabs-sheet.open{left:0}
}
</style>
</head>

<body>

<div id="intro"><h1>Febl KI</h1></div>
<canvas id="particles"></canvas>

<div class="header">
<div class="header-btn" id="menuBtn">☰</div>
<div id="txt_header">Febl KI</div>
<div class="header-btn" id="tabsBtn">⋮</div>
</div>

<div class="chat" id="chat"></div>

<div class="input-bar">
<div class="input-box">
<button class="upload-btn" id="uploadBtn">📎</button>
<input id="fileInput" type="file" style="display:none">
<input id="userInput" type="text" placeholder="Nachricht eingeben…">
<button class="send-btn" id="sendBtn">➤</button>
</div>
</div>

<div class="bottom-sheet" id="menuSheet">
<div class="sheet-btn" id="btn_newchat">Neuer Chat</div>
<div class="sheet-btn" id="btn_deletechat">Chat löschen</div>
<div class="sheet-btn" id="btn_lang">Sprache</div>
<div class="sheet-btn" id="btn_theme">Theme</div>
<div class="sheet-btn" id="btn_home">Home</div>
<div class="sheet-btn" id="btn_about">Über Febl</div>
<div class="sheet-btn" id="btn_support">Support</div>
<div class="sheet-btn">Version 1.0</div>
</div>

<div class="tabs-sheet" id="tabsSheet">
<div id="tabsList"></div>
<div class="sheet-btn" id="tabs_newchat">Neuer Chat</div>
</div>

<script>
const API_KEY="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";
  const MODEL="groq/compound-mini";
const API_URL="https://api.groq.com/openai/v1/chat/completions";

let lang="de";
let theme="purple";
let chats=[];
let activeChat=0;

function safeInit(){
  if(!Array.isArray(chats)) chats=[[]];
  if(chats.length===0) chats=[[]];
  if(activeChat<0) activeChat=0;
  if(activeChat>=chats.length) activeChat=0;
  if(!Array.isArray(chats[activeChat])) chats[activeChat]=[];
}

const ui={
de:{header:"Febl KI",placeholder:"Nachricht eingeben…",chat:"Chat ",newchat:"Neuer Chat",delete:"Chat löschen",lang:"Sprache",theme:"Theme",home:"Home",about:"Über Febl",support:"Support"},
en:{header:"Febl AI",placeholder:"Type a message…",chat:"Chat ",newchat:"New chat",delete:"Delete chat",lang:"Language",theme:"Theme",home:"Home",about:"About Febl",support:"Support"}
};

function saveAll(){
  localStorage.setItem("febl_chats",JSON.stringify(chats));
  localStorage.setItem("febl_lang",lang);
  localStorage.setItem("febl_theme",theme);
  localStorage.setItem("febl_activeChat",activeChat);
}

function loadAll(){
  const c=localStorage.getItem("febl_chats");
  const l=localStorage.getItem("febl_lang");
  const t=localStorage.getItem("febl_theme");
  const a=localStorage.getItem("febl_activeChat");

  if(c) chats=JSON.parse(c);
  if(l) lang=l;
  if(t) theme=t;
  if(a) activeChat=parseInt(a);

  safeInit();
  applyTheme(theme);
  applyLanguage();
  renderTabs();
  renderChat();
}

function applyLanguage(){
  document.getElementById("txt_header").textContent=ui[lang].header;
  document.getElementById("userInput").placeholder=ui[lang].placeholder;

  document.getElementById("btn_newchat").textContent=ui[lang].newchat;
  document.getElementById("btn_deletechat").textContent=ui[lang].delete;
  document.getElementById("btn_lang").textContent=ui[lang].lang;
  document.getElementById("btn_theme").textContent=ui[lang].theme;
  document.getElementById("btn_home").textContent=ui[lang].home;
  document.getElementById("btn_about").textContent=ui[lang].about;
  document.getElementById("btn_support").textContent=ui[lang].support;

  document.getElementById("tabs_newchat").textContent=ui[lang].newchat;

  renderTabs();
  saveAll();
}

function set(v,x){document.documentElement.style.setProperty(v,x)}

function applyTheme(t){
  theme=t;

  if(t==="purple"){
    set("--c1","#0a0b1f");set("--c2","#13143a");set("--c3","#1a1b4a");set("--c4","#1e1f4d");
    set("--assistant","#1e1f4d");set("--user","#7c3aed");set("--accent","#7c3aed");
  }
  if(t==="blue"){
    set("--c1","#001a33");set("--c2","#00264d");set("--c3","#003366");set("--c4","#004080");
    set("--assistant","#004080");set("--user","#3399ff");set("--accent","#3399ff");
  }
  if(t==="red"){
    set("--c1","#330000");set("--c2","#4d0000");set("--c3","#660000");set("--c4","#800000");
    set("--assistant","#800000");set("--user","#ff3333");set("--accent","#ff3333");
  }
  if(t==="green"){
    set("--c1","#00261a");set("--c2","#003322");set("--c3","#004d33");set("--c4","#006644");
    set("--assistant","#006644");set("--user","#33cc99");set("--accent","#33cc99");
  }
  if(t==="black"){
    set("--c1","#000");set("--c2","#0d0d0d");set("--c3","#1a1a1a");set("--c4","#262626");
    set("--assistant","#262626");set("--user","#3b82f6");set("--accent","#3b82f6");
  }

  saveAll();
}

function newChat(){
  chats.push([]);
  activeChat=chats.length-1;
  safeInit();
  renderTabs();
  renderChat();
  saveAll();
}

function deleteChat(){
  if(chats.length>1){
    chats.splice(activeChat,1);
    activeChat=0;
  } else {
    chats[0]=[];
  }
  safeInit();
  renderTabs();
  renderChat();
  saveAll();
}

function renderTabs(){
  safeInit();
  const list=document.getElementById("tabsList");
  list.innerHTML="";
  chats.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="tab-item";
    div.textContent=ui[lang].chat+(i+1);
    div.onclick=()=>{activeChat=i;closeTabs();renderTabs();renderChat();saveAll()};
    list.appendChild(div);
  });
}

function renderChat(){
  safeInit();
  const chat=document.getElementById("chat");
  chat.innerHTML="";
  chats[activeChat].forEach(m=>{
    const row=document.createElement("div");
    row.className="msg-row "+(m.role==="user"?"user-row":"assistant-row");
    const bubble=document.createElement("div");
    bubble.className="msg-bubble";
    bubble.textContent=m.content;
    row.appendChild(bubble);
    chat.appendChild(row);
  });
  chat.scrollTop=chat.scrollHeight;
}

function addMessage(role,text){
  safeInit();
  chats[activeChat].push({role,content:text});
  renderChat();
  saveAll();
}

function loading(){
  const chat=document.getElementById("chat");
  const row=document.createElement("div");
  row.className="msg-row assistant-row";
  row.id="loadingBubble";
  const bubble=document.createElement("div");
  bubble.className="msg-bubble";
  bubble.textContent="…";
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
}

function removeLoading(){
  const el=document.getElementById("loadingBubble");
  if(el)el.remove();
}

async function sendToAI(text){
  loading();
  try{
    const history=[
      {role:"system",content:lang==="de"?"Du antwortest freundlich und hilfst.":"You respond friendly and helpful."},
      ...(chats[activeChat]||[]),
      {role:"user",content:text}
    ];

    const res=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},
      body:JSON.stringify({model:MODEL,messages:history})
    });

    const data=await res.json();
    removeLoading();
    addMessage("assistant",data.choices[0].message.content);
  }catch(e){
    removeLoading();
    addMessage("assistant","Fehler: "+e.message);
  }
}

document.getElementById("sendBtn").onclick=()=>{
  const t=document.getElementById("userInput").value.trim();
  if(!t)return;
  document.getElementById("userInput").value="";
  addMessage("user",t);
  sendToAI(t);
};

document.getElementById("userInput").onkeydown=e=>{
  if(e.key==="Enter")document.getElementById("sendBtn").click();
};

document.getElementById("uploadBtn").onclick=()=>document.getElementById("fileInput").click();

document.getElementById("fileInput").onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  addMessage("user","📎 "+f.name);
  sendToAI("Analysiere Datei: "+f.name);
};

function openMenu(){document.getElementById("menuSheet").classList.toggle("open")}
function closeMenu(){document.getElementById("menuSheet").classList.remove("open")}
function openTabs(){document.getElementById("tabsSheet").classList.toggle("open")}
function closeTabs(){document.getElementById("tabsSheet").classList.remove("open")}

document.getElementById("menuBtn").onclick=openMenu;
document.getElementById("tabsBtn").onclick=openTabs;

document.addEventListener("click",e=>{
  const menu=document.getElementById("menuSheet");
  const tabs=document.getElementById("tabsSheet");
  const menuBtn=document.getElementById("menuBtn");
  const tabsBtn=document.getElementById("tabsBtn");

  if(!menu.contains(e.target) && e.target!==menuBtn){
    menu.classList.remove("open");
  }

  if(!tabs.contains(e.target) && e.target!==tabsBtn){
    tabs.classList.remove("open");
  }
});

document.getElementById("btn_newchat").onclick=()=>{newChat();closeMenu()};
document.getElementById("btn_deletechat").onclick=()=>{deleteChat();closeMenu()};
document.getElementById("btn_lang").onclick=()=>{lang=lang==="de"?"en":"de";applyLanguage();closeMenu()};
document.getElementById("btn_theme").onclick=()=>{theme=theme==="purple"?"blue":"purple";applyTheme(theme);closeMenu()};
document.getElementById("btn_home").onclick=()=>window.location.href="https://febl-industry-3.jimdosite.com/";
document.getElementById("btn_about").onclick=()=>window.location.href="https://febl-industry-3.jimdosite.com/ueber-mich/";
document.getElementById("btn_support").onclick=()=>window.location.href="https://febl-industry-3.jimdosite.com/kontakt/";

document.getElementById("tabs_newchat").onclick=()=>{newChat();closeTabs()};

setTimeout(()=>document.getElementById("intro").style.opacity="0",1200);
setTimeout(()=>document.getElementById("intro").style.display="none",2200);

const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<60;i++){
  particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*3+1,dx:(Math.random()-0.5)*0.6,dy:(Math.random()-0.5)*0.6});
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.3)";
    ctx.fill();
    p.x+=p.dx;p.y+=p.dy;
    if(p.x<0||p.x>canvas.width)p.dx*=-1;
    if(p.y<0||p.y>canvas.height)p.dy*=-1;
  });
  requestAnimationFrame(animate);
}
animate();

loadAll();
addMessage("assistant",lang==="de"?"Hallo Felix! Wie kann ich dir helfen?":"Hello Felix! How can I help you?");
</script>

</body>
</html>
