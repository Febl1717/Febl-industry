<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl industry KI (open beta)</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: #0a0f1c;
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 900px;
        height: 90vh;
        background: #0f172a;
        border-radius: 22px;
        border: 1px solid rgba(148,163,184,0.25);
        box-shadow: 0 0 40px rgba(0,0,0,0.45);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Handy-Optimierung */
    @media (max-width: 600px) {
        .app {
            width: 100%;
            height: 100vh;
            border-radius: 0;
        }
    }

    .header {
        padding: 18px 26px;
        font-size: 18px;
        font-weight: 600;
        border-bottom: 1px solid rgba(148,163,184,0.25);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        scroll-behavior: smooth;
    }

    .msg-row {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
    }

    .msg-label {
        font-size: 12px;
        opacity: 0.6;
        margin-bottom: 6px;
    }

    .msg-bubble {
        max-width: 80%;
        padding: 14px 18px;
        border-radius: 16px;
        font-size: 15px;
        line-height: 1.6;
        white-space: pre-wrap;
        backdrop-filter: blur(10px);
    }

    .user .msg-bubble {
        margin-left: auto;
        background: #1d4ed8;
        color: #e5e7eb;
        box-shadow: 0 0 12px rgba(29,78,216,0.4);
    }

    .ai .msg-bubble {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(148,163,184,0.3);
    }

    .footer {
        padding: 18px 26px;
        border-top: 1px solid rgba(148,163,184,0.25);
        display: flex;
        gap: 12px;
    }

    #userInput {
        flex: 1;
        background: #0a0f1c;
        border: 1px solid rgba(148,163,184,0.35);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 16px;
        color: #e5e7eb;
        outline: none;
        transition: 0.2s;
    }

    #userInput:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 10px rgba(59,130,246,0.4);
    }

    .send-btn {
        padding: 14px 22px;
        background: #3b82f6;
        border-radius: 14px;
        border: none;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    .send-btn:hover {
        background: #2563eb;
        box-shadow: 0 0 12px rgba(37,99,235,0.5);
    }

    /* Popup */
    .popup {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(6px);
        z-index: 999;
        opacity: 1;
        transition: opacity 0.4s ease;
    }

    .popup.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .popup-content {
        background: #0f172a;
        padding: 30px;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.35);
        box-shadow: 0 0 25px rgba(0,0,0,0.45);
        text-align: center;
        width: 300px;
    }

    #nameInput {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid rgba(148,163,184,0.35);
        background: #0a0f1c;
        color: #e5e7eb;
        margin-bottom: 20px;
        font-size: 16px;
    }

    #saveNameBtn {
        width: 100%;
        padding: 12px;
        background: #3b82f6;
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    #saveNameBtn:hover {
        background: #2563eb;
    }
</style>
</head>
<body>

<!-- Popup -->
<div id="namePopup" class="popup">
    <div class="popup-content">
        <h2>Wie heißt du?</h2>
        <input id="nameInput" type="text" placeholder="Dein Name">
        <button id="saveNameBtn">Speichern</button>
    </div>
</div>

<div class="app">
    <div class="header">
        Febl industry KI (open beta)
        <span class="status">bereit</span>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <input id="userInput" type="text" placeholder="Schreibe etwas …">
        <button class="send-btn" id="sendBtn">Senden</button>
    </div>
</div>

<script>
// ⭐ API KEY
const API_KEY = "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";

// ⭐ Modell
const MODEL = "groq/compound-mini";

// ⭐ API URL
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

let userName = localStorage.getItem("feblUserName");

if (!userName) {
    document.getElementById("namePopup").classList.remove("hidden");
}

document.getElementById("saveNameBtn").addEventListener("click", () => {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) return;

    localStorage.setItem("feblUserName", name);
    userName = name;

    document.getElementById("namePopup").classList.add("hidden");

    addMessage("ai", `Hallo ${userName}! Schön dich zu sehen. Ich bin Febl industry KI.`);
});

let messages = [
    {
        role: "system",
        content: `Du bist Febl industry KI (open beta). Du antwortest IMMER ausschließlich auf Deutsch. Sprich den Nutzer mit seinem Namen (${userName || "Nutzer"}) an.`
    }
];

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = "msg-row " + role;

    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = role === "user" ? userName : "Febl industry KI";

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";
    bubble.textContent = text;

    row.appendChild(label);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

async function sendToAPI(userText) {
    messages.push({ role: "user", content: userText });

    const limitedMessages = messages.slice(-10);

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: MODEL,
                messages: limitedMessages
            })
        });

        const data = await res.json();

        if (!res.ok) {
            addMessage("ai", "API‑Fehler:\n" + JSON.stringify(data, null, 2));
            return;
        }

        const reply = data.choices[0].message.content;
        messages.push({ role: "assistant", content: reply });
        addMessage("ai", reply);

    } catch (e) {
        addMessage("ai", "Fehler:\n" + e.message);
    }
}

function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage("user", text);
    sendToAPI(text);
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
</script>

</body>
</html>
