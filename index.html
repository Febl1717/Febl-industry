<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Febl Chat – Groq KI</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #0a1224;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* LOADING SCREEN */
    .loader-screen {
        position: absolute;
        inset: 0;
        background: #0a1224;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
        animation: fadeOut 0.8s ease forwards;
        animation-delay: 2.2s;
    }

    .loader-circle {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 6px solid rgba(255,255,255,0.1);
        border-top-color: #3b82f6;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
        font-size: 18px;
        letter-spacing: 1px;
        color: #cbd5e1;
        animation: fadeIn 1s ease;
    }

    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    /* MAIN APP */
    .app {
        width: 900px;
        max-width: 95vw;
        height: 85vh;
        background: #0f1a33;
        border-radius: 18px;
        border: 1px solid rgba(148,163,184,0.25);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
        opacity: 0;
        animation: appFadeIn 1s ease forwards;
        animation-delay: 2.3s;
    }

    @keyframes appFadeIn { to { opacity: 1; } }

    .header {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: #0d1730;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .chat {
        padding: 20px;
        overflow-y: auto;
    }

    .msg-row {
        display: flex;
        margin-bottom: 14px;
        opacity: 0;
        transform: translateY(10px);
        animation: msgEnter 0.35s ease forwards;
    }

    @keyframes msgEnter {
        to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-bubble {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-wrap;
        animation: bubblePop 0.25s ease;
    }

    @keyframes bubblePop {
        0% { transform: scale(0.9); }
        100% { transform: scale(1); }
    }

    .msg-bubble.user {
        background: #1e3a8a;
        color: #e5e7eb;
        border-bottom-right-radius: 4px;
        box-shadow: 0 4px 12px rgba(30,58,138,0.4);
    }

    .msg-bubble.ai {
        background: #162447;
        color: #e5e7eb;
        border-bottom-left-radius: 4px;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 4px 12px rgba(22,36,71,0.4);
    }

    /* TYPING ANIMATION */
    .typing {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 16px;
        margin-bottom: 14px;
        background: #162447;
        border-radius: 14px;
        width: fit-content;
        border: 1px solid rgba(255,255,255,0.08);
        opacity: 0;
        animation: msgEnter 0.35s ease forwards;
    }

    .dot {
        width: 8px;
        height: 8px;
        background: #3b82f6;
        border-radius: 50%;
        animation: blink 1.4s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
        0% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 0.2; }
    }

    /* FOOTER */
    .footer {
        padding: 16px 20px;
        border-top: 1px solid rgba(255,255,255,0.08);
        background: #0d1730;
    }

    .input-wrapper {
        display: flex;
        gap: 12px;
        align-items: center;
        background: #0a1224;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.15);
        padding: 12px 16px;
    }

    #userInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #e5e7eb;
        font-size: 16px;
        outline: none;
    }

    #userInput::placeholder { color: #94a3b8; }

    .send-btn {
        padding: 10px 18px;
        border-radius: 10px;
        border: none;
        background: #1e3a8a;
        color: #e5e7eb;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    .send-btn:disabled {
        background: #0f1a33;
        color: #6b7280;
        cursor: not-allowed;
        opacity: 0.6;
    }

    .send-btn:hover:not(:disabled) {
        background: #2a4bb8;
    }
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<div class="loader-screen">
    <div class="loader-circle"></div>
    <div class="loader-text">Febl Chat wird geladen…</div>
</div>

<!-- MAIN APP -->
<div class="app">
    <div class="header">Febl Chat – Groq KI</div>

    <div class="chat" id="chat"></div>

    <div class="footer">
        <div class="input-wrapper">
            <input id="userInput" type="text" autocomplete="off" placeholder="Schreib etwas …">
            <button class="send-btn" id="sendBtn">Senden</button>
        </div>
    </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

const cooldown = 1000; // 1 Sekunde
const GROQ_API_KEY = "DEIN_KEY_HIER"; // <-- hier deinen Groq-Key eintragen
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const GROQ_MODEL = "llama-3.1-70b-versatile";

setTimeout(() => {
    addAI("Hey Felix! Ich bin jetzt mit echter Groq‑KI verbunden. Frag mich einfach etwas.");
}, 2600);

input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
sendBtn.addEventListener("click", send);

function send() {
    if (sendBtn.disabled) return;

    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addUser(text);
    typingAnimation();

    sendBtn.disabled = true;
    input.disabled = true;

    setTimeout(() => {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
    }, cooldown);
}

function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble user";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

function addAI(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble ai";
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

/* Typing-Animation */
function typingAnimation() {
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = `
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    `;
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    const userText = lastUserMessage();

    setTimeout(async () => {
        typing.remove();
        await callGroq(userText);
    }, 1200);
}

function lastUserMessage() {
    const bubbles = chat.querySelectorAll(".msg-bubble.user");
    return bubbles[bubbles.length - 1].textContent;
}

/* Groq API Call */
async function callGroq(prompt) {
    try {
        const res = await fetch("http://localhost:3000/api/groq", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: prompt })
        });

        const data = await res.json();
        const answer = data.choices?.[0]?.message?.content || "Keine Antwort.";
        addAI(answer);

    } catch (err) {
        addAI("Fehler: " + err);
    }
}

</script>

</body>
</html>
