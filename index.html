<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Febl KI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}

/* Farben */
:root{
  --bg:#0a0b1f;
  --bg2:#13143a;
  --accent:#7c3aed;
  --assistant:#1e1f4d;
  --user:#7c3aed;
  --text:#fff;
}

/* BODY */
body{
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  height:60px;
  background:var(--bg2);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.header-title{
  color:#fff;
  font-size:18px;
  font-weight:700;
  max-width:60vw;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.header-btn{
  width:40px;height:40px;
  background:#1e1f4d;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.msg-row{
  display:flex;
  margin-bottom:12px;
}

.msg-bubble{
  max-width:80%;
  padding:12px 16px;
  border-radius:16px;
  white-space:pre-wrap;
}

.user-row{justify-content:flex-end}
.user-row .msg-bubble{background:var(--user);color:#fff}

.assistant-row .msg-bubble{
  background:var(--assistant);
  color:#fff;
}

/* INPUT */
.input-bar{
  padding:12px;
  background:var(--bg);
}

.input-box{
  background:#1e1f4d;
  border-radius:30px;
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
}

#userInput{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  font-size:16px;
}

.send-btn{
  width:40px;height:40px;
  background:var(--accent);
  border:none;
  border-radius:50%;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

/* MENU */
.bottom-sheet{
  position:fixed;
  left:0;right:0;
  bottom:-100%;
  background:var(--bg2);
  padding:20px;
  border-radius:20px 20px 0 0;
  transition:.3s;
}
.bottom-sheet.open{bottom:0}

.sheet-item{
  padding:14px;
  background:#1e1f4d;
  border-radius:12px;
  color:#fff;
  margin-bottom:10px;
  text-align:center;
  cursor:pointer;
}

/* TABS */
.tabs-sheet{
  position:fixed;
  left:0;right:0;
  bottom:-100%;
  background:var(--bg2);
  padding:20px;
  border-radius:20px 20px 0 0;
  transition:.3s;
}
.tabs-sheet.open{bottom:0}

.tab-item{
  padding:14px;
  background:#1e1f4d;
  border-radius:12px;
  color:#fff;
  margin-bottom:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-btn" id="menuBtn">☰</div>
  <div class="header-title" id="txt_header">Febl KI</div>
  <div class="header-btn" id="tabsBtn">⋮</div>
</div>

<div class="chat" id="chat"></div>

<div class="input-bar">
  <div class="input-box">
    <input id="userInput" type="text" placeholder="Nachricht eingeben…">
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<!-- MENU -->
<div class="bottom-sheet" id="menuSheet">
  <div class="sheet-item" id="btn_newchat">Neuer Chat</div>
  <div class="sheet-item" id="btn_deletechat">Chat löschen</div>
</div>

<!-- TABS -->
<div class="tabs-sheet" id="tabsSheet">
  <div id="tabsList"></div>
  <div class="sheet-item" id="tabs_newchat">Neuer Chat</div>
</div>

<script>
  <script>
/* ===========================
   GROQ API
=========================== */
const API_KEY = "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";  
const API_URL = "https://api.groq.com/openai/v1/chat/completions";
const MODEL = "groq/compound-mini";

/* ===========================
   CHAT STORAGE
=========================== */
let chats = [[]];
let activeChat = 0;

/* ===========================
   HEADER UPDATE
=========================== */
function updateHeader() {
  const header = document.getElementById("txt_header");

  if (!chats[activeChat] || chats[activeChat].length === 0) {
    header.textContent = "Neuer Chat";
    return;
  }

  const last = chats[activeChat][chats[activeChat].length - 1].content;
  const short = last.split("\n")[0].slice(0, 40);

  header.textContent = short.length > 0 ? short + "…" : "Chat " + (activeChat + 1);
}

/* ===========================
   RENDER CHAT
=========================== */
function renderChat() {
  const chatEl = document.getElementById("chat");
  chatEl.innerHTML = "";

  chats[activeChat].forEach(msg => {
    const row = document.createElement("div");
    row.className = "msg-row " + (msg.role === "user" ? "user-row" : "assistant-row");

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";
    bubble.textContent = msg.content;

    row.appendChild(bubble);
    chatEl.appendChild(row);
  });

  chatEl.scrollTop = chatEl.scrollHeight;
  updateHeader();
}

/* ===========================
   ADD MESSAGE
=========================== */
function addMessage(role, text) {
  chats[activeChat].push({ role, content: text });
  renderChat();
}

/* ===========================
   STREAMING FROM GROQ
=========================== */
async function sendToGroqStream(userText) {
  addMessage("user", userText);

  // Loading bubble
  const chatEl = document.getElementById("chat");
  const row = document.createElement("div");
  row.className = "msg-row assistant-row";
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.textContent = "…";
  row.appendChild(bubble);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const history = [
      { role: "system", content: "Du bist eine hilfreiche KI." },
      ...chats[activeChat],
      { role: "user", content: userText }
    ];

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: history,
        stream: true
      })
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    let fullText = "";
    let done = false;

    while (!done) {
      const { value, done: doneReading } = await reader.read();
      done = doneReading;

      if (value) {
        const chunk = decoder.decode(value);
        fullText += chunk;
        bubble.textContent = fullText;
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    addMessage("assistant", fullText);

  } catch (err) {
    bubble.textContent = "Fehler: " + err.message;
  }
}

/* ===========================
   SEND BUTTON
=========================== */
document.getElementById("sendBtn").onclick = () => {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  sendToGroqStream(text);
};

/* ===========================
   ENTER SEND
=========================== */
document.getElementById("userInput").onkeydown = e => {
  if (e.key === "Enter") document.getElementById("sendBtn").click();
};

/* ===========================
   MENU
=========================== */
document.getElementById("menuBtn").onclick = () => {
  document.getElementById("menuSheet").classList.toggle("open");
};

/* ===========================
   TABS
=========================== */
document.getElementById("tabsBtn").onclick = () => {
  document.getElementById("tabsSheet").classList.toggle("open");
};

/* ===========================
   NEW CHAT
=========================== */
document.getElementById("btn_newchat").onclick = () => {
  chats.push([]);
  activeChat = chats.length - 1;
  renderTabs();
  renderChat();
  updateHeader();
  document.getElementById("menuSheet").classList.remove("open");
};

document.getElementById("tabs_newchat").onclick = () => {
  chats.push([]);
  activeChat = chats.length - 1;
  renderTabs();
  renderChat();
  updateHeader();
  document.getElementById("tabsSheet").classList.remove("open");
};

/* ===========================
   DELETE CHAT
=========================== */
document.getElementById("btn_deletechat").onclick = () => {
  if (chats.length > 1) {
    chats.splice(activeChat, 1);
    activeChat = Math.max(0, activeChat - 1);
  } else {
    chats[0] = [];
  }

  renderTabs();
  renderChat();
  updateHeader();
  document.getElementById("menuSheet").classList.remove("open");
};

/* ===========================
   RENDER TABS
=========================== */
function renderTabs() {
  const list = document.getElementById("tabsList");
  list.innerHTML = "";

  chats.forEach((c, i) => {
    const item = document.createElement("div");
    item.className = "tab-item";
    item.textContent = (i === activeChat ? "● " : "") + "Chat " + (i + 1);

    item.onclick = () => {
      activeChat = i;
      renderChat();
      updateHeader();
      document.getElementById("tabsSheet").classList.remove("open");
    };

    list.appendChild(item);
  });
}

/* ===========================
   CLICK OUTSIDE CLOSE
=========================== */
document.addEventListener("click", e => {
  const menu = document.getElementById("menuSheet");
  const tabs = document.getElementById("tabsSheet");

  if (!menu.contains(e.target) && e.target !== document.getElementById("menuBtn")) {
    menu.classList.remove("open");
  }

  if (!tabs.contains(e.target) && e.target !== document.getElementById("tabsBtn")) {
    tabs.classList.remove("open");
  }
});

/* ===========================
   INIT
=========================== */
renderTabs();
renderChat();
updateHeader();
</script>
